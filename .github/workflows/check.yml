# Checks the site, then publishes it.
#
# Publishing happens here rather than through GitHub's "Deploy from a branch"
# because the branch builder is invisible from outside the settings page: when
# it is misconfigured the site simply 404s and nothing says why. Every push now
# produces a run you can open, and a failure names its own cause.
#
# Settings -> Pages -> Source must therefore stay on "GitHub Actions". If it is
# switched back to a branch, the deploy step below fails loudly — which is the
# intended behaviour. A red run beats a silently stale site.
#
# What it checks first is the failure that actually hurts: a link a student
# clicks in the middle of a lesson, and an index page hand-edited away from the
# site map, which is lost the next time anyone regenerates.
name: Check and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race; a newer push supersedes one already queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Every internal link resolves
        run: |
          dead=0
          while IFS= read -r page; do
            dir=$(dirname "$page")
            # hrefs that are not external and not bare anchors
            grep -o 'href="[^"#][^"]*"' "$page" 2>/dev/null \
              | sed 's/^href="//; s/"$//' \
              | grep -v '^https\?:' \
              | grep -v '^mailto:' \
              | grep -v '^data:' \
              > /tmp/links || true
            while IFS= read -r link; do
              [ -z "$link" ] && continue
              target="$dir/${link%%#*}"
              if [ ! -e "$target" ] && [ ! -e "$target/index.html" ]; then
                echo "::error file=$page::dead link -> $link"
                dead=$((dead + 1))
              fi
            done < /tmp/links
          done < <(find . -name '*.html' -not -path './.git/*')
          echo "---"
          if [ "$dead" -gt 0 ]; then
            echo "$dead dead link(s)"; exit 1
          fi
          echo "all internal links resolve"

      - name: Every index page is what the site map generates
        run: |
          # tools/build_index_pages.py is the only place the navigation lives.
          # If someone hand-edits an index page, that edit is lost the next time
          # anyone runs the generator — so fail now rather than lose it later.
          python3 tools/build_index_pages.py > /dev/null
          if ! git diff --quiet; then
            echo "::error::an index page differs from what the site map generates"
            git diff --stat
            echo "Edit tools/build_index_pages.py and re-run it, do not edit index pages by hand."
            exit 1
          fi
          echo "index pages match the site map"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
