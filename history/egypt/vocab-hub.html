<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Every word for this topic, with a definition and a translation.">
<title>Vocab hub</title>
<style>
/* This page holds no words of its own. It reads the same eal.js and content.js
   the wall and the big-screen tool read, so it cannot teach a different
   definition — and adding a word anywhere adds it here. */
:root{
  --paper:#fbf7ee; --bg:#151a19; --ink:#20231f; --muted:#675f54; --line:#d4c8b6;
  --deep:#223f43; --band:#f5f0e6; --gold:#8b681e; --known:#2f6b52;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
     line-height:1.5}
header{background:var(--deep);color:var(--paper);padding:18px 20px 22px}
header .in{max-width:1000px;margin:0 auto}
.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;font-weight:800;opacity:.7}
h1{font-size:clamp(1.4rem,4vw,2rem);line-height:1.05;margin:.2rem 0 .35rem}
header p{font-size:.92rem;opacity:.92;max-width:70ch}
.back{display:inline-block;margin-top:10px;color:#fff;text-decoration:none;
      background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
      padding:4px 12px;border-radius:999px;font-size:.84rem}
main{max-width:1000px;margin:0 auto;padding:16px 20px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input,.bar select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;
                       font:inherit;background:var(--paper);color:var(--ink)}
.bar input{flex:1 1 14em}
.bar button{border:1px solid var(--line);background:var(--paper);color:var(--ink);
            border-radius:8px;padding:8px 12px;font:inherit;font-weight:700}
.bar button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.count{color:#cfc7b8;font-size:.86rem;margin-left:auto}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.w{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--deep);
   border-radius:10px;padding:11px 13px}
.w.shared{border-left-color:var(--gold)}
.w.known{border-left-color:var(--known);opacity:.62}
.w h3{font-size:1.02rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.w .star{margin-left:auto;border:0;background:none;font-size:1.1rem;line-height:1;color:var(--muted)}
.w.known .star{color:var(--known)}
.w p{font-size:.9rem;color:#3d3a33;margin-top:3px}
.w .tr{display:block;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
       font-size:1.05rem;font-weight:700;color:var(--deep)}
.w .warn{display:block;font-size:.74rem;color:var(--muted);font-style:italic;font-weight:400;margin-top:2px}
.tag{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
     background:var(--band);border-radius:4px;padding:1px 5px;color:var(--muted)}
.note{background:#1b2220;border:1px solid #33403c;border-radius:10px;padding:12px 14px;
      color:#cfc7b8;font-size:.84rem;margin-top:18px;line-height:1.5}
.note b{color:var(--paper)}
@media print{
  body{background:#fff} header{background:#fff;color:#000} .bar,.back,.star,.note{display:none}
  .grid{grid-template-columns:repeat(2,1fr)} .w{break-inside:avoid}
}
</style>
</head>
<body>
<header><div class="in">
  <div class="kicker" id="kicker"></div>
  <h1>Vocab hub</h1>
  <p>Every word this topic marks, with what it means. Pick a language and each word shows it too.
     Nothing you do here leaves this browser.</p>
  <a class="back" href="./">&larr; Back to the topic</a>
</div></header>

<main>
  <div class="bar">
    <input id="q" type="search" placeholder="Find a word…" aria-label="Find a word">
    <select id="lang" aria-label="Translate into"></select>
    <button id="onlyLeft" aria-pressed="false">Still learning only</button>
    <button id="print">Print</button>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>
</main>

<script src="../../eal.js"></script>
<script src="content.js"></script>
<script>
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

el("kicker").textContent = WALL.title;

/* One list, two sources, neither repeated: the words shared by every unit come
   from eal.js, this topic's own from its content.js. A word that appears in
   both is the shared one — the unit does not get to redefine it. */
const WORDS = (() => {
  const out = new Map();
  if (typeof GLOSS !== "undefined") {
    for (const [w, def] of Object.entries(GLOSS.tier3)) {
      const t = (typeof TIER3_T !== "undefined" && TIER3_T[w]) || null;
      out.set(w.toLowerCase(), { word: w, def, t, shared: false });
    }
  }
  if (typeof EAL !== "undefined") {
    for (const [w, e] of Object.entries(EAL)) {
      out.set(w.toLowerCase(), { word: w, def: e.en, t: e.t, shared: true });
    }
  }
  return [...out.values()].sort((a, b) => a.word.localeCompare(b.word));
})();

const LANGS = (typeof EAL_LANGS !== "undefined") ? EAL_LANGS : [];
el("lang").innerHTML = '<option value="">No translation</option>' +
  LANGS.map(l => `<option value="${l.code}">${esc(l.label)} · ${esc(l.english)}</option>`).join("");

const KEY = "vocabhub_" + WALL.id;
let known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
let lang = "";
try { lang = localStorage.getItem("wagoll-lang") || ""; } catch (e) {}
el("lang").value = lang;

function save(){ try { localStorage.setItem(KEY, JSON.stringify([...known])); } catch (e) {} }

function draw(){
  const q = el("q").value.trim().toLowerCase();
  const onlyLeft = el("onlyLeft").getAttribute("aria-pressed") === "true";
  const shown = WORDS.filter(w =>
    (!q || w.word.toLowerCase().includes(q) || w.def.toLowerCase().includes(q)) &&
    (!onlyLeft || !known.has(w.word.toLowerCase())));

  el("grid").innerHTML = shown.map(w => {
    const k = known.has(w.word.toLowerCase());
    const tr = lang && w.t && w.t[lang];
    const label = LANGS.find(l => l.code === lang);
    return `<div class="w ${w.shared ? "shared" : ""} ${k ? "known" : ""}">
      <h3>${esc(w.word)}${w.shared ? ' <span class="tag">every topic</span>' : ""}
        <button class="star" data-w="${esc(w.word.toLowerCase())}"
          aria-label="${k ? "Mark as still learning" : "Mark as known"}">${k ? "★" : "☆"}</button></h3>
      <p>${esc(w.def)}</p>
      ${tr ? `<span class="tr" lang="${lang}">${esc(tr)}
        <span class="warn">${esc(label.label)} — ${esc(typeof EAL_NOTE !== "undefined" ? EAL_NOTE : "")}</span></span>` : ""}
    </div>`;
  }).join("");

  el("grid").querySelectorAll(".star").forEach(b => b.onclick = () => {
    const w = b.dataset.w;
    known.has(w) ? known.delete(w) : known.add(w);
    save(); draw();
  });

  const withTr = lang ? WORDS.filter(w => w.t && w.t[lang]).length : 0;
  el("count").textContent = `${shown.length} of ${WORDS.length} words`
    + (lang ? ` · ${withTr} translated` : "") + ` · ${known.size} marked known`;
}

el("q").oninput = draw;
el("lang").onchange = () => {
  lang = el("lang").value;
  try { localStorage.setItem("wagoll-lang", lang); } catch (e) {}
  draw();
};
el("onlyLeft").onclick = () => {
  const on = el("onlyLeft").getAttribute("aria-pressed") === "true";
  el("onlyLeft").setAttribute("aria-pressed", String(!on));
  draw();
};
el("print").onclick = () => window.print();

el("note").innerHTML =
  "<b>This page holds no words of its own.</b> It reads the same files as the wall and the "
  + "big-screen tool, so a word can never mean one thing here and another there. The gold words "
  + "are the ones every topic uses; the rest belong to this topic.<br><br>"
  + "<b>Translations are machine-drafted and not yet reviewed.</b> They are labelled wherever they appear."
  + (typeof EAL !== "undefined"
      ? " The same words are on the <a style=\"color:#e6c67a\" href=\"https://liaminhawai-cmd.github.io/EAL-Vocabulary-Site/\">EAL Word Builder</a>, with morphology and practice."
      : "");

draw();
</script>
</body>
</html>
