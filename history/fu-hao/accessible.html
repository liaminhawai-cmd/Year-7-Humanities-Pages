  Source A, the Fu Hao owl zun, with sentence stems by rubric row. Facts and rubric wording

  history/cai-lun/accessible.html. If that machinery is patched, patch this file in the same

<script>
/* ======================================================================= */
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const cap1 = t => t[0].toUpperCase() + t.slice(1);
const KEY = "china22.access.v1";
const VIDEO = "qUGbfNN8nWA";
/* The paper sheet's stops, word for word (lesson-2-2-stop-and-jot in the private repository).
   m = marks; "fact" is a key detail, "link" is levelled: 1 names it, 2 links it. */
const STOPS = [
 { n:1, from:"0:38", at:"2:34", title:"The first Chinese societies", qs:[
  { id:"1a", kind:"fact", m:2, min:2, q:"What two crops did the first farmers in China grow?", stems:["The first farmers grew ", " and "], a:"Rice (1) and millet (1)." },
  { id:"1b", kind:"fact", m:2, min:4, q:"Who was at the top of these early societies, and who was at the bottom?", stems:["At the top were ", "At the bottom were "], a:"Top: kings and shamans (1). Bottom: the working class, mostly farmers (1)." } ] },
 { n:2, from:"2:34", at:"5:11", title:"From kings to an empire", qs:[
  { id:"2a", kind:"fact", m:1, min:1, q:"In what year did the Qin dynasty unify most of the states?", stems:["The Qin dynasty unified most of the states in "], a:"221 BCE (1)." },
  { id:"2b", kind:"link", m:2, min:8, q:"The feudal system was replaced by one based on merit. What changed, and what did it lead to?", stems:["Before, jobs went to people because of ", "Now, jobs went to people because of ", "This led to "],
    a:"1 mark: says what changed: important jobs, even high court positions, went to people for their ability (merit) instead of their family or land.\n2 marks: links it to a result: it led to a new emphasis on learning and ideas (intellectualism), because ability now mattered." } ] },
 { n:3, from:"5:11", at:"8:06", title:"Kings, nobles and officials", qs:[
  { id:"3a", kind:"fact", m:2, min:6, q:"The earliest kings had two roles. Name them.", stems:["The first role was ", "The second role was "], a:"Religious: leading rituals and ceremonies (1). Secular (worldly): wealth and the power to command the commoners' work (1)." },
  { id:"3b", kind:"link", m:2, min:8, q:"How did the Mandate of Heaven change what a king could do?", stems:["The Mandate of Heaven said ", "This meant the king could "],
    a:"1 mark: says the king's authority was given and confirmed by heaven.\n2 marks: links that to more power: he could do as he pleased, drop his ceremonial roles and interfere directly in people's lives." },
  { id:"3c", kind:"link", m:2, min:8, q:"What was the difference between a noble and an official?", stems:["A noble was ", "An official was ", "The difference is "],
    a:"1 mark: one side: nobles inherited their position (it was hereditary), or officials were appointed by the emperor.\n2 marks: both sides, set against each other: nobles were born to it, officials were chosen by the emperor." } ] },
 { n:4, from:"8:06", at:"9:58", title:"Who was respected, and who was not", qs:[
  { id:"4a", kind:"link", m:2, min:8, q:"Why did Confucius say farmers deserved respect, even above artisans?", stems:["Confucius said farmers deserved respect because ", "This matters because everyone "],
    a:"1 mark: says farmers provided the food.\n2 marks: links it to the whole society: everyone depended on farmers to survive, so farming was the only hard work by hand that the elites respected." },
  { id:"4b", kind:"link", m:2, min:8, q:"Did women have any protection? Give a protection and a limit.", stems:["One protection was ", "But a limit was "],
    a:"1 mark: one protection: women were excluded from corvée (unpaid forced labour), or in Han times could own land in their own right.\n2 marks: weighs a protection against a limit: marriages were arranged by the heads of families and a wife joined her husband's clan." } ] }
];
const FURTHER = { id:"f", kind:"link", m:3, min:12, q:"Merchants were ranked near the bottom, yet some grew rich. Why might a rich merchant's real life differ from his rank?",
  stems:["Merchants were ranked ", "But a rich merchant could ", "The ranking and real life differed because "],
  a:"1 mark: says where the hierarchy put merchants: low, below farmers and artisans.\n2 marks: links wealth to real life: a rich merchant could live comfortably, own goods and land, and have influence.\n3 marks: explains the gap: the hierarchy was an ideal set by Confucian scholars, who looked down on making money from other people's work (and the gentry despised small traders); money gave power the official ranking did not." };
const ALLQ = STOPS.flatMap(st => st.qs).concat([FURTHER]);
const TOTAL = ALLQ.reduce((n, q) => n + q.m, 0);
const SRC_Q = "What does Source A tell us about social groups in Shang China?";
const ROWS = [
  ["source", "Origin, features & purpose", "■", ["Source A is ", "It is a primary source because ", "It was found ", "Its features include ", "Its purpose was "]],
  ["context", "Historical context", "▲", ["Fu Hao was ", "Her tomb held ", "In Shang society, bronze showed ", "So the vessel belonged to "]],
  ["judge", "Accuracy, usefulness & reliability", "◆", ["It is useful for ", "It is strong evidence of ", "But it cannot tell us ", "A historian must be careful because "]]
];
const NEXT_STEMS = ["add ", "say what the source cannot show: ", "use the tomb to explain the context: "];
const LV = ["Level 6", "Level 7", "Level 8", "Level 9"];
const WORDS = [["hierarchy", GLOSS.tier3.hierarchy], ["bureaucrat", "A government official."], ["peasant", "A poor farmer who works a small piece of land."], ["merchant", "A person who buys and sells goods to make a profit."], ["scholar", "A person who has studied a subject for many years and knows a great deal about it."]];

let A = { name:"", txt:{}, chk:{}, mk:{}, self:{}, step:0, zoom:1, rate:.9, tint:"cream",
          sup:{ big:false, read:false, mic:false }, used:{}, started:0, secs:0, log:[] };
try { const x = JSON.parse(localStorage.getItem(KEY)); if (x) A = Object.assign(A, x); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(A)); } catch (e) {} }
if (!A.started) { A.started = Date.now(); save(); }
setInterval(() => { if (document.visibilityState === "visible" && A.step > 0) { A.secs += 15; save(); } }, 15000);
let lastTap = 0;
function steady(){ const n = Date.now(); if (n - lastTap < 400) return false; lastTap = n; return true; }
const wc = t => (t || "").trim() ? t.trim().split(/\s+/).length : 0;

/* ---------- read to me (as in the accessible CAT) ---------- */
const TTS = "speechSynthesis" in window;
let voice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices().filter(x => /^en/i.test(x.lang));
  const rank = x => (x.lang === "en-AU" ? 0 : /en-(GB|NZ)/.test(x.lang) ? 1 : 2) + (x.localService ? 0 : 3);
  voice = v.sort((a, b) => rank(a) - rank(b))[0] || null;
}
if (TTS) { pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); }
function utter(text){ const u = new SpeechSynthesisUtterance(text); u.lang = voice ? voice.lang : "en-AU"; if (voice) u.voice = voice; u.rate = A.rate || .9; return u; }
let reading = null;
function setReadUI(){ const b = $("readPage"); if (!b) return; b.hidden = !TTS; b.setAttribute("aria-pressed", !!reading); b.textContent = reading ? "■ Stop reading" : "🔊 Read this page"; }
function stopReading(){ if (!TTS) return; const r = reading; reading = null; if (r && r.el) r.el.innerHTML = r.orig; speechSynthesis.cancel(); setReadUI(); }
function speak(t){ if (!TTS) return; stopReading(); speechSynthesis.speak(utter(t)); }
function readEls(els){
  if (!TTS) return;
  stopReading();
  const r = reading = { queue: els.filter(e => e && e.textContent.trim()), el: null, orig: "" };
  setReadUI();
  const next = () => {
    if (reading !== r) return;
    if (r.el) { r.el.innerHTML = r.orig; r.el = null; }
    const el = r.queue.shift();
    if (!el) { reading = null; setReadUI(); return; }
    const text = el.textContent.replace(/\s+/g, " ").trim(), spans = [];
    text.replace(/\S+/g, (w, i) => { spans.push([i, i + w.length]); return w; });
    r.el = el; r.orig = el.innerHTML;
    el.innerHTML = spans.map(([a, b]) => `<span class="w">${esc(text.slice(a, b))}</span>`).join(" ");
    const ws = el.querySelectorAll(".w"), u = utter(text);
    u.onboundary = e => {
      if (reading !== r || e.name === "sentence") return;
      const k = spans.findIndex(([a, b]) => e.charIndex >= a && e.charIndex < b);
      ws.forEach((w, j) => w.classList.toggle("now", j === k));
      if (k >= 0) ws[k].scrollIntoView({ block:"nearest" });
    };
    u.onend = u.onerror = () => setTimeout(next, 150);
    speechSynthesis.speak(u);
  };
  next();
}
const readPageEls = () => [...$("screen").querySelectorAll(".q p, .rd")];
const readBtn = label => TTS ? `<button type="button" class="say" data-readel="1" aria-label="${esc(label)}">🔊</button>` : "";
/* The marked paragraph is read without its marks: the lit word replaces them while it reads,
   and they come back when it stops. */

/* ---------- voice typing (as in the accessible CAT) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recKey = null, sttLang = null;
(async () => { try { if (SR && SR.available) for (const l of ["en-AU", "en-GB", "en-US"])
  if (await SR.available({ langs:[l], processLocally:true }) === "available") { sttLang = l; break; } } catch (e) {} })();
const micBtn = key => SR ? `<button type="button" class="big mic" data-mic="${key}" aria-pressed="false">🎤 Speak</button><p class="heard" id="heard_${key}" aria-live="polite"></p>` : "";
let micStream = null, micMsg = "";
const liveTrack = () => micStream && micStream.getAudioTracks().find(t => t.readyState === "live");
function micNote(t){ micMsg = t; const n = $("micNote"); if (n) n.textContent = t; }
async function openMic(){
  if (liveTrack()) { micNote("Microphone on. It only listens when you tap Speak."); return; }
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { micNote("This browser cannot use the microphone."); return; }
  micNote("If the browser asks to use the microphone, choose Allow.");
  try { micStream = await navigator.mediaDevices.getUserMedia({ audio:true }); micNote("Microphone on. It only listens when you tap Speak."); }
  catch (e) { micStream = null; micNote(e.name === "NotFoundError" ? "No microphone found on this device." : "The microphone is blocked. Ask your teacher."); }
}
function closeMic(){ if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null; micMsg = ""; }
function heard(key, t){ const h = document.getElementById("heard_" + key); if (h) h.textContent = t; }
function setMicUI(){ document.querySelectorAll("[data-mic]").forEach(b => { const on = b.dataset.mic === recKey; b.setAttribute("aria-pressed", on); b.textContent = on ? "■ Stop" : "🎤 Speak"; }); }
function stopMic(){ const r = rec; rec = null; recKey = null; if (r) { try { r.stop(); } catch (e) {} } setMicUI(); }
function putSaid(key, said){
  said = (said || "").trim(); if (!said) return;
  const ta = document.querySelector(`textarea[data-key="${key}"]`);
  const cur = ta ? ta.value : (A.txt[key] || "");
  const before = ta ? cur.slice(0, ta.selectionStart ?? cur.length) : cur;
  const text = (!before.trim() || /[.!?]\s*$/.test(before) ? cap1(said) : said) + " ";
  if (ta) return caretInsert(key, text);
  undo[key] = undo[key] || []; undo[key].push(cur);
  A.txt[key] = cur + (cur && !/\s$/.test(cur) ? " " : "") + text; save(); drawStrip();
}
function startMic(key){
  stopMic(); stopReading();
  const r = rec = new SR(); recKey = key;
  r.lang = sttLang || "en-AU"; r.continuous = true; r.interimResults = true;
  if (sttLang) r.processLocally = true;
  r.onresult = e => {
    if (r.closed) return;
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) putSaid(key, res[0].transcript); else interim += " " + res[0].transcript.trim();
    }
    r.pending = interim.trim();
    heard(key, r.pending ? "Hearing: " + r.pending : rec === r ? "Listening." : "");
  };
  r.onerror = e => {
    if (e.error === "aborted") return;
    r.err = true;
    heard(key, e.error === "network" ? "Voice typing needs the internet on this device. Ask your teacher."
             : e.error === "not-allowed" || e.error === "service-not-allowed" ? "The microphone is blocked. Ask your teacher."
             : e.error === "no-speech" ? "Nothing heard. Tap Speak and try again." : "Voice typing stopped. Tap Speak to start again.");
  };
  r.onend = () => {
    r.closed = true;
    if (r.pending) { putSaid(key, r.pending); r.pending = ""; }
    if (rec === r) { rec = null; recKey = null; setMicUI(); }
    if (!r.err) heard(key, "");
  };
  const track = liveTrack();
  let started = false;
  if (track) { try { r.start(track); started = true; } catch (e) {} }
  if (!started) { try { r.start(); started = true; } catch (e) {} }
  if (started) heard(key, "Listening."); else { rec = null; recKey = null; heard(key, "Voice typing did not start."); }
  setMicUI();
}

function stepDone(s){
  if (s.id === "stop") return STOPS[s.n - 1].qs.every(q => A.chk[q.id]);
  if (s.id === "further") return !!A.chk.f;
  if (s.id === "source") return wc(A.txt.para) >= 30;
  if (s.id === "level") return ROWS.every(r => A.self[r[0]]);
  return false;
}
function drawStrip(){
  $("strip").innerHTML = STEPS.map((s, i) => '<button type="button" data-step="' + i + '" class="' + (stepDone(s) ? "ok" : "") + '"' + (i === A.step ? ' aria-current="true"' : "") + ">" + esc(s.label) + "</button>").join("");
  $("strip").querySelectorAll("button").forEach(b => b.onclick = () => { if (steady()) go(+b.dataset.step); });
}
function go(k){ A.step = Math.max(0, Math.min(STEPS.length - 1, k)); if (A.step !== 0) armLock(); save(); render(); $("screen").parentElement.scrollTop = 0; }
/* ---------- the full-screen lock (no password) ---------- */
const FS = !!(document.documentElement.requestFullscreen && document.fullscreenEnabled !== false);
let graceUntil = 0;          // printing leaves full screen; that is not counted
function logIt(what){ A.log = A.log || []; A.log.push({ t:Date.now(), what }); save(); }
function armLock(){ if (FS && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); }
function showLock(what){
  if (A.step === 0 || !$("lock").hidden) return;
  stopReading(); stopMic();
  if (Date.now() > graceUntil) logIt(what);
  $("lockH").textContent = what === "Left the page" ? "You left the page" : what === "Left the window" ? "You switched away" : "You left full screen";
  $("lock").hidden = false; $("lockBack").focus();
}
$("lockBack").onclick = () => {
  const done = () => { $("lock").hidden = true; };
  if (FS) document.documentElement.requestFullscreen().then(done, done); else done();
};
document.addEventListener("fullscreenchange", () => { if (FS && !document.fullscreenElement) showLock("Left full screen"); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") showLock("Left the page"); });
/* Alt+Tab leaves the page visible and in full screen, so watch focus as well. A click
   into the video or the vocab hub also blurs the window, but document.hasFocus() stays
   true; and once focus is inside a frame the page gets no second blur, so check each second. */
window.addEventListener("blur", () => setTimeout(() => { if (!document.hasFocus() && Date.now() > graceUntil) showLock("Left the window"); }, 200));
setInterval(() => { if (document.visibilityState === "visible" && !document.hasFocus() && Date.now() > graceUntil) showLock("Left the window"); }, 1000);
const exits = () => (A.log || []).length;
const logLines = () => (A.log || []).map(x => new Date(x.t).toLocaleString("en-AU", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }) + ": " + x.what);

$("back").onclick = () => { if (steady()) go(A.step - 1); };
$("next").onclick = () => { if (steady()) go(A.step + 1); };

const ZOOMS = [0.8, 0.9, 1, 1.15, 1.3, 1.5, 1.75, 2];
function setZoom(z){
  A.zoom = ZOOMS.includes(z) ? z : 1;
  if (A.zoom > 1) A.used.zoom = Math.max(A.used.zoom || 1, A.zoom);
  document.documentElement.style.setProperty("--z", A.zoom);
  document.body.classList.toggle("zbig", A.zoom >= 1.5);
  document.body.classList.toggle("zhuge", A.zoom >= 1.75);
  $("zLvl").textContent = "Zoom " + Math.round(A.zoom * 100) + "%";
  $("zOut").disabled = A.zoom === ZOOMS[0];
  $("zIn").disabled = A.zoom === ZOOMS[ZOOMS.length - 1];
  save();
}
$("zIn").onclick = () => { if (steady()) setZoom(ZOOMS[Math.min(ZOOMS.length - 1, ZOOMS.indexOf(A.zoom) + 1)]); };
$("zOut").onclick = () => { if (steady()) setZoom(ZOOMS[Math.max(0, ZOOMS.indexOf(A.zoom) - 1)]); };


function render(){
  stopReading(); stopMic();
  drawStrip();
  const s = STEPS[A.step];
  $("back").disabled = A.step === 0;
  $("next").hidden = A.step === STEPS.length - 1;
  $("screen").innerHTML = { start:startScreen, stop:() => stopScreen(STOPS[s.n - 1]), further:furtherScreen, source:sourceScreen, level:levelScreen, hand:handScreen }[s.id]();
  wire();
}

const undo = {};
function caretInsert(key, text){
  const ta = document.querySelector(`textarea[data-key="${key}"]`); if (!ta) return;
  undo[key] = undo[key] || []; undo[key].push(ta.value);
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? ta.value.length;
  const before = ta.value.slice(0, s), after = ta.value.slice(e);
  const pad = before && !/\s$/.test(before) && !/^\s/.test(text) ? " " : "";
  ta.value = before + pad + text + after;
  const at = (before + pad + text).length;
  ta.focus(); ta.setSelectionRange(at, at);
  A.txt[key] = ta.value; save(); drawStrip(); noteFor(key);
}

function noteFor(key){
  const q = ALLQ.find(x => x.id === key);
  if (q){
    const ok = wc(A.txt[key]) >= q.min, b = document.querySelector('[data-check="' + key + '"]'), n = $("cn_" + key);
    if (b) b.disabled = !ok;
    if (n) n.textContent = ok ? "" : needNote(q);
  }
  if (key === "para"){ const n = $("paraN"); if (n) n.textContent = paraNote(); }
}
function wire(){
  const S = $("screen");
  const nm = $("nm"); if (nm) nm.addEventListener("input", () => { A.name = nm.value; save(); });
  S.querySelectorAll("textarea[data-key]").forEach(ta => ta.addEventListener("input", () => { A.txt[ta.dataset.key] = ta.value; save(); noteFor(ta.dataset.key); drawStrip(); }));
  S.querySelectorAll("[data-readel]").forEach(b => b.onclick = () => readEls([b.parentElement.querySelector(".rd, p")]));
  S.querySelectorAll("[data-sayans]").forEach(b => b.onclick = () => speak(A.txt[b.dataset.sayans] || "Nothing written yet."));
  S.querySelectorAll("[data-mic]").forEach(b => {
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.onclick = () => { if (!steady()) return; if (recKey === b.dataset.mic) stopMic(); else startMic(b.dataset.mic); };
  });
  S.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => { if (!steady()) return; A.rate = +b.dataset.rate; save(); render(); speak("This is the reading speed."); });
  S.querySelectorAll("[data-sup]").forEach(b => b.onclick = () => {
    if (!steady()) return;
    const k = b.dataset.sup; A.sup[k] = !A.sup[k]; if (A.sup[k]) A.used[k] = true;
    save(); applySupports(); render();
    if (k === "mic" && A.sup.mic) openMic();
  });
  S.querySelectorAll("[data-tint]").forEach(b => b.onclick = () => { if (!steady()) return; A.tint = b.dataset.tint; save(); applyTint(); render(); });
  S.querySelectorAll("[data-stem],[data-sstem]").forEach(b => b.addEventListener("pointerdown", e => e.preventDefault()));
  S.querySelectorAll("[data-stem]").forEach(b => b.onclick = () => { if (!steady()) return; const q = ALLQ.find(x => x.id === b.dataset.stem); caretInsert(q.id, q.stems[+b.dataset.k]); });
  S.querySelectorAll("[data-sstem]").forEach(b => b.onclick = () => {
    if (!steady()) return; const k = b.dataset.sstem;
    if (k === "next") return caretInsert("nextstep", NEXT_STEMS[+b.dataset.k]);
    caretInsert("para", ROWS.find(r => r[0] === k)[3][+b.dataset.k]);
  });
  S.querySelectorAll("[data-undo]").forEach(b => {
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.onclick = () => {
      if (!steady()) return;
      const key = b.dataset.undo, ta = document.querySelector('textarea[data-key="' + key + '"]');
      if (!ta || !undo[key] || !undo[key].length) return;
      ta.value = undo[key].pop(); A.txt[key] = ta.value; save(); noteFor(key); drawStrip(); ta.focus();
    };
  });
  /* checking an answer opens the model in place, with no re-render, so the video keeps its place */
  S.querySelectorAll("[data-check]").forEach(b => b.onclick = () => { if (!steady()) return; A.chk[b.dataset.check] = true; save(); const k = $("k_" + b.dataset.check); if (k) k.hidden = false; drawStrip(); });
  S.querySelectorAll("[data-mk]").forEach(b => b.onclick = () => {
    if (!steady()) return; const id = b.dataset.mk; A.mk[id] = +b.dataset.v; save();
    S.querySelectorAll('[data-mk="' + id + '"]').forEach(x => x.setAttribute("aria-pressed", +x.dataset.v === A.mk[id]));
  });
  S.querySelectorAll("[data-self]").forEach(b => b.onclick = () => { if (!steady()) return; A.self[b.dataset.self] = b.dataset.v; save(); render(); });
  const pr = $("printBtn"); if (pr) pr.onclick = () => { graceUntil = Date.now() + 120000; buildPrint(); window.print(); graceUntil = Date.now() + 3000; };
  const copy = async t => { try { await navigator.clipboard.writeText(t); $("copied").textContent = "Copied."; } catch (e) { $("copied").textContent = "Copy did not work here. Use Print instead."; } };
  const cp = $("copyBtn"); if (cp) cp.onclick = () => copy(plainText());
  const rw = $("rowBtn"); if (rw) rw.onclick = () => copy(classRow());
}

/* ---------- the printed copy, the class row ---------- */
const mins = () => Math.round((A.secs || 0) / 60);
function buildPrint(){
  $("print").innerHTML = `
    <h1>Ancient China 2.2 · Social groups</h1>
    <p><b>Name:</b> ${esc(A.name || "")} &nbsp; <b>Printed:</b> ${new Date().toLocaleDateString("en-AU")} &nbsp; <i>Done on the accessible online version.</i></p>
    <p><b>Supports used:</b> ${esc(supportsUsed())} &nbsp; <b>Time on the page:</b> about ${mins()} minutes</p>
    <h2>Part 1: stop and jot (my own marks: ${jotMarks()} out of ${TOTAL})</h2>
    <table><tr><th>Question</th><th>My answer</th><th>Marks</th></tr>${ALLQ.map(q => `<tr><td>${esc(q.q)}</td><td>${esc(A.txt[q.id] || "")}</td><td>${A.mk[q.id] === undefined ? "" : A.mk[q.id] + " / " + q.m}</td></tr>`).join("")}</table>
    <h2>Part 2: ${esc(SRC_Q)}</h2><div class="ans">${esc(A.txt.para || "(nothing written)")}</div>
    <table><tr><th>Row</th><th>My level</th></tr>${ROWS.map(r => `<tr><td>${esc(r[1])}</td><td>${esc(A.self[r[0]] ? A.self[r[0]] + ": " + CONTINUUM[r[0]][A.self[r[0]]] : "not chosen")}</td></tr>`).join("")}</table>
    <p><b>To move up one level I would:</b> ${esc((A.txt.nextstep || "").trim()) || "<i>(not written)</i>"}</p>
    <h2>Lesson log</h2><p>${FS ? `Left full screen or the page ${exits()} time${exits() === 1 ? "" : "s"}.` : "This browser has no full screen, so the lesson was not locked."}</p>
    ${exits() ? `<p>${logLines().map(esc).join("<br>")}</p>` : ""}
    <p style="font-size:9pt;color:#555">The marks and the levels are the student's own. Nothing on the page judged the writing.</p>`;
}
function plainText(){
  return ["Ancient China 2.2: Social groups", "Name: " + A.name, "Supports used: " + supportsUsed(), "Time on the page: about " + mins() + " minutes", "",
    "Part 1: stop and jot, my own marks " + jotMarks() + " out of " + TOTAL]
    .concat(ALLQ.map(q => q.q + "\n  " + (A.txt[q.id] || "(nothing written)") + "\n  Marks: " + (A.mk[q.id] === undefined ? "not marked" : A.mk[q.id] + " / " + q.m)))
    .concat(["", "Part 2: " + SRC_Q, A.txt.para || "(nothing written)", ""])
    .concat(ROWS.map(r => r[1] + ": " + (A.self[r[0]] || "not chosen")))
    .concat(["To move up one level I would: " + ((A.txt.nextstep || "").trim() || "(not written)"),
      "Left full screen or the page: " + (FS ? exits() + " times" : "no full screen in this browser")]).concat(logLines()).join("\n");
}
/* One tab-separated row for a shared sheet. Columns: name, date, minutes on the page, my marks
   for each of the 10 stop-and-jot questions, their total, words in the Source A answer, my level
   for origin, context and judge, times out of full screen, next step, the answer. It cannot tell
   you whether any of it is good. */
function classRow(){
  const clean = t => String(t || "").replace(/[\t\r\n]+/g, " ").trim();
  return [clean(A.name), new Date().toLocaleDateString("en-AU"), mins()].concat(ALLQ.map(q => A.mk[q.id] === undefined ? "" : A.mk[q.id]))
    .concat([jotMarks(), wc(A.txt.para)]).concat(ROWS.map(r => A.self[r[0]] || ""))
    .concat([FS ? exits() : "no lock", clean(A.txt.nextstep), clean(A.txt.para)]).join("\t");
}

$("readPage").onclick = () => { if (!steady()) return; if (reading) stopReading(); else readEls(readPageEls()); };
A.sup = Object.assign({ big:false, read:false, mic:false }, A.sup); A.used = A.used || {}; A.self = A.self || {}; A.chk = A.chk || {}; A.mk = A.mk || {};
setZoom(A.zoom); applyTint(); applySupports(); setReadUI();
render();
if (A.sup.mic && SR) openMic();
if (A.step !== 0 && FS && !document.fullscreenElement) { $("lockH").textContent = "Back to the lesson"; $("lock").hidden = false; }
</script>
