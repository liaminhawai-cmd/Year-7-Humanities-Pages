<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23223f43'/><text x='16' y='24' font-family='Georgia,serif' font-size='22' font-weight='700' fill='%23c99a2e' text-anchor='middle'>7</text></svg>">
<meta name="description" content="One A3 source sheet per source: Burtt's painting of Batman's Treaty and Governor Bourke's Proclamation, each reproduced in full with its details numbered and explained.">
<title>Batman's Treaty Source Sheets</title>
<style>
:root{
  --paper:#fbf7ee; --bg:#efe8dc; --ink:#20231f; --muted:#675f54; --line:#d4c8b6;
  --deep:#223f43; --on-deep:#fbf7ee; --band:#f5f0e6;
  --shadow:0 1px 2px rgba(48,39,24,.06),0 4px 14px rgba(48,39,24,.08);
  --rule:#b9ac96; --pin:#a34d1d;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1b1e1c; --bg:#111312; --ink:#eae5db; --muted:#a49a8b; --line:#3a4038;
    --deep:#cfe0e0; --on-deep:#111312; --band:#232725; --rule:#4a5148; --pin:#e89a63;
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#1b1e1c; --bg:#111312; --ink:#eae5db; --muted:#a49a8b; --line:#3a4038;
  --deep:#cfe0e0; --on-deep:#111312; --band:#232725; --rule:#4a5148; --pin:#e89a63;
  --shadow:0 1px 2px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);
     font-family:Georgia,"Times New Roman",serif;line-height:1.5}

.sheet{width:297mm;min-height:420mm;margin:14px auto;background:var(--paper);
       border:1px solid var(--line);box-shadow:var(--shadow);
       padding:15mm 15mm 11mm;display:flex;flex-direction:column}

.kicker{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
        text-transform:uppercase;letter-spacing:.2em;font-size:9.5pt;font-weight:700;color:var(--muted)}
h1{font-size:52pt;line-height:.94;color:var(--deep);letter-spacing:-.02em;margin:1mm 0 0;font-weight:700}
.standfirst{font-size:14.5pt;line-height:1.4;color:var(--ink);max-width:66ch;margin-top:4mm;font-style:italic}
.rule{height:2.5px;background:var(--deep);margin:5mm 0 5mm}

/* ---------- the plate: a picture source ----------
   The numbered pins sit on the same percentage rectangles the interactive
   uses, so a student who has tapped region 3 on screen finds region 3 in the
   same place on paper. */
.plate{position:relative;margin:0 0 4mm}
.plate img{width:100%;height:auto;display:block;border:1px solid var(--line);background:#111}
.plate .pin{position:absolute;display:flex;align-items:center;justify-content:center;
            border:2.5px solid var(--pin);border-radius:4px;background:rgba(255,255,255,.06)}
.plate .pin span{position:absolute;top:-1px;left:-1px;background:var(--pin);color:#fff;
                 font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
                 font-size:10pt;font-weight:800;line-height:1;padding:2.5px 5px;border-radius:3px 0 4px 0}

/* ---------- the plate: a written source ---------- */
.doc{border:1px solid var(--line);background:var(--band);border-radius:3px;
     padding:8mm 9mm;margin:0 0 5mm;columns:2;column-gap:9mm;column-rule:1px solid var(--line);
     font-size:12.8pt;line-height:1.52;text-align:justify;hyphens:auto}
.doc p{margin-bottom:3mm;break-inside:avoid-column}
.doc .num{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
          font-size:8pt;font-weight:800;color:#fff;background:var(--pin);
          padding:1px 4px;border-radius:3px;margin-right:2px;vertical-align:2px}
.doc .hit{text-decoration:underline;text-decoration-color:var(--pin);
          text-decoration-thickness:1.6px;text-underline-offset:2.5px;font-weight:700}

.platecap{font-size:10.4pt;line-height:1.4;color:var(--muted);margin-bottom:5mm;
          padding-left:4mm;border-left:2px solid var(--rule)}

/* ---------- the numbered details ---------- */
h2{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
   font-size:11.5pt;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
   color:var(--deep);border-bottom:1.5px solid var(--line);padding-bottom:2mm;margin-bottom:4mm}
.details{columns:2;column-gap:10mm;column-rule:1px solid var(--line)}
.d{display:grid;grid-template-columns:auto 1fr;gap:0 4mm;margin-bottom:5.5mm;break-inside:avoid}
.d .n{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      font-size:11pt;font-weight:800;color:#fff;background:var(--pin);border-radius:4px;
      width:8mm;height:8mm;display:flex;align-items:center;justify-content:center;line-height:1}
.d h3{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      font-size:12.8pt;font-weight:800;color:var(--deep);line-height:1.25;align-self:center}
.d p{grid-column:2;font-size:12.6pt;line-height:1.48;margin-top:1.8mm}

.close{margin-top:6mm;padding-top:5mm;border-top:2px solid var(--deep);
       font-size:14pt;line-height:1.45;color:var(--deep)}
.foot{margin-top:auto;padding-top:5mm;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      font-size:8pt;color:var(--muted);line-height:1.45}
.foot b{color:var(--ink)}

@media screen and (max-width:860px){
  .sheet{width:auto;min-height:0;padding:16px;margin:0;border:0}
  h1{font-size:38pt}.doc,.details{columns:1}
}

@page{size:A3 portrait;margin:12mm}
@media print{
  :root{--paper:#fff;--bg:#fff;--ink:#000;--muted:#4a463d;--line:#c3b8a4;--rule:#9c9382;--band:#f5f0e6}
  body{background:#fff}
  .sheet{width:auto;min-height:0;margin:0;padding:0;border:0;box-shadow:none;
         break-after:page;min-height:calc(420mm - 24mm)}
  .sheet:last-of-type{break-after:auto}
  .plate,.d,.close{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<main id="out"></main>

<script src="content.js"></script>
<script>
/* One A3 sheet per entry in SOURCES. Everything on it, the plate, the pins,
   the numbered notes, the citation, is already authored in content.js for the
   interactive: this page just lays the same material out for paper. Nothing
   here holds any wording of its own. */

const esc = s => String(s).replace(/&(?!amp;|lt;|gt;|#\d+;|[a-z]+;)/g,"&amp;");
const LETTERS = ["A","B","C","D"];

/* Strip the "A · " the tab strip carries, so the sheet's own heading is just
   the source's name and the letter appears once, in the kicker. */
const plainName = s => s.tab.replace(/^[A-Z]\s*·\s*/,"");

function plate(s){
  if (s.kind === "text"){
    /* Wrap each hotspot's phrase where it appears, longest first so a phrase
       nested inside another cannot break it. Same ordering rule as the
       interactive, for the same reason. */
    const order = s.hotspots.map((h,n)=>({h,n}))
                            .sort((a,b)=>b.h.mark.length - a.h.mark.length);
    const body = s.paragraphs.map(p => {
      let out = esc(p);
      order.forEach(({h,n}) => {
        const q = esc(h.mark);
        if (out.includes(q) && !out.includes(`data-n="${n}"`))
          out = out.replace(q, `<span class="hit" data-n="${n}"><span class="num">${n+1}</span>${q}</span>`);
      });
      return `<p>${out}</p>`;
    }).join("");
    return `<div class="doc">${body}</div>`;
  }
  return `<div class="plate">
    <img src="${esc(s.file)}" alt="${esc(s.alt)}">
    ${s.hotspots.map((h,n)=>`<div class="pin" style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%">
        <span>${n+1}</span></div>`).join("")}
  </div>`;
}

document.getElementById("out").innerHTML = SOURCES.map((s,i)=>`
  <section class="sheet">
    <header>
      <div class="kicker">Ancient Australia &middot; Source ${LETTERS[i] || i+1} of ${SOURCES.length}</div>
      <h1>${esc(plainName(s))}</h1>
      <p class="standfirst">${esc(s.whole.text)}</p>
    </header>
    <div class="rule"></div>

    ${plate(s)}
    <p class="platecap">${esc(s.cite)}</p>

    <h2>${s.kind === "text" ? "The phrases to look at" : "What to look at"}</h2>
    <div class="details">${s.hotspots.map((h,n)=>`
      <div class="d">
        <div class="n">${n+1}</div>
        <h3>${esc(h.label)}</h3>
        <p>${esc(h.text)}</p>
      </div>`).join("")}</div>

    <p class="close">${esc(WALL.inquiry)}</p>
    <p class="foot">${WALL.foot}</p>
  </section>`).join("");
</script>
</body>
</html>
