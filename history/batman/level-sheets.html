<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23223f43'/><text x='16' y='24' font-family='Georgia,serif' font-size='22' font-weight='700' fill='%23c99a2e' text-anchor='middle'>7</text></svg>">
<meta name="description" content="One A4 anchor sheet per level: the worked example comparing the painting and the Proclamation, what each marked phrase proves, and that level's continuum descriptors.">
<title>Batman's Treaty Level Anchor Sheets</title>
<style>
:root{
  --paper:#fbf7ee; --bg:#efe8dc; --ink:#20231f; --muted:#675f54; --line:#d4c8b6;
  --deep:#223f43; --on-deep:#fbf7ee; --band:#f5f0e6;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --gold:#8b681e; --gold-soft:#f6e7c2;
  --success:#1f4ed8; --success-soft:#e4ebfe;
  --innovation:#c2410c; --innovation-soft:#fceee6;
  --decisions:#15803d; --decisions-soft:#e2f4e8;
  --meta:#53666b; --meta-soft:#e2eaeb;
  --source:#176b87; --source-soft:#d8edf4;
  --context:#357a46; --context-soft:#dff0df;
  --evidence:#a34d1d; --evidence-soft:#f7e3d4;
  --judge:#744f91; --judge-soft:#eadff2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1b1e1c; --bg:#111312; --ink:#eae5db; --muted:#a49a8b; --line:#3a4038;
    --deep:#cfe0e0; --on-deep:#111312; --band:#232725; --shadow:0 1px 2px rgba(0,0,0,.45);
    --gold:#e0b64c; --gold-soft:#3a2f10;
    --success:#7ba2ff; --success-soft:#182444;
    --innovation:#f0906a; --innovation-soft:#3a2117;
    --decisions:#66c98a; --decisions-soft:#12301f;
    --meta:#a3b6bb; --meta-soft:#232c2e;
    --source:#6fc0da; --source-soft:#12303a;
    --context:#74c288; --context-soft:#15301d;
    --evidence:#e89a63; --evidence-soft:#3a2417;
    --judge:#bda0d8; --judge-soft:#2b1f3a;
  }
}
/* ---------- PAPER ----------
   The ONLY block that differs between the copies of this file. Every size
   below is calc()'d against --paper-k, so moving a topic from A3 to A4 is
   these five values and nothing else in the file.

   A4 is 1/sqrt(2) of A3 in each direction, so --paper-k is .707 and the type
   shrinks with the page rather than overflowing it. The per-level --k scaling
   in the script still applies on top, so a short level still fills its sheet. */
:root{
  --sheet-w:210mm; --sheet-h:297mm; --sheet-pad:10mm 9mm 8mm;
  --sheet-bleed:18mm;   /* twice the @page margin, for the print min-height */
  --paper-k:.707;
}
@page{size:A4 portrait;margin:9mm}

*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);line-height:1.5;
     font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

.sheet{width:var(--sheet-w);min-height:var(--sheet-h);margin:14px auto;background:var(--paper);
       border:1px solid var(--line);box-shadow:var(--shadow);padding:var(--sheet-pad);
       display:flex;flex-direction:column}

.head{border-bottom:3px solid var(--deep);padding-bottom:calc(7mm * var(--paper-k));margin-bottom:calc(6mm * var(--paper-k))}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:calc(9pt * var(--paper-k));font-weight:800;color:var(--muted)}
.lvline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:calc(2mm * var(--paper-k)) 0 calc(3mm * var(--paper-k))}
h1{font-size:calc(44pt * var(--paper-k));line-height:.98;color:var(--deep);letter-spacing:-.02em}
.badge{background:var(--gold);color:#fff;font-size:calc(10pt * var(--paper-k));font-weight:800;letter-spacing:.1em;
       text-transform:uppercase;padding:3px 11px;border-radius:999px}
.intro{font-size:calc(12.5pt * var(--paper-k));color:var(--ink);line-height:1.45}
.intro b{color:var(--deep)}

.key{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:calc(6mm * var(--paper-k))}
.key .k{flex:1 1 0;min-width:calc(120px * var(--paper-k));border:1px solid var(--line);border-left:5px solid;
        border-radius:7px;padding:5px 8px;background:var(--band)}
.k .kh{font-weight:800;font-size:calc(10.5pt * var(--paper-k));display:flex;gap:5px;align-items:baseline;line-height:1.2}

.bg{background:var(--band);border:1px solid var(--line);border-left:5px solid var(--gold);
    border-radius:7px;padding:calc(3.5mm * var(--paper-k)) calc(5mm * var(--paper-k));
    margin-bottom:calc(5mm * var(--paper-k));font-size:calc(12.5pt * var(--paper-k));line-height:1.4}
.bg span{display:block;font-weight:800;color:var(--gold);letter-spacing:.05em;
    text-transform:uppercase;font-size:calc(9pt * var(--paper-k));margin-bottom:calc(1.5mm * var(--paper-k))}

.sec{margin-bottom:calc(6mm * var(--paper-k))}
.sec>h2{font-size:calc(10.5pt * var(--paper-k));font-weight:800;letter-spacing:.11em;text-transform:uppercase;
        color:var(--deep);border-bottom:1.5px solid var(--line);padding-bottom:calc(2mm * var(--paper-k));margin-bottom:calc(3.5mm * var(--paper-k))}

.example{font-family:Georgia,"Times New Roman",serif;font-size:calc(18.5pt * var(--paper-k) * var(--k,1));line-height:1.55}

.proves{display:grid;gap:calc(3mm * var(--paper-k))}
.pv{display:flex;gap:8px;font-size:calc(13pt * var(--paper-k) * var(--k2,1));line-height:1.4}
.pv .g{flex:none;font-size:.85em;line-height:1.6}
.pv b{font-weight:700}

.cont{display:grid;gap:3px}
.cr{display:grid;grid-template-columns:calc(58mm * var(--paper-k)) 1fr;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.cr .cn{padding:calc(4mm * var(--paper-k));font-weight:800;font-size:calc(11pt * var(--paper-k));letter-spacing:.03em;text-transform:uppercase;line-height:1.25;
        display:flex;align-items:center;gap:6px}
.cr .cd{padding:calc(4mm * var(--paper-k));font-size:calc(13.5pt * var(--paper-k) * var(--k2,1));line-height:1.4}
.cr.gap .cd{color:var(--muted);font-style:italic}

.foot{margin-top:auto;padding-top:calc(5mm * var(--paper-k));border-top:1px solid var(--line);
      font-size:calc(8pt * var(--paper-k));color:var(--muted);line-height:1.45}
.foot b{color:var(--ink)}

/* ---------- two channels: colour AND line pattern ---------- */
.m{font-weight:600;text-decoration-line:underline;text-underline-offset:3px;text-decoration-thickness:1.6px}
.m-success,.m-source{text-decoration-style:solid}
.m-innovation,.m-context{text-decoration-style:dashed}
.m-decisions,.m-evidence{text-decoration-style:dotted}
.m-judge{text-decoration-style:double}
.m-meta{text-decoration-style:wavy;text-decoration-thickness:1.2px}
.m-success{color:var(--success);text-decoration-color:var(--success)}
.m-innovation{color:var(--innovation);text-decoration-color:var(--innovation)}
.m-decisions{color:var(--decisions);text-decoration-color:var(--decisions)}
.m-source{color:var(--source);text-decoration-color:var(--source)}
.m-context{color:var(--context);text-decoration-color:var(--context)}
.m-evidence{color:var(--evidence);text-decoration-color:var(--evidence)}
.m-judge{color:var(--judge);text-decoration-color:var(--judge)}
.m-meta{color:var(--meta);text-decoration-color:var(--meta)}

.k-success{border-left-color:var(--success)} .k-success .kh{color:var(--success)}
.k-innovation{border-left-color:var(--innovation)} .k-innovation .kh{color:var(--innovation)}
.k-decisions{border-left-color:var(--decisions)} .k-decisions .kh{color:var(--decisions)}
.k-source{border-left-color:var(--source)} .k-source .kh{color:var(--source)}
.k-context{border-left-color:var(--context)} .k-context .kh{color:var(--context)}
.k-evidence{border-left-color:var(--evidence)} .k-evidence .kh{color:var(--evidence)}
.k-judge{border-left-color:var(--judge)} .k-judge .kh{color:var(--judge)}
.k-meta{border-left-color:var(--meta)} .k-meta .kh{color:var(--meta)}

.pv-success .g{color:var(--success)} .pv-innovation .g{color:var(--innovation)}
.pv-decisions .g{color:var(--decisions)} .pv-source .g{color:var(--source)}
.pv-context .g{color:var(--context)} .pv-evidence .g{color:var(--evidence)}
.pv-judge .g{color:var(--judge)} .pv-meta .g{color:var(--meta)}
.pv-success b{color:var(--success)} .pv-innovation b{color:var(--innovation)}
.pv-decisions b{color:var(--decisions)} .pv-meta b{color:var(--meta)}

.cr-success .cn{background:var(--success-soft);color:var(--success)}
.cr-innovation .cn{background:var(--innovation-soft);color:var(--innovation)}
.cr-decisions .cn{background:var(--decisions-soft);color:var(--decisions)}
.cr-source .cn{background:var(--source-soft);color:var(--source)}
.cr-context .cn{background:var(--context-soft);color:var(--context)}
.cr-evidence .cn{background:var(--evidence-soft);color:var(--evidence)}
.cr-judge .cn{background:var(--judge-soft);color:var(--judge)}
.cr-meta .cn{background:var(--meta-soft);color:var(--meta)}

@media screen and (max-width:860px){.sheet{width:auto;min-height:0;padding:16px}h1{font-size:32pt}
  .example{font-size:13pt}.cr{grid-template-columns:1fr}}

@media print{
  :root{--paper:#fff;--bg:#fff;--ink:#000;--muted:#4a463d;--line:#c3b8a4;--band:#f5f0e6}
  body{background:#fff}
  .sheet{width:auto;min-height:0;margin:0;padding:0;border:0;box-shadow:none;
         break-after:page;min-height:calc(var(--sheet-h) - var(--sheet-bleed))}
  .sheet:last-of-type{break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec,.cr,.pv{break-inside:avoid}
}
</style>
</head>
<body>
<main id="out"></main>

<script src="content.js"></script>
<script>
/* Renders one A3 anchor sheet per level, straight from content.js.
   Nothing here holds any wall text of its own. */

const esc = s => String(s).replace(/&(?!amp;|lt;|gt;|#\d+;|[a-z]+;)/g,"&amp;");
const mark = s => esc(s).replace(/\{(\w+)\|([^}]*)\}/g,
  (_,k,t)=>`<span class="m m-${k}">${t}</span>`);
const strip = s => String(s).replace(/<[^>]+>/g,"");

/* The full ladder, access rungs first, exactly as bump-it-up.html builds it.
   A topic with no rungs below the continuum (Pigeon Patrol, Ancient China)
   declares EARLY_LEVELS empty or not at all, and gets LEVELS unchanged. */
const LADDER = ((typeof EARLY_LEVELS !== "undefined" && EARLY_LEVELS) || []).concat(LEVELS);
const exOf   = lv => (typeof EARLY_EXAMPLES !== "undefined" && EARLY_EXAMPLES[lv]) || EXAMPLES[lv];

/* The two subjects store explanations slightly differently, economics keeps a
   short label per criterion, history does not. Normalise to one shape.

   An access rung names fewer criteria than the wall does, on purpose: the
   criteria appear one at a time on the way up, so a missing key here is the
   ladder working rather than a hole to fill. */
function proves(lv){
  const e = (typeof EARLY_EXPLANATIONS !== "undefined" && EARLY_EXPLANATIONS[lv])
            || EXPLANATIONS[lv];
  const src = e && e.items ? e.items : e;
  return CRITERIA.map(c=>{
    const v = src[c.key];
    if(v == null) return null;
    return Array.isArray(v) ? {c, label:v[0], text:v[1]} : {c, label:"", text:v};
  }).filter(Boolean);
}

/* CONTINUUM is written against LEVELS only, so an access rung has no column of
   its own and the whole section is dropped for it, heading and all. The sheet
   used to print the heading and then a line explaining why nothing was under
   it, which is the sheet talking about itself: the teacher covers that. */
const onContinuum = lv => CRITERIA.some(c => CONTINUUM[c.key] && CONTINUUM[c.key][lv]);

/* What a student at this rung has already been taught, which is what makes the
   thinking above available to them. Same wording as bump-it-up.html, and only
   where the topic wrote one: Pigeon Patrol has no BUMP at all. */
const bgOf = lv => (typeof BUMP !== "undefined" && BUMP[lv] && BUMP[lv].background) || "";
const bgLabel = lv => /^(Foundation|Levels)/.test(lv)
  ? `Students at ${lv} already know` : `A ${lv} student already knows`;

const intro = WALL.task || WALL.inquiry || "";

/* Each level has a different amount of prose. Scale the type so every sheet
   fills its page rather than leaving the short levels two-thirds empty.

   The measure is every run of prose the scale actually stretches, which is the
   worked example AND the background panel: sizing on the example alone pushed
   four sheets off the page the day the panel was added. */
const plain = lv => exOf(lv).replace(/\{(\w+)\|([^}]*)\}/g,"$2") + " " + bgOf(lv);
const clamp = (lo,v,hi) => Math.min(hi, Math.max(lo, v));
function scale(lv){
  /* The ceiling used to be 1.5, set when the shortest sheet was Grade 5. The
     access rungs are far shorter than that (Foundation to Level 2 is about a
     hundred characters against Year 10's eight hundred), so 1.5 left them
     printing at under half a page. They are also the sheets whose readers
     most want big type.

     The FLOOR matters as much. It was 0.86, and GS73's Year 10 sheet, the
     longest on the site at about 1200 characters, sits hard against it: no
     change to the target above can shrink that sheet, because it is already
     clamped. When the background panel was added it went 17px over the page
     and stayed there while the target was walked from 700 down to 600. The
     floor is what had to move. Check the clamp before tuning the target. */
  /* A rung below the continuum has no continuum section, so it has a whole
     block of page the others spend. Give it a bigger target so it fills the
     sheet instead of trailing off half way down. */
  const target = onContinuum(lv) ? 660 : 1500;
  const k  = clamp(0.78, Math.sqrt(target / plain(lv).length), 2.35);
  const k2 = clamp(0.94, Math.pow(k, 0.45), 1.4);
  return `--k:${k.toFixed(3)};--k2:${k2.toFixed(3)}`;
}

document.getElementById("out").innerHTML = LADDER.map(lv=>{
  const expected = lv === WALL.expected;
  return `<section class="sheet" style="${scale(lv)}">
    <header class="head">
      <div class="kicker">${esc(WALL.title)}</div>
      <div class="lvline"><h1>${esc(lv)}</h1>${expected?'<span class="badge">Expected</span>':''}</div>
      <p class="intro">${intro}</p>
    </header>

    ${bgOf(lv) ? `<div class="bg"><span>${esc(bgLabel(lv))}</span>${esc(bgOf(lv))}</div>` : ""}

    <div class="key">${CRITERIA.map(c=>
      `<div class="k k-${c.key}"><div class="kh"><span>${c.glyph}</span><span>${c.name}</span></div></div>`).join("")}</div>

    <section class="sec">
      <h2>Worked example</h2>
      <p class="example">${mark(exOf(lv))}</p>
    </section>

    <section class="sec">
      <h2>What each marked phrase proves</h2>
      <div class="proves">${proves(lv).map(p=>
        `<div class="pv pv-${p.c.key}"><span class="g">${p.c.glyph}</span><span>${
          p.label?`<b>${p.label}:</b> `:""}${esc(p.text)}</span></div>`).join("")}</div>
    </section>

    ${onContinuum(lv) ? `<section class="sec">
      <h2>Learning continuum at ${esc(lv)}</h2>
      <div class="cont">${CRITERIA.map(c=>{
        const d = CONTINUUM[c.key][lv];
        return `<div class="cr cr-${c.key}${d?"":" gap"}">
          <div class="cn"><span>${c.glyph}</span><span>${c.row}</span></div>
          <div class="cd">${d ? esc(d) : (typeof GAP_TEXT!=="undefined" ? GAP_TEXT : ": ")}</div>
        </div>`;}).join("")}</div>
    </section>` : ""}

    <p class="foot">${WALL.foot}</p>
  </section>`;
}).join("");
</script>
</body>
</html>
