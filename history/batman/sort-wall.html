<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23223f43'/><text x='16' y='24' font-family='Georgia,serif' font-size='22' font-weight='700' fill='%23c99a2e' text-anchor='middle'>7</text></svg>">
<meta name="description" content="One A3 landscape sheet: both sources in miniature, then the empty wall, four strands by five levels, with the rubric printed in every box and room to paste a sentence under it.">
<title>Batman's Treaty Sorting Wall</title>
<style>
/* Paper first. See AGENTS.md rule 14: this five-value block and the @page rule
   below are the only things that decide paper size, and the screen layout must
   never reach the printer. */
:root{
  --sheet-w:420mm; --sheet-h:297mm; --sheet-pad:10mm 11mm 8mm;
  --sheet-bleed:20mm;   /* twice the @page margin, for the print min-height */
  --paper:#fff; --bg:#e9e2d6; --ink:#20231f; --muted:#5f584e; --line:#c3b8a4;
  --deep:#223f43; --band:#f5f0e6; --rule:#9c9382;
}
@page{size:A3 landscape;margin:10mm}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);
     font-family:Georgia,"Times New Roman",serif;line-height:1.4}

.sheet{width:min(100%,var(--sheet-w));height:auto;margin:14px auto;background:var(--paper);
       border:1px solid var(--line);padding:var(--sheet-pad);
       display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(48,39,24,.1)}

/* ---------- head ---------- */
.head{display:flex;align-items:flex-end;gap:10mm;border-bottom:2.2px solid var(--deep);
      padding-bottom:2.5mm;margin-bottom:3.5mm}
.head h1{font-size:23pt;line-height:.98;color:var(--deep);letter-spacing:-.015em;font-weight:700}
.kicker{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
        text-transform:uppercase;letter-spacing:.17em;font-size:7.6pt;font-weight:700;color:var(--muted)}
.task{flex:1;font-size:10.4pt;line-height:1.42;color:var(--ink)}
.task b{color:var(--deep)}

/* ---------- the two sources, small ----------
   Not a reading copy. The full painting and the full Proclamation each get
   their own A3 in the print pack; this is the reminder a student needs while
   their hands are busy with scissors and the big sheets are across the room. */
.sources{display:grid;grid-template-columns:1.15fr 1fr;gap:6mm;margin-bottom:3.5mm}
.src{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4mm;
     border:1px solid var(--line);background:var(--band);padding:3mm;border-radius:2px}
.src.text{grid-template-columns:minmax(0,1fr)}
.plate{width:74mm;aspect-ratio:1600/739;overflow:hidden;background:#111;border:1px solid var(--rule)}
.plate img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.src h2{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
        font-size:8.4pt;font-weight:700;color:var(--deep);line-height:1.2;margin-bottom:1.2mm}
.src p{font-size:8.6pt;line-height:1.36}
.src .cite{display:block;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
           font-size:6.6pt;color:var(--muted);margin-top:1.4mm;line-height:1.3}
.src .quote{margin-top:1.4mm;padding-left:2.5mm;border-left:2px solid var(--rule);
            font-size:8.4pt;line-height:1.34}
.src .quote b{display:block;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
              font-size:6.4pt;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* ---------- the empty wall ----------
   Same shape as the wall on the classroom wall: strands down, levels across.
   A student who builds this has built the thing they will be marked against,
   the right way round. */
.grid{flex:1;display:grid;grid-template-columns:30mm repeat(5,minmax(0,1fr));
      gap:1.6mm;align-content:stretch}
.hcell{background:var(--deep);color:#fff;border-radius:2px;padding:1.4mm;text-align:center;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       font-size:9pt;font-weight:700;display:flex;flex-direction:column;justify-content:center}
.hcell.expected{background:#8b681e}
.hcell small{font-size:5.8pt;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.9}
.hcell.corner{background:transparent}

.rowlab{border:1px solid var(--line);border-radius:2px;padding:2mm;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
        font-size:8pt;font-weight:700;line-height:1.24;display:flex;flex-direction:column;
        justify-content:center;gap:1mm}
.rowlab .g{font-size:12pt;line-height:1}

.cell{border:1px solid var(--line);border-radius:2px;padding:1.8mm;
      display:flex;flex-direction:column;gap:1.4mm}
/* The rubric is printed in every box, not once at the top of the row, because
   the box is where a student is deciding and that is where they need it. */
.rub{flex:none;font-size:7.4pt;line-height:1.26;color:var(--ink)}
.paste{flex:1;min-height:34mm;border:1.1px dashed var(--rule);border-radius:2px;background:#fff}

.foot{margin-top:2.5mm;padding-top:1.8mm;border-top:1px solid var(--line);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      font-size:6.4pt;color:var(--muted);line-height:1.36}
.foot b{color:var(--ink)}

@media screen and (max-width:900px){
  .sheet{width:auto;padding:14px;margin:0;border:0}
  .sources{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .hcell.corner{display:none}
}

@media print{
  body{background:#fff}
  .sheet{width:auto;margin:0;padding:0;border:0;box-shadow:none;
         min-height:calc(var(--sheet-h) - var(--sheet-bleed));
         max-height:calc(var(--sheet-h) - var(--sheet-bleed))}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<main id="out"></main>

<script src="content.js"></script>
<script>
/* The paper half of the sorting activity: this is the board, and sort-cards.html
   is the twenty sentences to cut out and paste onto it. Everything on both comes
   out of content.js, so the paper version and the screen version cannot drift.

   No answers are printed here. What is printed is the rubric, once inside every
   box, which is the thing a student is meant to be reading while they decide. */

const esc = s => String(s).replace(/&(?!amp;|lt;|gt;|#\d+;|[a-z]+;)/g,"&amp;");
const STEPS = LEVELS.slice(0, 5);
const isExp = lv => lv === WALL.expected;

/* Both sources in miniature. The wording is the standfirst content.js already
   carries for each one plus the FACTS pair that names what it says, so nothing
   here is a fresh abridgement of a primary source. */
const factFor = re => (FACTS.find(f => re.test(f[0])) || ["",""]);

const painting = SOURCES.find(s => s.kind !== "text") || SOURCES[0];
const doc      = SOURCES.find(s => s.kind === "text") || SOURCES[1];
const declared = factFor(/declared/);

document.getElementById("out").innerHTML = `
<section class="sheet">
  <header class="head">
    <div>
      <div class="kicker">Ancient Australia &middot; Cut and paste</div>
      <h1>${esc(WALL.title)}</h1>
    </div>
    <p class="task"><b>Twenty sentences, twenty boxes.</b> Cut out the sentences on the
      other sheet. Read what the rubric asks for inside a box, find the sentence that
      does exactly that and no more, and paste it in. Every box takes one sentence.</p>
  </header>

  <div class="sources">
    <div class="src">
      <div class="plate"><img src="${esc(painting.file)}" alt="${esc(painting.alt)}"></div>
      <div>
        <h2>${esc(painting.title || painting.tab)}</h2>
        <p>${esc(painting.whole.text)}<span class="cite">${esc(painting.cite)}</span></p>
      </div>
    </div>
    <div class="src text">
      <div>
        <h2>${esc(doc.title || doc.tab)}</h2>
        <p>${esc(doc.whole.text)}</p>
        <p class="quote"><b>${esc(declared[0])}</b>${esc(declared[1])}</p>
        <span class="cite">${esc(doc.cite)}</span>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="hcell corner"></div>
    ${STEPS.map(lv => `<div class="hcell${isExp(lv)?" expected":""}">${esc(lv)}${
        isExp(lv)?"<small>Expected</small>":""}</div>`).join("")}
    ${CRITERIA.map(c => `
      <div class="rowlab" style="color:${c.ink};border-color:${c.ink}66;background:${c.ink}12">
        <span class="g">${c.glyph}</span>${esc(c.name)}</div>
      ${STEPS.map(lv => `
        <div class="cell" style="border-color:${c.ink}55;background:${c.ink}09">
          <div class="rub">${esc((CONTINUUM[c.key]||{})[lv] || "")}</div>
          <div class="paste"></div>
        </div>`).join("")}`).join("")}
  </div>

  <p class="foot">${WALL.foot}</p>
</section>`;
</script>
</body>
</html>
