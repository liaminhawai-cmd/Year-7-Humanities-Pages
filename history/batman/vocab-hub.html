<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23223f43'/><text x='16' y='24' font-family='Georgia,serif' font-size='22' font-weight='700' fill='%23c99a2e' text-anchor='middle'>7</text></svg>">
<meta name="description" content="Learn, build and recall the vocabulary for this Humanities topic."><title>Vocab hub</title>
<link rel="stylesheet" href="../../assets/vocab-hub.css"></head><body>
<header><div class="in"><div class="kicker" id="kicker"></div><h1>Vocab hub</h1>
<p>Progress stays in this browser.</p>
<a class="back" href="./">&larr; Back to the topic</a></div></header>
<main>
  <div class="tools"><input id="search" type="search" placeholder="Find a word…" aria-label="Find a word">
    <select id="lang" aria-label="Translation language"></select>
    <label><input id="left" type="checkbox"> Still learning only</label><span class="count" id="count"></span></div>
  <nav class="tabs" aria-label="Vocabulary stages">
    <button data-mode="meet" aria-selected="true">1 · Meet</button>
    <button data-mode="build" aria-selected="false">2 · Build &amp; match</button>
    <button data-mode="recall" aria-selected="false">3 · Recall</button>
  </nav>
  <section class="panel on" id="panel-meet"><p class="intro">Read each meaning. Break apart the words that have useful morphemes, and mark a word secure only when you can explain it.</p><div class="grid" id="cards"></div></section>
  <section class="panel" id="panel-build"><div class="practice" id="practiceBuild"></div></section>
  <section class="panel" id="panel-recall"><div class="practice" id="practiceRecall"></div></section>
</main>
<script src="../../eal.js"></script><script src="content.js"></script><script src="../../assets/vocab-hub.js"></script>
</body></html>
