<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rome CAT: accessible version</title>
<!--
  GENERATED by curriculum/history/ancient-rome/cat/accessible/build.js in the
  private Year-7-Humanities repository, with package.bin beside it. Rebuild
  there; do not edit this page.

  Hidden: not in the site map, opened by its address. package.bin is the CAT
  (the locked accessible version and how to run it, zipped) encrypted with the
  teacher password: PBKDF2-SHA256, 250000 rounds, then AES-GCM 256. Without
  the password it is unreadable, and the test inside is locked again with the
  same password.
-->
<style>
  :root{--sel:#1d3b4a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--sel);color:#fff;font:20px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:760px}
  h1{font:700 34px/1.2 Georgia,serif;margin:0 0 12px}
  p{margin:0 0 12px}
  label{display:block;font-weight:700;margin:22px 0 6px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  input{min-height:64px;font:inherit;font-size:22px;padding:10px 14px;border:3px solid #fff;border-radius:16px;width:min(380px,100%);color:#1f2a2e;background:#fff}
  button{min-height:64px;padding:8px 24px;font:inherit;font-weight:700;border:3px solid #fff;border-radius:16px;background:#fff;color:var(--sel);cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  :focus-visible{outline:4px solid #ffd54a;outline-offset:3px}
  #msg{min-height:1.5em;font-weight:700;margin-top:12px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Rome CAT: accessible digital version</h1>
  <p>A zip of the locked test and how to run it.</p>
  <label for="pw">Teacher password</label>
  <div class="row"><input type="password" id="pw" autocomplete="off" spellcheck="false"><button type="button" id="go">Download the zip</button></div>
  <p id="msg" role="alert"></p>
</main>
<script>
"use strict";
(() => {
  const ITER = 250000, NAME = "Rome CAT - accessible digital version.zip";
  const pw = document.getElementById("pw"), go = document.getElementById("go"), msg = document.getElementById("msg");
  async function get(){
    const p = pw.value.trim();
    if (!p) { msg.textContent = "Type the teacher password."; return; }
    if (!(window.crypto && crypto.subtle)) { msg.textContent = "This browser cannot open the download. Use Edge or Chrome."; return; }
    go.disabled = true; msg.textContent = "Checking.";
    try {
      const res = await fetch("package.bin?v=mwbc53w5");
      if (!res.ok) throw new Error(res.status);
      const buf = new Uint8Array(await res.arrayBuffer());
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name:"PBKDF2", hash:"SHA-256", salt:buf.slice(0, 16), iterations:ITER },
        base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
      let zip;
      try { zip = await crypto.subtle.decrypt({ name:"AES-GCM", iv:buf.slice(16, 28) }, key, buf.slice(28)); }
      catch (e) { msg.textContent = "That password is not right."; pw.value = ""; pw.focus(); return; }
      const url = URL.createObjectURL(new Blob([zip], { type:"application/zip" }));
      const a = document.createElement("a"); a.href = url; a.download = NAME;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      pw.value = "";
      msg.textContent = "Downloaded: " + NAME;
    } catch (e) {
      msg.textContent = "The download did not work. Check the internet connection and try again.";
    } finally { go.disabled = false; }
  }
  go.onclick = get;
  pw.onkeydown = e => { if (e.key === "Enter") get(); };
  pw.focus();
})();
</script>
</body>
</html>
