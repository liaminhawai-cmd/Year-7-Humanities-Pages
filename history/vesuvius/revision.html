<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ancient Rome: Revision</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23223f43'/><text x='16' y='24' font-family='Georgia,serif' font-size='22' font-weight='700' fill='%23c99a2e' text-anchor='middle'>7</text></svg>">
<!--
  HIDDEN. The Ancient Rome revision session before the CAT. Not in the site
  map (keep it out of tools/build_index_pages.py); the teacher shares the
  address.

  Catch up    every lesson page in the class OneNote, 1.1 to 4.3, with a done
              tick per page saved on this device, and each lesson's words in
              the vocab hub. Not timed, not locked.
  Challenge   a timed run in full screen, at the teacher's request. Leaving
              full screen or switching away resets the score to zero, and the
              teacher row counts how often. Seven stages, none locked:
                1 Timeline with years   drag 6 dated events onto the line
                2 Timeline, no years    6 events from memory, worth double
                3 The three periods     period names onto the bands, then 9
                                        events (no years) into the periods
                4 Cause and effect      drag each effect onto its cause
                5 Bump it up            12 short sentence stems about why the
                                        Western Empire fell, sorted into Year
                                        4, 6, 7 and 9 by the rubric's wording
                6 Key words             typed from the hub's own definitions
                7 How many years        two durations, one across BCE and CE
              10 points right first time, 5 on the second try, which follows
              a hint that names the rule. A first-try miss stays recorded.
              Timeline points go by how close; one adjustment, at half value.
  Report      any time ("Finish and see my report") or at the end: score,
              revision goals, lessons ranked by points lost with links, the
              student's missed words with a practice round.

  The events come from lessons the CAT does not test item by item (1.4's war
  with Hannibal, 4.1, 4.2, 4.3, the fall of Rome), never the CAT's own
  timeline or table rows. The Bump it up stems are kept short, and length
  does not rise with level: the mean is about 11 to 12 words in every box.

  Saved on this device only (localStorage). The OneNote links are written
  with single quotes in the script because the site's link check reads every
  double-quoted href as a path.
-->
<style>
  :root{
    --bg:#f6f1e7; --paper:#fffdf8; --ink:#1f2a2e; --muted:#5b6669; --line:#d9cfbd;
    --deep:#1d3b4a; --selbg:#dce9ee; --yes:#1f6b3a; --yesbg:#e3f2e7; --no:#9b2c1f; --nobg:#f8e3df;
    --mid:#8a5a00; --midbg:#fbefd6; --focus:#2c7488; --gold:#8a6d1e;
    --regal:#efe1f3; --rep:#e2eef8; --imp:#f8e7dc; --chron:#176b87; --cause:#a34d1d;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  a{color:#1d5f8a}
  [hidden]{display:none!important}

  .bar{background:var(--deep);color:#fbf7ee;display:flex;align-items:center;gap:14px;padding:6px 14px;flex-wrap:wrap}
  .bar .title{font:700 19px/1.2 Georgia,serif}
  .bar .title span{font:600 13px/1 system-ui,sans-serif;opacity:.75;margin-right:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{min-height:42px;padding:4px 16px;border:2px solid rgba(251,247,238,.35);border-radius:999px;background:transparent;color:#fbf7ee;font-weight:700;cursor:pointer}
  .tabs button[aria-current="true"]{background:#fbf7ee;color:var(--deep);border-color:#fbf7ee}
  .tabs button:disabled{opacity:.35;cursor:default}
  .status{margin-left:auto;font-size:15px;display:flex;gap:14px;align-items:center}
  .status b{font-size:18px}

  main{min-height:0;overflow:auto;padding:12px 14px}
  .wrap{max-width:1240px;margin:0 auto}

  /* ---------- catch up ---------- */
  .topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start}
  .topic{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
  .topic h2{font:700 18px/1.3 Georgia,serif;margin:2px 0 8px}
  .lesson{border-top:1px solid var(--line);padding:8px 0}
  .lesson:first-of-type{border-top:0}
  .lesson h3{font-size:15px;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .lesson h3 a{font-size:14px;font-weight:600;white-space:nowrap}
  .page{display:flex;align-items:center;gap:10px;min-height:44px}
  .tick{flex:none;min-width:44px;min-height:40px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:800;font-size:13px}
  .tick[aria-pressed="true"]{background:var(--yesbg);border-color:var(--yes);color:var(--yes)}
  .tick[aria-pressed="true"]::before{content:"✓ "}
  .page a{flex:1}
  .page.done a{color:var(--muted)}
  .note{color:var(--muted);font-size:14px;margin:10px 0 0}

  /* ---------- challenge frame ---------- */
  .panel{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:18px 22px}
  .start{max-width:720px;margin:20px auto;text-align:left}
  .start h2,.report h2{font:700 26px/1.2 Georgia,serif;margin:0 0 10px}
  .start ul{margin:8px 0 14px;padding-left:20px}
  .btn{min-height:46px;padding:6px 18px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;cursor:pointer}
  .btn.go{background:var(--deep);border-color:var(--deep);color:#fff}
  .btn.warn{background:var(--nobg);border-color:var(--no);color:var(--no)}
  .btn:disabled{opacity:.45;cursor:default}
  .alert{background:var(--nobg);color:var(--no);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-weight:700}
  .stages{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
  .stages .sp{min-height:40px;padding:4px 12px;border:2px solid var(--line);border-radius:999px;background:#fff;font-weight:700;cursor:pointer;font-size:14px}
  .stages .sp[aria-current="true"]{border-color:var(--deep);background:var(--selbg)}
  .stages .sp.done::after{content:" ✓";color:var(--yes)}
  .stages .fin{margin-left:auto}
  .task{font:700 20px/1.3 Georgia,serif;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 10px;font-size:15px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .msgs{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
  .msgs li{padding:6px 10px;border-radius:8px;background:#fff;border-left:4px solid var(--line)}
  .msgs li.ok{border-left-color:var(--yes)} .msgs li.mid{border-left-color:#c58a12} .msgs li.no{border-left-color:var(--no)}
  .lessontag{color:var(--muted);font-size:13px}

  /* ---------- draggable chips ---------- */
  .tray{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:12px;background:#fbf8f1}
  .chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;
        cursor:grab;touch-action:none;user-select:none;text-align:left;max-width:100%;font-size:15px}
  .chip .num{flex:none;width:1.8em;height:1.8em;border-radius:999px;background:var(--deep);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .chip[aria-pressed="true"]{border-color:var(--focus);box-shadow:0 0 0 3px rgba(44,116,136,.25)}
  .chip.placed{opacity:.45}
  .chip.locked{cursor:default;border-color:var(--yes);background:var(--yesbg)}
  .chip.wrong{border-color:var(--no);background:var(--nobg)}
  .chip.shown{border-style:dashed;border-color:var(--no)}
  .chip .g{font-weight:800}
  .chip .g.chron{color:var(--chron)} .chip .g.cause{color:var(--cause)}
  .ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%);opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .lifted{opacity:.3}
  .over{outline:3px dashed var(--focus);outline-offset:-3px}
  [data-drop]{cursor:pointer}

  /* ---------- timeline ---------- */
  .axis{position:relative;height:200px;margin:12px 6px 4px;border-radius:12px;background:#fff;border:2px solid var(--line)}
  .axis .base{position:absolute;left:0;right:0;bottom:44px;height:4px;background:var(--deep)}
  .axis .tk{position:absolute;bottom:30px;width:2px;height:18px;background:var(--deep);transform:translateX(-1px)}
  .axis .tl{position:absolute;bottom:6px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
  .axis .zero{position:absolute;bottom:26px;width:3px;height:30px;background:var(--gold);transform:translateX(-1px)}
  .pin{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;cursor:grab;touch-action:none;background:none;border:0;padding:0}
  .pin .num{width:30px;height:30px;border-radius:999px;background:var(--deep);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .pin .stem{width:2px;background:var(--deep)}
  .pin.ok .num{background:var(--yes)} .pin.mid .num{background:#c58a12} .pin.no .num{background:var(--no)}
  .truth{position:absolute;bottom:39px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;z-index:2}
  .truth i{width:12px;height:12px;background:var(--gold);transform:rotate(45deg);display:block}
  .truth span{font-size:11px;font-weight:700;color:#5d4a12;white-space:nowrap;background:#fff7dd;border:1px solid var(--gold);padding:0 4px;border-radius:4px}
  .axis.mini{position:absolute;left:0;right:0;bottom:0;height:46px;margin:0;border:0;background:transparent;border-radius:0}
  .axis.mini .base{bottom:40px}

  /* ---------- periods ---------- */
  .bands{position:relative;height:262px;margin:12px 6px 4px;border:2px solid var(--line);border-radius:12px;background:#fff}
  .band{position:absolute;top:8px;bottom:50px;border-radius:10px;border:2px dashed #b9ad97;padding:6px;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .band.b0{background:var(--regal)} .band.b1{background:var(--rep)} .band.b2{background:var(--imp)}
  .band .slotname{min-height:40px;border:2px dashed #9c907a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:14px;background:rgba(255,255,255,.6)}
  .band .chip{font-size:13px;min-height:40px;padding:4px 8px}

  /* ---------- match ---------- */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:stretch;margin-top:10px}
  .causerow{background:#fff;border:2px solid var(--line);border-left:6px solid var(--cause);border-radius:10px;padding:8px 12px;display:flex;align-items:center}
  .tray.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .tray.grid3 .chip{font-size:14px;min-height:40px;padding:4px 10px}
  .slot{min-height:52px;border:2px dashed var(--line);border-radius:10px;padding:4px;display:flex;align-items:center;background:#fbf8f1}
  .slot .chip{width:100%}

  /* ---------- levels ---------- */
  .boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
  .box{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;min-height:230px;display:flex;flex-direction:column;gap:6px}
  .box h4{margin:0;font:700 17px/1.2 Georgia,serif}
  .box .d{font-size:12px;color:var(--muted);line-height:1.3;margin:0}
  .box .d b.chron{color:var(--chron)} .box .d b.cause{color:var(--cause)}
  .box .chip{font-size:13px;min-height:40px;padding:4px 8px}
  .key{font-size:13px;color:var(--muted)}
  .key b.chron{color:var(--chron)} .key b.cause{color:var(--cause)}

  /* ---------- typed ---------- */
  .typed{max-width:760px}
  .def{font-size:19px;margin:6px 0 12px;padding:10px 14px;background:#fff;border-left:4px solid var(--gold);border-radius:6px}
  input[type=text]{min-height:48px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;width:min(360px,100%);font-size:19px}
  .dots{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .dot{min-width:40px;min-height:40px;border:2px solid var(--line);border-radius:8px;background:#fff;font-weight:800;cursor:pointer;font-size:14px}
  .dot[aria-current="true"]{border-color:var(--deep);background:var(--selbg)}
  .dot.r{border-color:var(--yes);color:var(--yes)} .dot.f{border-color:#c58a12;color:var(--mid)} .dot.w{border-color:var(--no);color:var(--no)}
  .fb{margin:12px 0 0;padding:10px 14px;border-radius:12px}
  .fb.ok{background:var(--yesbg);color:var(--yes)} .fb.mid{background:var(--midbg);color:var(--mid)} .fb.no{background:var(--nobg);color:var(--no)}

  /* ---------- report ---------- */
  .report{max-width:1000px;margin:0 auto}
  .score{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline;margin:0 0 6px}
  .score .big{font:700 40px/1 Georgia,serif}
  .goals{counter-reset:g;list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
  .goals li{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px}
  .goals li .gh{display:block;font-size:17px;font-weight:700}
  .prio{margin:8px 0 0;padding-left:22px}
  .prio li{margin:4px 0}
  .words{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:8px}
  .words div{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px}
  .rep summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
  .rep pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;max-height:8em;overflow:auto}
  .rep p{font-size:13px;color:var(--muted);margin:6px 0}
  h3.sec{font:700 19px/1.3 Georgia,serif;margin:18px 0 4px}

  @media screen and (max-width:860px){
    .boxes{grid-template-columns:repeat(2,minmax(0,1fr))}
    .match{grid-template-columns:1fr}
    .status{margin-left:0}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header class="bar">
  <div class="title"><span>Ancient Rome</span>Revision</div>
  <nav class="tabs" aria-label="Revision">
    <button type="button" data-tab="catch">Catch up</button>
    <button type="button" data-tab="chal">Challenge</button>
  </nav>
  <div class="status" id="status" aria-live="polite"></div>
</header>

<main>
  <section id="catch" class="wrap">
    <div class="topics" id="topics"></div>
    <p class="note">Tick a page when its work is finished. Ticks are saved on this device only. Words opens that lesson in the vocab hub.</p>
  </section>

  <section id="chal" class="wrap" hidden>
    <div id="vStart"></div>
    <div id="vRun" hidden>
      <nav class="stages" id="stages" aria-label="Stages"></nav>
      <div class="panel" id="stage"></div>
    </div>
    <div id="vReport" hidden></div>
  </section>
</main>

<script>
/* =======================================================================
   CONTENT
   PAGES: the class OneNote pages. A null link means the lesson has no page
   link yet, so only its vocab hub words are offered.
   Every item's `go` names a page in PAGES; its hub lesson is the first three
   characters of that key.
   ======================================================================= */
const NB = "https://kewhighschool.sharepoint.com/sites/Section_7HUM.F-2026/_layouts/Doc.aspx?sourcedoc={53E5B44D-E42B-46FD-8349-5295A5D79914}&wd=target%28_Content%20Library%2FHistory%202.one%7C92B89456-650A-4A65-9AAE-CEAE6384627B%2F";
const PG = (path, part) => NB + path + "%2F%29&wdpartid={" + part + "}{1}&wdsectionfileid={F01141D1-1DD1-45FD-A534-BB20F1602329}";
const PAGES = {
  "1.1":   ["1.1 The Origins of Rome", PG("1.1%20The%20Origins%20of%20Rome%7C0FE1B11A-C920-4FAC-BA53-592A9B96D7EC", "94E6D062-BB86-4826-8B90-1DAF33D76457")],
  "1.1ce": ["1.1 cause and effect", PG("1.1%20cause%20and%20effect%7C96426625-4512-434D-B6D0-7CC733BC96FF", "05E5B9E9-1812-4EBE-80DB-D341A44CD8A0")],
  "1.1rv": ["Revision Task: The origins of Ancient Rome", PG("Revision%20Task%3A%20The%20origins%20of%20Ancient%20Rome%7CDDCAA9D1-F98B-4653-A702-8741B45AFFD6", "06AB3CDC-75D4-405B-B5AD-79B0B611AE48")],
  "1.2":   ["1.2 Geography of Ancient Rome", PG("1.2%20Geography%20of%20Ancient%20Rome%7C095BDDF6-E451-4C01-90A7-1F72C9988555", "C9CC931C-ED6B-4DB1-A250-B05177B7C4AE")],
  "1.2t":  ["1.2 table", PG("1.2%20table%7C6F7DBE08-EA48-4A1E-A93E-08DD1423A694", "F4E59AAA-31C6-4DCA-9606-9183A13C1598")],
  "1.3":   ["1.3 The Rise of the Romans", PG("1.3%20The%20Rise%20of%20the%20Romans%7C1DF94F7B-E85D-44A3-9AB7-52136419DCE4", "1F12566E-D2E0-49E9-9EE0-77E71250CB72")],
  "1.4":   ["1.4 The Spreading Empire", PG("1.4%20The%20Spreading%20Empire%7CFBBBB835-33FB-4B45-8F28-4CD4FD06D0B9", "EA9CD43F-3F30-4C11-ABF7-1FB8F697C028")],
  "1.4es": ["Event summary", PG("Event%20summary%7C3B99755F-8F48-4831-ADCF-A9072FBC4B54", "1458E241-9D5E-4945-BD05-FA83787911F0")],
  "1.4cc": ["1.4 Cause and Effect + Chronology", PG("1.4%20Cause%20and%20Effect%20%2B%20Chronology%7C6331EE7D-FA9D-4F1C-A7AF-2EF2DAE6EAA7", "2FC2594A-EC94-4A64-906E-F6AFDAA19421")],
  "2.1":   ["2.1 Social Groups and Classes", PG("2.1%20Social%20Groups%20and%20Classes%7C5F32DE68-91A1-4F66-9269-1D9627E39970", "59EC7B53-D766-417D-BB15-265F8ED1746E")],
  "2.2":   ["2.2 The Rights of Citizens", PG("2.2%20The%20Rights%20of%20Citizens%7CDA0F27B0-36E9-497A-83B5-F6DFB9DF2566", "EC2102DE-3553-4D56-A0D4-2F711E793A23")],
  "2.2w":  ["2.2 W", PG("2.2%20W%7C3EADE1B9-9BE2-448D-870B-BCD5E0942254", "0F4F86A1-F794-4173-81B2-6B59ECDB2BFA")],
  "2.2ws": ["2.2 Ws", PG("2.2%20Ws%7CBAEF6F6B-D3DA-4054-ACD9-CDD3E5AA0C76", "4A2236B4-3427-4962-902E-3F8809F90C3E")],
  "2.3":   ["2.3 Peasants and Slaves", PG("2.3%20Peasants%20and%20Slaves%7C0213F0A6-C51C-4F69-AAD6-ED06F2868FB9", "D4C718BD-9EB4-454E-8123-AF32A87700D4")],
  "3.1":   ["3.1 Roman Republic to Roman Empire", PG("3.1%20Roman%20Republic%20to%20Roman%20Empire%7C0E4D5036-78BF-4FC2-B05D-65D6A2D605B9", "6D5A9686-78F1-4E5D-B00C-BC82EE6B4DE7")],
  "3.2":   ["3.2 Religion", PG("3.2%20Religion%7C71846B06-CBA9-4E4D-AEF2-CB92D3452984", "0CD4E1B0-27D5-4D23-9389-FC1280CF0CC7")],
  "4.1":   ["4.1 Roman Law", PG("4.1%20Roman%20Law%7C107B0E0E-DD7D-49E4-B1CC-4A7BBE26D2CE", "0E9AF456-6860-0A36-0B1B-9FD72733ED1F")],
  "4.2":   ["4.2 Roman Technology", PG("4.2%20Roman%20Technology%7C71ED0B60-68CD-4BFC-9577-DDF6866855C1", "F732D0CB-FCA0-0036-128C-7E1A73FC1AD5")],
  "4.3":   ["4.3 The Roman Army", PG("4.3%20The%20Roman%20Army%7C98659842-2A24-4E22-9C62-612E485D7F32", "B42D6D85-C078-03AB-158F-61185D7DB391")],
  "4.3m":  ["4.3 The Roman army modified skill based lesson", PG("4.3%20The%20Roman%20army%20modified%20skill%20based%20lesson%7C2B04F1CB-67C0-4086-AF16-9BEB172C585A", "FFA260EE-6DFC-4C44-8B2A-656F066F928B")],
  "5.1":   ["5.1 The Fall of Rome", null]
};

const TOPICS = [
  { name:"Topic 1 · Introduction to Ancient Rome", lessons:[
    { id:"1.1", title:"1.1 The Origins of Rome", pages:["1.1","1.1ce","1.1rv"] },
    { id:"1.2", title:"1.2 Geography of Ancient Rome", pages:["1.2","1.2t"] },
    { id:"1.3", title:"1.3 The Rise of the Romans", pages:["1.3"] },
    { id:"1.4", title:"1.4 The Spreading Empire", pages:["1.4","1.4es","1.4cc"] } ] },

const ROOT = document.documentElement;
const fsAPI = !!(ROOT.requestFullscreen || ROOT.webkitRequestFullscreen);
const inFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function askFS(){
  const f = ROOT.requestFullscreen || ROOT.webkitRequestFullscreen;
  try { const p = f.call(ROOT); return p && p.then ? p : Promise.resolve(); } catch (e) { return Promise.reject(e); }
}
function startRun(){
  const go = () => {
    R = newRun(); R.status = "running"; R.t0 = Date.now();
    clearInterval(tick); tick = setInterval(status, 1000);
    showTab("chal");
  };
  if (!fsAPI){ go(); return; }
  /* Wait for full screen to arrive, but never forever: some browsers leave
     the request unanswered, and the page must not just sit there. */
  let settled = false;
  const fail = () => { if (settled) return; settled = true; drawStart("Full screen did not start. Press Start again."); };
  const ok = () => { if (settled) return; settled = true; go(); };
  const timer = setTimeout(() => { inFS() ? ok() : fail(); }, 2000);
  askFS().then(() => { if (inFS()){ clearTimeout(timer); ok(); } })
         .catch(() => { clearTimeout(timer); fail(); });
}
function resetRun(why){
  if (R.status !== "running") return;
  S.resets = (S.resets || 0) + 1; save();
  clearInterval(tick);
  R = newRun();
  sel = null;
  showTab("chal");
  drawStart(why);
}
function onFS(){ if (R.status === "running" && fsAPI && !inFS()) resetRun("You left full screen, so your score went back to zero."); }
document.addEventListener("fullscreenchange", onFS);
document.addEventListener("webkitfullscreenchange", onFS);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") resetRun("You left the page, so your score went back to zero.");
});
/* Alt+Tab to another app can leave the browser in full screen, so losing
   focus counts too, after a short grace for the full-screen switch itself. */
window.addEventListener("blur", () => {
  if (R.status === "running" && Date.now() - R.t0 > 1500) resetRun("You switched to another window, so your score went back to zero.");
});
function finishRun(){
  if (R.status !== "running") return;
  R.status = "done"; R.time = Date.now() - R.t0; clearInterval(tick);
  // resets belong to this run only, so a shared laptop does not pass them on
  R.resets = S.resets || 0; S.resets = 0;
  const sc = score();
  const row = rowText();
  if (!S.best || sc > S.best.score || (sc === S.best.score && R.time < S.best.time)) S.best = { score:sc, time:R.time, date:today() };
  S.last = row; save();
  if (inFS()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
  showTab("chal");
}

function maybeAllDone(){ if (STAGES.every(s => stageDone(s.id))) finishRun(); }

/* =======================================================================
   DRAG: drag with a mouse or finger, or tap a card and then tap where it
   goes, or Tab to a card, press Enter, Tab to a place, press Enter.
   ======================================================================= */
function wireDrag(root, onDrop){
  root.querySelectorAll("[data-drag]").forEach(card => {
    card.addEventListener("pointerdown", e => startDrag(e, card, onDrop));
    card.addEventListener("click", () => { if (dragMoved) return; selectCard(root, card); });
    card.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); selectCard(root, card); }
      if (card.classList.contains("pin") && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
        e.preventDefault(); onDrop({ nudge: (e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 50 : 5), id: card.dataset.id, kind: card.dataset.drag });
      }
    });
  });
  root.querySelectorAll("[data-drop]").forEach(z => {
    z.addEventListener("click", e => { if (sel && !dragMoved && !e.target.closest("[data-drag]")) onDrop({ zone: z, x: e.clientX, y: e.clientY, ...sel }); });
    z.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && sel && e.target === z){ e.preventDefault(); const r = z.getBoundingClientRect(); onDrop({ zone: z, x: r.left + r.width / 2, y: r.top + r.height / 2, ...sel }); }
    });
  });
}
function selectCard(root, card){
  const same = sel && sel.id === card.dataset.id && sel.kind === card.dataset.drag;
  sel = same ? null : { id: card.dataset.id, kind: card.dataset.drag };
  root.querySelectorAll("[data-drag]").forEach(c => c.setAttribute("aria-pressed", String(!!sel && c.dataset.id === sel.id && c.dataset.drag === sel.kind)));
}
function startDrag(e, card, onDrop){
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const sx = e.clientX, sy = e.clientY;
  let ghost = null, over = null;
  dragMoved = false;
  const move = ev => {
    if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6){
      dragMoved = true;
      ghost = card.cloneNode(true); ghost.classList.add("ghost"); ghost.removeAttribute("id");
      ghost.style.width = card.getBoundingClientRect().width + "px";
      document.body.appendChild(ghost); card.classList.add("lifted");
    }
    if (ghost){
      ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
      const z = document.elementFromPoint(ev.clientX, ev.clientY);
      const zone = z && z.closest("[data-drop]");
      if (zone !== over){ if (over) over.classList.remove("over"); over = zone; if (over) over.classList.add("over"); }
    }
  };
  const up = ev => {
    removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
    if (!ghost) return;
    ghost.remove(); card.classList.remove("lifted"); if (over) over.classList.remove("over");
    const z = document.elementFromPoint(ev.clientX, ev.clientY);
    const zone = z && z.closest("[data-drop]");
    if (zone) onDrop({ zone, x: ev.clientX, y: ev.clientY, id: card.dataset.id, kind: card.dataset.drag });
    sel = null;
    setTimeout(() => { dragMoved = false; }, 0);
  };
  addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
}

/* =======================================================================
   1 and 2  TIMELINES
   ======================================================================= */
const xOf = y => ((y - AX.from) / (AX.to - AX.from)) * 100;
function axisTicks(withLabels){
  let h = `<div class="base"></div><div class="zero" style="left:${xOf(0)}%"></div>`;
  for (let y = -800; y <= 500; y += 100){
    if (y === 0) continue;
    h += `<div class="tk" style="left:${xOf(y)}%"></div>`;
    if (withLabels) h += `<div class="tl" style="left:${xOf(y)}%">${y < 0 ? -y + " BCE" : y + " CE"}</div>`;
  }
  if (withLabels) h += `<div class="tl" style="left:${xOf(0)}%;bottom:-10px;color:var(--gold);font-weight:700">BCE | CE</div>`;
  return h;
}
function tlPoints(st, dist){
  if (st.clue) return dist <= 10 ? 10 : dist <= 25 ? 7 : dist <= 50 ? 4 : 0;
  return dist <= 25 ? 20 : dist <= 60 ? 15 : dist <= 120 ? 10 : dist <= 250 ? 5 : 0;
}
function drawTimeline(st){
  const att = R.attempt[st.id] || 0, done = stageDone(st.id);
  const P = R.place;
  // lanes, so pins close together do not cover each other
  const placed = st.items.filter(e => P[st.id + ":" + e.id] !== undefined)
    .map(e => ({ e, x: xOf(P[st.id + ":" + e.id]) })).sort((a, b) => a.x - b.x);
  const lane = {}; const lastX = [];
  placed.forEach(p => { let l = 0; while (lastX[l] !== undefined && p.x - lastX[l] < 3.2) l++; lastX[l] = p.x; lane[p.e.id] = l; });
  const pins = placed.map(({ e, x }) => {
    const key = st.id + ":" + e.id, n = st.items.indexOf(e) + 1;
    const cls = att ? (R.pts[key] >= ITEM[key].max ? "ok" : R.pts[key] > 0 || (R.first[key] || 0) > 0 ? "mid" : "no") : "";
    const locked = done || (att && R.pts[key] >= ITEM[key].max);
    const h = 26 + lane[e.id] * 34;
    return `<button type="button" class="pin ${cls}" style="left:${x}%;bottom:46px" ${locked ? "" : `data-drag="pin" data-id="${e.id}"`} aria-label="${esc(e.label)}${st.clue ? ", " + fmtY(e.y) : ""}"><span class="num">${n}</span><span class="stem" style="height:${h}px"></span></button>`;
  }).join("");
  const truths = done ? st.items.map(e => `<div class="truth" style="left:${xOf(e.y)}%"><span>${st.items.indexOf(e) + 1}: ${esc(fmtY(e.y))}</span><i></i></div>`).join("") : "";
  const chips = st.items.map((e, k) => {
    const key = st.id + ":" + e.id, on = P[key] !== undefined;
    const locked = done || (att && R.pts[key] >= ITEM[key].max);
    return `<button type="button" class="chip ${on ? "placed" : ""} ${locked ? "locked" : ""}" ${locked ? "" : `data-drag="chip" data-id="${e.id}"`}><span class="num">${k + 1}</span>${esc(e.label)}${st.clue ? ` <b>${esc(fmtY(e.y))}</b>` : ""}</button>`;
  }).join("");
  const all = st.items.every(e => P[st.id + ":" + e.id] !== undefined);
  const msgs = st.items.map((e, k) => R.msg[st.id + ":" + e.id] ? `<li class="${R.msg[st.id + ":" + e.id][0]}">${k + 1}. ${R.msg[st.id + ":" + e.id][1]}</li>` : "").join("");
  el("stage").innerHTML = `
    <h2 class="task">${st.clue ? "Drag each event to its year on the timeline." : "No years this time. Drag each event to when you think it happened."}</h2>
    <p class="sub">${st.clue ? "Closer earns more: up to 10 points each." : "Closer earns more: up to 20 points each, because you are working from memory."} Tap a card, then tap the line, if you would rather not drag.</p>
    <div class="tray" data-drop="tray">${chips}</div>
    <div class="axis" data-drop="axis" tabindex="0" aria-label="Timeline, 800 BCE to 500 CE">${axisTicks(true)}${truths}${pins}</div>
    <ul class="msgs">${msgs}</ul>
    <div class="row">${done ? nextStageBtn() : `<button type="button" class="btn go" id="chk" ${all ? "" : "disabled"}>${att ? "Check again" : "Check"}</button>`}</div>`;
  wireNext();
  const onDrop = d => {
    if (stageDone(st.id)) return;
    const key = st.id + ":" + d.id;
    if (d.nudge !== undefined){ if (P[key] !== undefined){ P[key] = clampY(P[key] + d.nudge); drawRun(); focusPin(d.id); } return; }
    const zone = d.zone.dataset.drop;
    if (zone === "tray") delete P[key];
    if (zone === "axis"){
      const r = d.zone.getBoundingClientRect();
      P[key] = clampY(Math.round((AX.from + ((d.x - r.left) / r.width) * (AX.to - AX.from)) / 5) * 5);
    }
    sel = null; drawRun();
  };
  wireDrag(el("stage"), onDrop);
  const chk = el("chk"); if (chk) chk.onclick = () => checkTimeline(st);
}
const clampY = y => Math.max(AX.from, Math.min(AX.to, y));
function focusPin(id){ const p = el("stage").querySelector(`.pin[data-id="${id}"]`); if (p) p.focus(); }
function checkTimeline(st){
  const att = (R.attempt[st.id] || 0) + 1; R.attempt[st.id] = att;
  let allFull = true;
  st.items.forEach(e => {
    const key = st.id + ":" + e.id, at = R.place[key], dist = Math.abs(at - e.y), p = tlPoints(st, dist);
    const dir = at < e.y ? "too early" : "too late";
    const off = dist <= 10 ? "spot on" : `about ${Math.max(10, Math.round(dist / 10) * 10)} years ${dir}`;
    if (att === 1){
      R.first[key] = p; R.pts[key] = p;
      if (p < ITEM[key].max){
        allFull = false;
        R.msg[key] = [p ? "mid" : "no", `${esc(e.label)}: ${off}. ${p} points so far. Move it and check again for a better score.${lessonTag(e.go)}`];
      } else R.msg[key] = ["ok", `${esc(e.label)}: ${off}, ${p} points.`];
    } else {
      if (R.first[key] < ITEM[key].max){
        const p2 = Math.floor(p / 2);
        R.pts[key] = Math.max(R.first[key], p2);
        R.msg[key] = [R.pts[key] >= ITEM[key].max ? "ok" : R.pts[key] ? "mid" : "no",
          `${esc(e.label)} was <b>${esc(fmtY(e.y))}</b>. Second try ${off}: ${R.pts[key]} points.${lessonTag(e.go)}`];
      }
    }
  });
  if (att >= 2 || allFull){
    R.done[st.id] = true;
    st.items.forEach(e => { const key = st.id + ":" + e.id; if (R.msg[key] && R.msg[key][0] === "ok" && att === 1) R.msg[key][1] += ` It was ${esc(fmtY(e.y))}.`; });
    if (st.id === "tlA" || st.id === "tlB"){ /* reveal sits on the axis */ }
  }
  drawRun(); maybeAllDone();
}
const lessonTag = go => ` <span class="lessontag">Lesson: ${esc(lessonName(go))}</span>`;

/* =======================================================================
   3  THE THREE PERIODS
   ======================================================================= */
function drawPeriods(st){
  const att = R.attempt.periods || 0, done = stageDone("periods");
  const P = R.place;
  const lockedKey = key => done || (att && R.first[key] !== undefined && R.pts[key] > 0 && !R.msg[key]?.[2]);
  const labelChip = p => {
    const key = "periods:L" + p.id, locked = lockedKey(key) || (att && R.pts[key] > 0);
    return `<button type="button" class="chip ${locked ? "locked" : ""} ${R.msg[key] && !R.pts[key] && done ? "shown" : ""}" ${locked || done ? "" : `data-drag="label" data-id="${p.id}"`}><b>${esc(p.name)}</b></button>`;
  };
  const evChip = e => {
    const key = "periods:" + e.id, locked = done || (att && R.pts[key] > 0);
    return `<button type="button" class="chip ${locked ? "locked" : ""} ${done && !R.pts[key] ? "shown" : ""}" ${locked ? "" : `data-drag="event" data-id="${e.id}"`}>${esc(e.label)}</button>`;
  };
  const bands = PERIODS.map((p, k) => {
    const lab = PERIODS.find(q => P["periods:L" + q.id] === p.id);
    const evs = PERIOD_EVENTS.filter(e => P["periods:" + e.id] === p.id);
    return `<div class="band b${k}" data-drop="band:${p.id}" tabindex="0" aria-label="Band from ${fmtY(p.from)} to ${fmtY(p.to)}"
      style="left:${xOf(p.from)}%;width:${xOf(p.to) - xOf(p.from)}%">
      <div class="slotname">${lab ? labelChip(lab) : "Period name?"}</div>${evs.map(evChip).join("")}</div>`;
  }).join("");
  const trayLabels = PERIODS.filter(p => P["periods:L" + p.id] === undefined).map(labelChip).join("");
  const trayEvents = PERIOD_EVENTS.filter(e => P["periods:" + e.id] === undefined).map(evChip).join("");
  const all = PERIODS.every(p => P["periods:L" + p.id] !== undefined) && PERIOD_EVENTS.every(e => P["periods:" + e.id] !== undefined);
  const msgs = [...PERIODS.map(p => "periods:L" + p.id), ...PERIOD_EVENTS.map(e => "periods:" + e.id)]
    .filter(k => R.msg[k]).map(k => `<li class="${R.msg[k][0]}">${R.msg[k][1]}</li>`).join("");
  el("stage").innerHTML = `
    <h2 class="task">Name the three periods, then put each event in its period.</h2>
    <p class="sub">The bands sit where the periods fall on the timeline. The events have no years: you need to know when they happened.</p>
    <div class="tray" data-drop="tray">${trayLabels || ""}${trayEvents || ""}${!trayLabels && !trayEvents ? `<span class="sub">Everything is placed.</span>` : ""}</div>
    <div class="bands">${bands}<div class="axis mini">${axisTicks(true)}</div></div>
    <ul class="msgs">${msgs}</ul>
    <div class="row">${done ? nextStageBtn() : `<button type="button" class="btn go" id="chk" ${all ? "" : "disabled"}>${att ? "Check again" : "Check"}</button>`}</div>`;
  wireNext();
  wireDrag(el("stage"), d => {
    if (done || !d.zone) return;
    const zone = d.zone.dataset.drop;
    if (d.kind === "label"){
      const key = "periods:L" + d.id;
      if (zone === "tray") delete P[key];
      else if (zone.startsWith("band:")){
        const b = zone.slice(5);
        if (PERIODS.some(q => P["periods:L" + q.id] === b && q.id !== d.id && att && R.pts["periods:L" + q.id] > 0)) return; // a checked name is there
        PERIODS.forEach(q => { if (P["periods:L" + q.id] === b && q.id !== d.id) delete P["periods:L" + q.id]; });
        P[key] = b;
      }
    } else {
      const key = "periods:" + d.id;
      if (zone === "tray") delete P[key];
      else if (zone.startsWith("band:")) P[key] = zone.slice(5);
    }
    sel = null; drawRun();
  });
  const chk = el("chk"); if (chk) chk.onclick = checkPeriods;
}
function checkPeriods(){
  const att = (R.attempt.periods || 0) + 1; R.attempt.periods = att;
  const P = R.place;
  PERIODS.forEach(p => {
    const key = "periods:L" + p.id;
    if (att > 1 && R.pts[key] > 0 && R.first[key] !== undefined) return;
    const ok = P[key] === p.id;
    award(key, ok, att);
    if (ok) R.msg[key] = att === 1 ? null : ["ok", `${esc(p.name)}: fixed. ${esc(fmtY(p.from))} to ${esc(fmtY(p.to))}.`];
    else if (att === 1){
      const n = PERIODS.filter(q => P["periods:L" + q.id] !== q.id).length;
      delete P[key];
      R.msg[key] = ["no", `${n === 1 ? "One period name was" : n + " period names were"} in the wrong place. The periods go in time order, and each one starts where the last one ends.${lessonTag("1.4cc")}`];
    }
    else { P[key] = p.id; R.msg[key] = ["no", `The <b>${esc(p.name)}</b> runs ${esc(fmtY(p.from))} to ${esc(fmtY(p.to))}, when Rome was ruled by ${esc(p.who)}.${lessonTag("1.4cc")}`]; }
  });
  PERIOD_EVENTS.forEach(e => {
    const key = "periods:" + e.id;
    if (att > 1 && R.pts[key] > 0 && R.first[key] !== undefined) return;
    const ok = P[key] === e.period, per = PERIODS.find(p => p.id === e.period);
    award(key, ok, att);
    if (ok) R.msg[key] = att === 1 ? null : ["ok", `${esc(e.label)}: fixed.`];
    else if (att === 1){ delete P[key]; R.msg[key] = ["no", `${esc(e.label)}: not that period. Think about who was ruling Rome when it happened.${lessonTag(e.go)}`]; }
    else { P[key] = e.period; R.msg[key] = ["no", `${esc(e.label)} was ${esc(e.when)}, in the <b>${esc(per.name)}</b>.${lessonTag(e.go)}`]; }
  });
  // one message for the period names, not three
  const nameMsgs = PERIODS.map(p => "periods:L" + p.id).filter(k => R.msg[k] && att === 1);
  nameMsgs.slice(1).forEach(k => R.msg[k] = null);
  if (att >= 2 || [...PERIODS.map(p => "periods:L" + p.id), ...PERIOD_EVENTS.map(e => "periods:" + e.id)].every(k => R.pts[k] > 0)) R.done.periods = true;
  drawRun(); maybeAllDone();
}

/* =======================================================================
   4  CAUSE AND EFFECT
   ======================================================================= */
function drawMatch(){
  const att = R.attempt.ce || 0, done = stageDone("ce"), P = R.place;
  const effChip = c => {
    const key = "ce:" + c.id, locked = done || (att && R.pts[key] > 0);
    return `<button type="button" class="chip ${locked ? "locked" : ""} ${done && !R.pts[key] ? "shown" : ""}" ${locked ? "" : `data-drag="effect" data-id="${c.id}"`}>${esc(c.effect)}</button>`;
  };
  const rows = CE.map(c => {
    const inSlot = CE.find(x => P["ce:" + x.id] === c.id);
    return `<div class="causerow">${esc(c.cause)}</div><div class="slot" data-drop="slot:${c.id}" tabindex="0" aria-label="What did it lead to?">${inSlot ? effChip(inSlot) : `<span class="sub" style="margin:0 8px">What did it lead to?</span>`}</div>`;
  }).join("");
  const tray = CE_TRAY.map(id => CE.find(c => c.id === id)).filter(c => P["ce:" + c.id] === undefined).map(effChip).join("");
  const all = CE.every(c => P["ce:" + c.id] !== undefined);
  const msgs = CE.filter(c => R.msg["ce:" + c.id]).map(c => `<li class="${R.msg["ce:" + c.id][0]}">${R.msg["ce:" + c.id][1]}</li>`).join("");
  el("stage").innerHTML = `
    <h2 class="task">Drag each effect next to the cause that led to it.</h2>
    <p class="sub">Three are from the war with Hannibal, three from the fall of the Western Empire.</p>
    <div class="tray" data-drop="tray">${tray || `<span class="sub">Every effect is placed.</span>`}</div>
    <div class="match">${rows}</div>
    <ul class="msgs">${msgs}</ul>
    <div class="row">${done ? nextStageBtn() : `<button type="button" class="btn go" id="chk" ${all ? "" : "disabled"}>${att ? "Check again" : "Check"}</button>`}</div>`;
  wireNext();
  wireDrag(el("stage"), d => {
    if (done || !d.zone) return;
    const zone = d.zone.dataset.drop, key = "ce:" + d.id;
    if (zone === "tray") delete P[key];
    else if (zone.startsWith("slot:")){
      const c = zone.slice(5);
      CE.forEach(x => { if (P["ce:" + x.id] === c && x.id !== d.id && !(att && R.pts["ce:" + x.id] > 0)) delete P["ce:" + x.id]; });
      if (CE.some(x => P["ce:" + x.id] === c && x.id !== d.id)) return; // a locked effect is there
      P[key] = c;
    }
    sel = null; drawRun();
  });
  const chk = el("chk"); if (chk) chk.onclick = () => {
    const att2 = (R.attempt.ce || 0) + 1; R.attempt.ce = att2;
    CE.forEach(c => {
      const key = "ce:" + c.id;
      if (att2 > 1 && R.pts[key] > 0) return;
      const ok = P[key] === c.id;
      award(key, ok, att2);
      const cause = CE.find(x => x.id === P[key]);
      if (ok) R.msg[key] = att2 === 1 ? null : ["ok", `Fixed: ${esc(c.why)}`];
      else if (att2 === 1){ R.msg[key] = ["no", `“${esc(c.effect)}” did not come from “${esc(cause ? cause.cause : "")}” ${esc(c.hint)}${lessonTag(c.go)}`]; delete P[key]; }
      else { P[key] = c.id; R.msg[key] = ["no", `“${esc(c.cause)}” led to “${esc(c.effect)}”. ${esc(c.why)}${lessonTag(c.go)}`]; }
    });
    if (att2 >= 2 || CE.every(c => R.pts["ce:" + c.id] > 0)) R.done.ce = true;
    drawRun(); maybeAllDone();
  };
}

/* =======================================================================
   5  BUMP IT UP: WHY DID THE WESTERN EMPIRE FALL?
   ======================================================================= */

    const key = "levels:" + s.id, locked = done || (att && R.pts[key] > 0);

  el("stage").innerHTML = `

    <div class="tray grid3" data-drop="tray">${tray || `<span class="sub">Every piece is placed.</span>`}</div>
    <div class="boxes">${boxes}</div>
    <ul class="msgs">${msgs}</ul>

  wireNext();
  wireDrag(el("stage"), d => {
    if (done || !d.zone) return;

    if (zone === "tray") delete P[key];

    STEMS.forEach(s => {

      award(key, ok, att2);
      if (ok) R.msg[key] = att2 === 1 ? null : ["ok", `Fixed: ${esc(s.why)}`];
      else if (att2 === 1){ R.msg[key] = ["no", `“${esc(s.text)}” is not Year ${P[key]}. ${esc(s.hint)}`]; delete P[key]; }
      else { P[key] = s.lv; R.msg[key] = ["no", `“${esc(s.text)}” ${esc(s.why)}`]; }
    });
    if (att2 >= 2 || STEMS.every(s => R.pts["levels:" + s.id] > 0)) R.done.levels = true;
    drawRun(); maybeAllDone();
  };
}

/* =======================================================================
   6 and 7  TYPED: key words, and how many years
   ======================================================================= */
const norm = s => String(s || "").toLowerCase().replace(/[^a-z]/g, "");
function lev(a, b){
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function judgeWord(typed, word){
  const t = norm(typed), w = norm(word);
  if (!t) return "empty";
  if (t === w || t === w + "s") return "right";
  if (w.length >= 6 && lev(t, w) <= 1) return "close";
  return "wrong";
}
function drawTyped(st){
  const list = st.items, idx = R.typedIdx[st.id], it = list[idx], key = st.id + ":" + it.id;
  const tries = R.tries[key] || 0, settled = R.pts[key] !== undefined && (R.pts[key] > 0 || tries >= 2);
  const dots = list.map((x, k) => {
    const kk = st.id + ":" + x.id, f = R.first[kk];
    const cls = f === undefined ? "" : f > 0 ? "r" : R.pts[kk] > 0 ? "f" : "w";
    return `<button type="button" class="dot ${cls}" data-k="${k}" aria-current="${k === idx}" aria-label="Item ${k + 1}">${k + 1}</button>`;
  }).join("");
  const isWord = st.id === "words";
  const fb = R.msg[key] ? `<div class="fb ${R.msg[key][0]}">${R.msg[key][1]}</div>` : "";
  el("stage").innerHTML = `<div class="typed">
    <div class="dots">${dots}</div>
    ${isWord ? `<h2 class="task">Which word means this?</h2><p class="def">${esc(it.def)}</p>` : `<h2 class="task">${esc(it.q)}</h2>`}
    <label for="ans" class="sub">${isWord ? "The word" : "Years"}</label><br>
    <input id="ans" type="text" inputmode="${isWord ? "text" : "numeric"}" autocomplete="off" spellcheck="false" value="${esc(R.typed[key] || "")}" ${settled ? "disabled" : ""}>
    <div class="row">${settled ? "" : `<button type="button" class="btn go" id="chk">${tries ? "Try again" : "Check"}</button>`}
      ${settled && idx < list.length - 1 ? `<button type="button" class="btn go" id="nx">Next</button>` : ""}
      ${stageDone(st.id) ? nextStageBtn() : ""}</div>
    ${fb}</div>`;
  wireNext();
  el("stage").querySelectorAll(".dot").forEach(b => b.onclick = () => { R.typedIdx[st.id] = +b.dataset.k; drawRun(); });
  const nx = el("nx"); if (nx) nx.onclick = () => { R.typedIdx[st.id] = idx + 1; drawRun(); };
  const ans = el("ans");
  if (!settled){ ans.focus(); ans.addEventListener("keydown", e => { if (e.key === "Enter") el("chk").click(); }); }
  const chk = el("chk"); if (chk) chk.onclick = () => {
    const v = ans.value.trim(); if (!v) { ans.focus(); return; }
    R.typed[key] = v;
    const t = tries + 1; R.tries[key] = t;
    let ok, close = false;
    if (isWord){ const j = judgeWord(v, it.a); ok = j !== "wrong"; close = j === "close"; }
    else ok = parseInt(v.replace(/[^0-9-]/g, ""), 10) === it.a;
    award(key, ok, t);
    if (ok){
      R.msg[key] = ["ok", isWord ? `Yes: <b>${esc(it.a)}</b>.${close ? " Watch the spelling." : ""} ${esc(it.parts)}` : `Yes, ${it.a} years. ${esc(it.why)}`];
      if (t > 1) R.msg[key][0] = "mid";
    } else if (t === 1){
      const other = isWord ? WORDS.find(x => x.id !== it.id && judgeWord(v, x.a) !== "wrong") : null;
      R.msg[key] = ["no", isWord
        ? `Not ${esc(v)}.${other ? ` ${esc(other.a.charAt(0).toUpperCase() + other.a.slice(1))} means: ${esc(other.def.charAt(0).toLowerCase() + other.def.slice(1))}` : ""} Clue: ${esc(it.parts)} One more try.`
        : `Not ${esc(v)}. ${esc(it.hint)} One more try.`];
    } else {
      R.msg[key] = ["no", isWord ? `The word is <b>${esc(it.a)}</b>. ${esc(it.parts)}${lessonTag(it.go)}` : `It is <b>${it.a} years</b>. ${esc(it.why)}${lessonTag(it.go)}`];
    }
    if (list.every(x => { const kk = st.id + ":" + x.id; return R.pts[kk] > 0 || (R.tries[kk] || 0) >= 2; })) R.done[st.id] = true;
    drawRun(); maybeAllDone();
  };
}

/* =======================================================================
   REPORT: score, goals, lessons by priority, words to practise
   ======================================================================= */
function analysis(){
  const tried = ITEMS.filter(i => R.first[i.key] !== undefined);
  const lost = i => i.max - (R.pts[i.key] || 0);
  const missedFirst = tried.filter(i => R.first[i.key] < i.max / 2);
  // skills, by points lost
  const bySkill = {};
  tried.forEach(i => { (bySkill[i.skill] = bySkill[i.skill] || { lost:0, items:[] }); bySkill[i.skill].lost += lost(i); if (R.first[i.key] < i.max / 2) bySkill[i.skill].items.push(i); });
  const skills = Object.entries(bySkill).filter(([, v]) => v.lost > 0).sort((a, b) => b[1].lost - a[1].lost);
  // lessons, by points lost
  const byLesson = {};
  tried.forEach(i => { if (lost(i) > 0){ byLesson[i.go] = (byLesson[i.go] || 0) + lost(i); } });
  const lessons = Object.entries(byLesson).sort((a, b) => b[1] - a[1]);
  const untried = STAGES.filter(s => !ITEMS.some(i => i.stage === s.id && R.first[i.key] !== undefined));
  const words = WORDS.filter(w => R.first["words:" + w.id] !== undefined && R.first["words:" + w.id] < 10);
  return { tried, missedFirst, skills, lessons, untried, words };
}
function goalText(skill, info){
  const s = SKILLS[skill], it = info.items;
  if (skill === "tlB") return `${s.goal} ${it.map(i => `${esc(i.label)} (${esc(fmtY(i.year))})`).join("; ")}.`;
  if (skill === "ce") return `${s.goal} ${it.map(i => esc(i.label)).join(" ")}`;
  if (skill === "words") return `${s.goal} ${it.map(i => `<b>${esc(i.label)}</b>`).join(", ")}.`;
  return esc(s.goal);
}
function drawReport(){
  const A = analysis(), sc = score();
  const goalsHTML = A.skills.slice(0, 3).map(([k, v]) => {
    const links = [...new Set([...SKILLS[k].go, ...v.items.map(i => i.go)])];
    return `<li><span class="gh">${esc(SKILLS[k].name)}</span>${goalText(k, v)}<br><span class="sub">Go to: ${links.map(l => pageLink(l) + " · " + hubLink(hubOf(l), "words")).join("; ")}</span></li>`;
  }).join("");
  const prio = A.lessons.map(([go, pts]) => `<li>${pageLink(go)} · ${hubLink(hubOf(go), "words in the vocab hub")} <span class="sub">(${pts} points to win back)</span></li>`).join("");
  const words = A.words.map(w => `<div><b>${esc(w.a)}</b>: ${esc(w.def)}<br>${hubLink(hubOf(w.go), "Practise lesson " + hubOf(w.go) + " words")}</div>`).join("");
  el("vReport").innerHTML = `<div class="report">
    <div class="panel">
      <h2>Your report</h2>
      <div class="score"><span class="big">${sc} / ${MAX}</span><span>Time ${fmtT(R.time)}</span>
        <span>Right first time: ${A.tried.filter(i => R.first[i.key] >= i.max / 2).length} of ${A.tried.length} tried</span></div>
      ${S.best ? `<p class="sub">Your best on this device: ${S.best.score} / ${MAX} in ${fmtT(S.best.time)}.</p>` : ""}
      <h3 class="sec">Your revision goals</h3>
      ${goalsHTML ? `<ol class="goals">${goalsHTML}</ol>` : `<p>Nothing lost on what you tried. ${A.untried.length ? "Try the stages you skipped." : "Well inside the target: help someone else."}</p>`}
      <h3 class="sec">Lessons to go back to, most points first</h3>
      ${prio ? `<ol class="prio">${prio}</ol>` : `<p class="sub">None.</p>`}
      ${A.untried.length ? `<p class="sub">Not tried: ${A.untried.map(s => esc(s.name)).join(", ")}.</p>` : ""}
      <h3 class="sec">Your words</h3>
      ${words ? `<div class="words">${words}</div><div class="row"><button type="button" class="btn" id="practise">Practise these words</button></div><div id="pract"></div>` : `<p class="sub">No words missed${R.first["words:" + WORDS[0].id] === undefined ? " (the Words stage was not tried)" : ""}.</p>`}
      <div class="row"><button type="button" class="btn go" id="again">Start a new run</button></div>
      <details class="rep" style="margin-top:14px"><summary>Teacher report</summary>
        <label for="who">Name</label> <input id="who" type="text" autocomplete="off" style="width:min(320px,100%);font-size:16px">
        <div class="row"><button type="button" class="btn" id="copyRow">Copy my row</button><span id="copied" role="status"></span></div>
        <pre id="rowOut"></pre>
        <p>Score is the run as it ended. Right first time counts timeline events within half marks on the first check. Resets counts how many times the score went back to zero, because the student left full screen, the page or the window, before this run was finished. Ticked pages are the student's own say-so.</p>
      </details>
    </div></div>`;
  el("again").onclick = () => { R = newRun(); drawChallenge(); };
  el("who").value = S.name;
  el("rowOut").textContent = rowText();
  el("who").addEventListener("input", () => { S.name = el("who").value; S.last = rowText(); save(); el("rowOut").textContent = S.last; });
  el("copyRow").onclick = async () => {
    try { await navigator.clipboard.writeText(rowText()); el("copied").textContent = "Copied."; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(el("rowOut")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); el("copied").textContent = "Press Ctrl+C."; }
  };
  const pr = el("practise"); if (pr) pr.onclick = () => practise(A.words);
}

/* The personal word list: the missed words again, untimed and unscored,
   until each one has been typed right once. */
function practise(list){
  let queue = list.slice(), cur = null;
  const box = el("pract");
  const next = () => {
    if (!queue.length){ box.innerHTML = `<div class="fb ok">All typed right. Go to the vocab hub lessons above to keep them.</div>`; return; }
    cur = queue.shift();
    box.innerHTML = `<div class="typed" style="margin-top:10px"><p class="def">${esc(cur.def)}</p>
      <input id="pans" type="text" autocomplete="off" spellcheck="false"> <button type="button" class="btn go" id="pchk">Check</button><div id="pfb"></div></div>`;
    const inp = el("pans"); inp.focus();
    const go = () => {
      const j = judgeWord(inp.value, cur.a); if (j === "empty") return;
      if (j === "wrong"){ queue.push(cur); el("pfb").innerHTML = `<div class="fb no">It is <b>${esc(cur.a)}</b>. ${esc(cur.parts)} It will come round again.</div>`; }
      else el("pfb").innerHTML = `<div class="fb ok">Yes: <b>${esc(cur.a)}</b>.</div>`;
      inp.disabled = true; el("pchk").textContent = "Next"; el("pchk").onclick = next; el("pchk").focus();
    };
    el("pchk").onclick = go; inp.addEventListener("keydown", e => { if (e.key === "Enter" && !inp.disabled) go(); });
  };
  next();
}

function rowText(){
  const A = analysis();
  const clean = s => String(s || "").replace(/[\t\r\n]+/g, " ").trim();
  return [clean(S.name), today(), `${score()} of ${MAX}`, fmtT(R.time || 0),
    `${A.tried.filter(i => R.first[i.key] >= i.max / 2).length} of ${A.tried.length} right first time`,
    A.skills[0] ? SKILLS[A.skills[0][0]].name : "none",
    A.lessons.map(([go]) => lessonName(go)).join("; ") || "none",
    A.words.map(w => w.a).join(", ") || "none",
    `${R.status === "done" ? (R.resets || 0) : (S.resets || 0)} resets`,
    `${ALL_PAGES.filter(k => S.done[k]).length} of ${ALL_PAGES.length} pages ticked`].join("\t");
}

drawTopics();
showTab(location.hash === "#challenge" ? "chal" : (S.tab === "chal" ? "chal" : "catch"));
</script>
