<html lang="en-AU">

<title>The three ways: stop and jot</title>
<!--
  Ancient China lesson 2.4, The three ways: the accessible online stop and jot. The paper
  sheet's three stops and its bonus error hunt, word for word (lesson-2-4-build/build24.js in the
  private repository), with sentence stems and model answers. The expert readings and the
  recording sheet stay on paper. Nothing on this page judges the writing: the student marks
  against the model, and the teacher marks.

  Supports (Big buttons, Read to me, Voice typing, zoom, background colours) and the full-screen
  lock with no password are the accessible Cai Lun page's, copied from history/cai-lun/accessible.html.
  If that machinery is patched, patch this file in the same change. Built by
  scratchpad/tools/build_threeways_access.js. Saved on this device as it is typed (three24.access.v1).
-->
<style>
  :root{
    --bg:#f6f1e7; --paper:#fffdf8; --ink:#1f2a2e; --muted:#5b6669; --line:#d9cfbd;
    --sel:#1d3b4a; --selbg:#dce9ee; --yes:#1f6b3a; --focus:#2c7488; --gold:#8a6d1e;
    --src:#1f5fa8; --sig:#9b2f22;
    --tap:48px; --tap2:44px; --gap:10px; --qf:20px; --tf:20px;
  }
  body.bigui{--tap:64px; --tap2:56px; --gap:16px; --qf:22px; --tf:22px}
  body.bigui .top .t{display:none}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:20px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.01em;word-spacing:.06em;
       display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
  button,input,textarea{font:inherit;color:inherit}
  :focus-visible{outline:4px solid var(--focus);outline-offset:3px}
  [hidden]{display:none!important}
  .top{background:var(--sel);color:#fbf7ee;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .top .t{font:700 20px/1.2 Georgia,serif;margin-right:8px}
  .strip{display:flex;gap:8px;flex-wrap:wrap}
  .strip button{min-width:var(--tap2);min-height:var(--tap2);border:3px solid rgba(251,247,238,.4);border-radius:12px;background:transparent;color:#fbf7ee;font-weight:800;font-size:16px;cursor:pointer;padding:2px 10px}
  .strip button[aria-current="true"]{background:#fbf7ee;color:var(--sel);border-color:#fbf7ee}
  .strip button.ok::after{content:" ✓"}
  main{overflow:auto;padding:16px}
  .wrap{max-width:1150px;margin:0 auto;zoom:var(--z,1)}
  .task{font:700 15px/1.2 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
  h1{font:700 30px/1.25 Georgia,serif;margin:0 0 10px}
  h2{font:700 25px/1.3 Georgia,serif;margin:0 0 10px}
  h3{font-size:19px;margin:0 0 8px}
  .card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px 20px}
  .row{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:center}
  .big{min-height:var(--tap);padding:6px 18px;border:3px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;font-weight:700;touch-action:manipulation;text-align:left}
  .big[aria-pressed="true"]{border-color:var(--sel);background:var(--selbg)}
  .big[aria-pressed="true"]::after{content:" ✓"}
  .say{min-width:var(--tap);min-height:var(--tap);border:3px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;font-size:calc(var(--tap) * .4);touch-action:manipulation;flex:none}
  .q{display:flex;gap:var(--gap);align-items:flex-start;margin:0 0 14px}
  .q p{margin:0;font-size:var(--qf);font-weight:700;flex:1}
  .note{color:var(--muted);font-size:17px;margin:8px 0 0}
  textarea{width:100%;min-height:220px;font-size:var(--tf);line-height:1.5;padding:14px 16px;border:3px solid var(--line);border-radius:16px;background:#fff;resize:vertical}
  input[type=text]{min-height:var(--tap);font-size:var(--tf);padding:10px 14px;border:3px solid var(--line);border-radius:16px;background:#fff;width:min(460px,100%)}
  .stems{display:flex;flex-wrap:wrap;gap:var(--gap);margin:14px 0 0}
  .stems .big{font-weight:600;background:#fbf8f1}
  .stems .lab{width:100%;font-size:16px;color:var(--muted);margin:0 0 -6px}
  .bottom{background:var(--paper);border-top:2px solid var(--line);padding:10px 16px;display:flex;gap:var(--gap);justify-content:space-between;align-items:center}
  .bottom .big{min-width:calc(var(--tap) * 2.8);text-align:center}
  .bottom .go{background:var(--sel);border-color:var(--sel);color:#fff}
  .zoom{display:flex;gap:12px;align-items:center}
  .zoom .big{min-width:calc(var(--tap) * 1.3);text-align:center;font-size:calc(var(--tap) * .4);padding:4px 14px;line-height:1}
  .zoom output{min-width:5.5em;text-align:center;font-weight:700;font-size:17px;color:var(--muted)}

  /* two columns: a source beside its words; one column when zoomed in or narrow */
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  body.zbig .two{grid-template-columns:1fr}
  .src{width:100%;border:2px solid var(--line);border-radius:12px;background:#fff;display:block}
  .src.tall{max-height:70vh;width:auto;max-width:100%;margin:0 auto}
  .cap{font-size:16px;color:var(--muted);margin:6px 0 0}
  .facts{margin:0;padding:0;list-style:none;display:grid;gap:10px}
  .facts li{display:flex;gap:10px;align-items:flex-start}
  .facts li .rd{flex:1}
  .facts b{display:block}
  dl.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
  body.zbig dl.words{grid-template-columns:1fr}
  dl.words div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
  dl.words dt{font-weight:800} dl.words dd{margin:0} dl.words .rd{flex:1}

  /* the three marks, the same as the paper legend */
  .m-origin{color:var(--src);text-decoration:underline solid var(--src);text-decoration-thickness:2px;text-underline-offset:.2em}
  .m-significance{color:var(--sig);text-decoration:underline double var(--sig);text-decoration-thickness:2px;text-underline-offset:.2em}
  .m-link{font-weight:800;outline:2px solid var(--ink);outline-offset:1px;border-radius:3px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:17px;margin:0 0 12px}
  .ladder{font-size:var(--qf);line-height:1.9}
  .newbar{background:#8a6d1e;color:#fff;border-radius:12px;padding:8px 14px;margin:0 0 12px;font-weight:700}
  .newbar span{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}

  /* the moves beside the writing box */
  .moves{margin:0;padding-left:1.4em} .moves li{margin:0 0 8px}

  /* marking my paragraph: every word is a button */
  .pens{display:flex;gap:var(--gap);flex-wrap:wrap;margin:0 0 12px}
  .pens .big{min-width:150px}
  .para{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;line-height:2.3;font-size:var(--tf)}
  .para button{border:2px solid transparent;background:none;padding:0 3px;margin:0 1px;border-radius:6px;cursor:pointer;font:inherit;min-height:var(--tap2)}
  .para button.anchor{background:#ffe9a8;border-color:var(--gold)}
  .para button.m-link{outline-offset:-1px}
  .tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 0}
  .tally div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:18px}
  .tally b{font-size:26px;display:block}
  .rule{border-left:6px solid var(--sig);background:#fbeeea;padding:10px 14px;border-radius:8px;margin:14px 0 0;font-weight:700}
  .rule.okay{border-color:var(--yes);background:#e8f3eb}

  /* choosing my level: one row of the rubric at a time, bands as buttons */
  .bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
  body.zbig .bands{grid-template-columns:1fr 1fr}
  body.zhuge .bands{grid-template-columns:1fr}
  .bands .big{font-weight:500;font-size:16px;line-height:1.4;padding:10px 12px;align-self:stretch}
  .bands .big b{display:block;font-size:18px;margin:0 0 4px}

  .check li{margin:6px 0}
  .missing{color:#9b2c1f;font-weight:700}
  .done{color:var(--yes);font-weight:700}
  #print{display:none}
  /* the lock: covers everything until the student goes back to full screen */
  #lock{position:fixed;inset:0;z-index:50;background:var(--sel);color:#fbf7ee;display:grid;place-items:center;padding:24px;text-align:center}
  #lock h2{font-size:34px;margin:0 0 12px} #lock p{font-size:20px;max-width:34em;margin:0 auto 18px}
  #lock .big{background:#fbf7ee;color:var(--sel);border-color:#fbf7ee;min-height:72px;font-size:24px;padding:10px 28px;text-align:center}
  @media screen and (max-width:860px){ .two,.bands,dl.words,.tally{grid-template-columns:1fr} }
  .w.now{background:#ffd54a;color:#1f2a2e;border-radius:4px;box-shadow:0 0 0 2px #ffd54a}
  .mic[aria-pressed="true"]{background:#9b2c1f;border-color:#9b2c1f;color:#fff}
  .heard{width:100%;min-height:1.6em;margin:0;font-size:18px;color:var(--muted)}
  body.tint-blue{--bg:#e3ebf2;--paper:#f3f7fa}
  body.tint-yellow{--bg:#f4ecc2;--paper:#fffbe3}
  body.tint-white{--bg:#ffffff;--paper:#ffffff}
  .looks{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
  .looks .lbl{font-weight:800;min-width:9em}
  .looks .big{min-width:110px;text-align:center}
  .looks .sup{min-height:64px;min-width:210px;font-size:20px}
  body.noread .say,body.noread #readPage,body.noread [data-sayans],body.noread [data-readel]{display:none!important}
  body.nomic .mic,body.nomic .heard{display:none!important}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
  @media print{
    @page{size:A4 portrait;margin:14mm}
    body{display:block;background:#fff;font-size:11pt;overflow:visible}
    .top,main,.bottom{display:none!important}
    #print{display:block}
    #print h1{font-size:18pt;margin:0 0 4pt} #print h2{font-size:13pt;margin:12pt 0 4pt}
    #print p{margin:3pt 0}
    #print table{width:100%;border-collapse:collapse;margin:4pt 0}
    #print th,#print td{border:1px solid #555;padding:4pt;vertical-align:top;text-align:left;font-size:9.5pt}
    #print .ans{border:1px solid #999;padding:6pt;line-height:1.9;white-space:pre-wrap}
    #print .m-link{outline:none;border:1.5px solid #000;padding:0 2px}
    #print .picked{background:#e6e6e6;font-weight:700}
  }

  .vid{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000;display:block}
  .qa{border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 16px;background:#fff}
  .qa .marks{font-size:15px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
  .key{border-left:6px solid var(--yes);background:#e8f3eb;border-radius:8px;padding:10px 14px;margin:12px 0 0;white-space:pre-line}
  .selfm{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:center;margin:10px 0 0}
  textarea.short{min-height:110px}
  .tot{font-weight:800;font-size:22px}
  /* phone width: the shared template's header and bottom bar were sized by their widest row, so the
     page scrolled sideways (547px on a 375px phone). Let the rows wrap instead. */
  body{grid-template-columns:minmax(0,1fr)!important}
  header.top{width:100%;max-width:100%}
  header.top>.strip{flex:0 0 100%;max-width:100%;min-width:0;width:100%}
  .bottom{flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <span class="t">The three ways</span>
  <nav class="strip" id="strip" aria-label="Pages"></nav>
</header>
<main><div class="wrap" id="screen" aria-live="polite"></div></main>
<footer class="bottom">
  <button type="button" class="big" id="back">← Back</button>
  <button type="button" class="big" id="readPage" aria-pressed="false">🔊 Read this page</button>
  <div class="zoom" role="group" aria-label="Zoom">
    <button type="button" class="big" id="zOut" aria-label="Zoom out">A−</button>
    <output id="zLvl" aria-live="polite">Zoom 100%</output>
    <button type="button" class="big" id="zIn" aria-label="Zoom in">A+</button>
  </div>
  <button type="button" class="big go" id="next">Next →</button>
</footer>
<div id="print"></div>
<div id="lock" hidden role="alertdialog" aria-modal="true" aria-labelledby="lockH">
  <div><h2 id="lockH">You left full screen</h2>
  <p>Your work is saved. Leaving full screen is written in your lesson log, and your teacher sees it when you hand in.</p>
  <button type="button" class="big" id="lockBack">Back to full screen</button></div>
</div>

<script>
/* ======================================================================= */
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const cap1 = t => t[0].toUpperCase() + t.slice(1);
const KEY = "three24.access.v1";
const VIDEO = "87jRYTOONRw";
/* The paper sheet's stops, word for word (lesson-2-4-build/build24.js in the private repository).
   m = marks; "fact" is a key detail, "link" is levelled: 1 names it, 2 links it. The stems are
   sentence starters only; the model answer appears after the student checks their own. */
const STOPS = [
 { n:1, from:"0:33", at:"1:30", title:"Taoism (Daoism)", qs:[
  { id:"1a", kind:"fact", m:1, min:4, q:"What did Taoists believe about nature?", stems:["Taoists believed that people should ", "A universal force "],
    a:"People should be one with nature (1); or: a universal force flows through all living things. [0:50]" },
  { id:"1b", kind:"link", m:2, min:8, q:"How were Taoists different from the followers of Confucius?", stems:["Taoists did not believe in ", "The followers of Confucius wanted ", "This is different because "],
    a:"1 mark: Taoists did not believe in a lot of rules or government.\n2 marks: sets it against Confucius's followers, who wanted a strong, organised government. [1:00, 2:14]" },
  { id:"1c", kind:"fact", m:2, min:4, q:"Yin and yang are pairs of opposite forces. Give two of the video's pairs.", stems:["One pair is ", "Another pair is "],
    a:"Any two of dark and light, cold and hot, male and female (1 each). [1:19]" } ] },
 { n:2, from:"1:33", at:"3:11", title:"Confucianism", qs:[
  { id:"2a", kind:"fact", m:1, min:3, q:"Who wrote down Confucius's teachings?", stems:["His ", "They were written down by "],
    a:"His followers (he did not write them himself). [1:50]" },
  { id:"2b", kind:"fact", m:2, min:4, q:"Name two things Confucius said were important.", stems:["One thing was ", "Another thing was "],
    a:"Any two of respect, politeness, fairness, honour, morality, family (1 each). [1:55 to 2:14]" },
  { id:"2c", kind:"fact", m:1, min:3, q:"Family mattered to Confucius. What did he say people had to do?", stems:["People had to ", "Children had to "],
    a:"Honour their relatives. [2:11]" } ] },
 { n:3, from:"3:16", at:"4:09", title:"Buddhism", qs:[
  { id:"3a", kind:"fact", m:1, min:3, q:"Where and when does the video say the Buddha was born?", stems:["The video says he was born in ", "The year was "],
    a:"Nepal, 563 BC. [3:25]" },
  { id:"3b", kind:"link", m:2, min:8, q:"What is karma?", stems:["Karma means ", "So good actions will ", "And bad actions will "],
    a:"1 mark: all actions have consequences.\n2 marks: links it: good actions will help you later and bad ones will hurt you. [3:54 to 4:09]" },
  { id:"3c", kind:"fact", m:1, min:3, q:"What does the video say happens when the cycle of rebirth is complete?", stems:["The video says the person ", "When the cycle ends, "],
    a:"The person enters nirvana. [3:46]" } ] }];
/* The bonus: the video gets something wrong about each way. Students check it against their group's reading.
   No model answer on this page: the reading decides. */
const ERRORS = [
 { id:"e1", n:1, t:"Taoism (Daoism)", m:1, min:8, claim:"Taoism was founded in the sixth century by Laozi, who wrote the Tao Te Ching (0:36). The idea of yin and yang comes from Taoism (1:08).", stems:["The reading says ", "The video is wrong because "] },
 { id:"e2", n:2, t:"Confucianism", m:1, min:8, claim:"The video quotes Confucius with sayings such as 'Forget injuries, never forget kindnesses' (2:28 to 3:06).", stems:["The reading says ", "The video is wrong because "] },
 { id:"e3", n:3, t:"Buddhism", m:1, min:8, claim:"Buddhists believe in a rebirth of the self, and the person's soul enters nirvana (3:38 to 3:50). Buddhism spread through India and China (3:34), with no date.", stems:["The reading says ", "The video is wrong because "] }];
const ALLQ = STOPS.flatMap(st => st.qs);
const JOTTED = ALLQ.reduce((n, q) => n + q.m, 0);
const BONUS = ERRORS.reduce((n, e) => n + e.m, 0);
const TOTAL = JOTTED + BONUS;
const WORDS_HINT = "Tip: if a word is new, open the vocab hub for 2.4 first.";

let A = { name:"", txt:{}, chk:{}, mk:{}, step:0, zoom:1, rate:.9, tint:"cream",
          sup:{ big:false, read:false, mic:false }, used:{}, started:0, secs:0, log:[] };
try { const x = JSON.parse(localStorage.getItem(KEY)); if (x) A = Object.assign(A, x); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(A)); } catch (e) {} }
if (!A.started) { A.started = Date.now(); save(); }
setInterval(() => { if (document.visibilityState === "visible" && A.step > 0) { A.secs += 15; save(); } }, 15000);
let lastTap = 0;
function steady(){ const n = Date.now(); if (n - lastTap < 400) return false; lastTap = n; return true; }
const wc = t => (t || "").trim() ? t.trim().split(/\s+/).length : 0;

/* ---------- read to me (as in the accessible CAT) ---------- */
const TTS = "speechSynthesis" in window;
let voice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices().filter(x => /^en/i.test(x.lang));
  const rank = x => (x.lang === "en-AU" ? 0 : /en-(GB|NZ)/.test(x.lang) ? 1 : 2) + (x.localService ? 0 : 3);
  voice = v.sort((a, b) => rank(a) - rank(b))[0] || null;
}
if (TTS) { pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); }
function utter(text){ const u = new SpeechSynthesisUtterance(text); u.lang = voice ? voice.lang : "en-AU"; if (voice) u.voice = voice; u.rate = A.rate || .9; return u; }
let reading = null;
function setReadUI(){ const b = $("readPage"); if (!b) return; b.hidden = !TTS; b.setAttribute("aria-pressed", !!reading); b.textContent = reading ? "■ Stop reading" : "🔊 Read this page"; }
function stopReading(){ if (!TTS) return; const r = reading; reading = null; if (r && r.el) r.el.innerHTML = r.orig; speechSynthesis.cancel(); setReadUI(); }
function speak(t){ if (!TTS) return; stopReading(); speechSynthesis.speak(utter(t)); }
function readEls(els){
  if (!TTS) return;
  stopReading();
  const r = reading = { queue: els.filter(e => e && e.textContent.trim()), el: null, orig: "" };
  setReadUI();
  const next = () => {
    if (reading !== r) return;
    if (r.el) { r.el.innerHTML = r.orig; r.el = null; }
    const el = r.queue.shift();
    if (!el) { reading = null; setReadUI(); return; }
    const text = el.textContent.replace(/\s+/g, " ").trim(), spans = [];
    text.replace(/\S+/g, (w, i) => { spans.push([i, i + w.length]); return w; });
    r.el = el; r.orig = el.innerHTML;
    el.innerHTML = spans.map(([a, b]) => `<span class="w">${esc(text.slice(a, b))}</span>`).join(" ");
    const ws = el.querySelectorAll(".w"), u = utter(text);
    u.onboundary = e => {
      if (reading !== r || e.name === "sentence") return;
      const k = spans.findIndex(([a, b]) => e.charIndex >= a && e.charIndex < b);
      ws.forEach((w, j) => w.classList.toggle("now", j === k));
      if (k >= 0) ws[k].scrollIntoView({ block:"nearest" });
    };
    u.onend = u.onerror = () => setTimeout(next, 150);
    speechSynthesis.speak(u);
  };
  next();
}
const readPageEls = () => [...$("screen").querySelectorAll(".q p, .rd")];
const readBtn = label => TTS ? `<button type="button" class="say" data-readel="1" aria-label="${esc(label)}">🔊</button>` : "";
/* The marked paragraph is read without its marks: the lit word replaces them while it reads,
   and they come back when it stops. */

/* ---------- voice typing (as in the accessible CAT) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recKey = null, sttLang = null;
(async () => { try { if (SR && SR.available) for (const l of ["en-AU", "en-GB", "en-US"])
  if (await SR.available({ langs:[l], processLocally:true }) === "available") { sttLang = l; break; } } catch (e) {} })();
const micBtn = key => SR ? `<button type="button" class="big mic" data-mic="${key}" aria-pressed="false">🎤 Speak</button><p class="heard" id="heard_${key}" aria-live="polite"></p>` : "";
let micStream = null, micMsg = "";
const liveTrack = () => micStream && micStream.getAudioTracks().find(t => t.readyState === "live");
function micNote(t){ micMsg = t; const n = $("micNote"); if (n) n.textContent = t; }
async function openMic(){
  if (liveTrack()) { micNote("Microphone on. It only listens when you tap Speak."); return; }
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { micNote("This browser cannot use the microphone."); return; }
  micNote("If the browser asks to use the microphone, choose Allow.");
  try { micStream = await navigator.mediaDevices.getUserMedia({ audio:true }); micNote("Microphone on. It only listens when you tap Speak."); }
  catch (e) { micStream = null; micNote(e.name === "NotFoundError" ? "No microphone found on this device." : "The microphone is blocked. Ask your teacher."); }
}
function closeMic(){ if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null; micMsg = ""; }
function heard(key, t){ const h = document.getElementById("heard_" + key); if (h) h.textContent = t; }
function setMicUI(){ document.querySelectorAll("[data-mic]").forEach(b => { const on = b.dataset.mic === recKey; b.setAttribute("aria-pressed", on); b.textContent = on ? "■ Stop" : "🎤 Speak"; }); }
function stopMic(){ const r = rec; rec = null; recKey = null; if (r) { try { r.stop(); } catch (e) {} } setMicUI(); }
function putSaid(key, said){
  said = (said || "").trim(); if (!said) return;
  const ta = document.querySelector(`textarea[data-key="${key}"]`);
  const cur = ta ? ta.value : (A.txt[key] || "");
  const before = ta ? cur.slice(0, ta.selectionStart ?? cur.length) : cur;
  const text = (!before.trim() || /[.!?]\s*$/.test(before) ? cap1(said) : said) + " ";
  if (ta) return caretInsert(key, text);
  undo[key] = undo[key] || []; undo[key].push(cur);
  A.txt[key] = cur + (cur && !/\s$/.test(cur) ? " " : "") + text; save(); drawStrip();
}
function startMic(key){
  stopMic(); stopReading();
  const r = rec = new SR(); recKey = key;
  r.lang = sttLang || "en-AU"; r.continuous = true; r.interimResults = true;
  if (sttLang) r.processLocally = true;
  r.onresult = e => {
    if (r.closed) return;
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) putSaid(key, res[0].transcript); else interim += " " + res[0].transcript.trim();
    }
    r.pending = interim.trim();
    heard(key, r.pending ? "Hearing: " + r.pending : rec === r ? "Listening." : "");
  };
  r.onerror = e => {
    if (e.error === "aborted") return;
    r.err = true;
    heard(key, e.error === "network" ? "Voice typing needs the internet on this device. Ask your teacher."
             : e.error === "not-allowed" || e.error === "service-not-allowed" ? "The microphone is blocked. Ask your teacher."
             : e.error === "no-speech" ? "Nothing heard. Tap Speak and try again." : "Voice typing stopped. Tap Speak to start again.");
  };
  r.onend = () => {
    r.closed = true;
    if (r.pending) { putSaid(key, r.pending); r.pending = ""; }
    if (rec === r) { rec = null; recKey = null; setMicUI(); }
    if (!r.err) heard(key, "");
  };
  const track = liveTrack();
  let started = false;
  if (track) { try { r.start(track); started = true; } catch (e) {} }
  if (!started) { try { r.start(); started = true; } catch (e) {} }
  if (started) heard(key, "Listening."); else { rec = null; recKey = null; heard(key, "Voice typing did not start."); }
  setMicUI();
}



/* ---------- the pages ---------- */
const STEPS = [{ id:"start", label:"Start" }]
  .concat(STOPS.map(st => ({ id:"stop", n:st.n, label:"Stop " + st.n })))
  .concat([{ id:"errors", label:"Bonus: find the errors" }, { id:"hand", label:"Hand in" }]);
const jotDone = () => ALLQ.filter(q => A.chk[q.id]).length;
function stepDone(s){
  if (s.id === "stop") return STOPS[s.n - 1].qs.every(q => A.chk[q.id]);
  if (s.id === "errors") return ERRORS.every(e => wc(A.txt[e.id]) >= e.min);
  return false;
}
function drawStrip(){
  $("strip").innerHTML = STEPS.map((s, i) => '<button type="button" data-step="' + i + '" class="' + (stepDone(s) ? "ok" : "") + '"' + (i === A.step ? ' aria-current="true"' : "") + ">" + esc(s.label) + "</button>").join("");
  $("strip").querySelectorAll("button").forEach(b => b.onclick = () => { if (steady()) go(+b.dataset.step); });
}
function go(k){ A.step = Math.max(0, Math.min(STEPS.length - 1, k)); if (A.step !== 0) armLock(); save(); render(); $("screen").parentElement.scrollTop = 0; }
/* ---------- the full-screen lock (no password) ---------- */
const FS = !!(document.documentElement.requestFullscreen && document.fullscreenEnabled !== false);
let graceUntil = 0;          // printing leaves full screen; that is not counted
function logIt(what){ A.log = A.log || []; A.log.push({ t:Date.now(), what }); save(); }
function armLock(){ if (FS && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); }
function showLock(what){
  if (A.step === 0 || !$("lock").hidden) return;
  stopReading(); stopMic();
  if (Date.now() > graceUntil) logIt(what);
  $("lockH").textContent = what === "Left the page" ? "You left the page" : what === "Left the window" ? "You switched away" : "You left full screen";
  $("lock").hidden = false; $("lockBack").focus();
}
$("lockBack").onclick = () => {
  const done = () => { $("lock").hidden = true; };
  if (FS) document.documentElement.requestFullscreen().then(done, done); else done();
};
document.addEventListener("fullscreenchange", () => { if (FS && !document.fullscreenElement) showLock("Left full screen"); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") showLock("Left the page"); });
/* Alt+Tab leaves the page visible and in full screen, so watch focus as well. A click
   into the video or the vocab hub also blurs the window, but document.hasFocus() stays
   true; and once focus is inside a frame the page gets no second blur, so check each second. */
window.addEventListener("blur", () => setTimeout(() => { if (!document.hasFocus() && Date.now() > graceUntil) showLock("Left the window"); }, 200));
setInterval(() => { if (document.visibilityState === "visible" && !document.hasFocus() && Date.now() > graceUntil) showLock("Left the window"); }, 1000);
const exits = () => (A.log || []).length;
const logLines = () => (A.log || []).map(x => new Date(x.t).toLocaleString("en-AU", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }) + ": " + x.what);

$("back").onclick = () => { if (steady()) go(A.step - 1); };
$("next").onclick = () => { if (steady()) go(A.step + 1); };

const ZOOMS = [0.8, 0.9, 1, 1.15, 1.3, 1.5, 1.75, 2];
function setZoom(z){
  A.zoom = ZOOMS.includes(z) ? z : 1;
  if (A.zoom > 1) A.used.zoom = Math.max(A.used.zoom || 1, A.zoom);
  document.documentElement.style.setProperty("--z", A.zoom);
  document.body.classList.toggle("zbig", A.zoom >= 1.5);
  document.body.classList.toggle("zhuge", A.zoom >= 1.75);
  $("zLvl").textContent = "Zoom " + Math.round(A.zoom * 100) + "%";
  $("zOut").disabled = A.zoom === ZOOMS[0];
  $("zIn").disabled = A.zoom === ZOOMS[ZOOMS.length - 1];
  save();
}
$("zIn").onclick = () => { if (steady()) setZoom(ZOOMS[Math.min(ZOOMS.length - 1, ZOOMS.indexOf(A.zoom) + 1)]); };
$("zOut").onclick = () => { if (steady()) setZoom(ZOOMS[Math.max(0, ZOOMS.indexOf(A.zoom) - 1)]); };


function render(){
  stopReading(); stopMic();
  drawStrip();
  const s = STEPS[A.step];
  $("back").disabled = A.step === 0;
  $("next").hidden = A.step === STEPS.length - 1;
  $("screen").innerHTML = { start:startScreen, stop:() => stopScreen(STOPS[s.n - 1]), errors:errorsScreen, hand:handScreen }[s.id]();
  wire();
}

const TINTS = ["cream", "blue", "yellow", "white"];
const SUPPORT_NAMES = { big:"Big buttons", read:"Read to me", mic:"Voice typing" };
function applySupports(){
  document.body.classList.toggle("bigui", !!A.sup.big);
  document.body.classList.toggle("noread", !A.sup.read || !TTS);

function supportsUsed(){
  const L = Object.keys(SUPPORT_NAMES).filter(k => A.used[k]).map(k => SUPPORT_NAMES[k]);
  if (A.used.zoom > 1) L.push("Zoom up to " + Math.round(A.used.zoom * 100) + "%");
  return L.length ? L.join(", ") : "none";
}

const undo = {};
function caretInsert(key, text){
  const ta = document.querySelector(`textarea[data-key="${key}"]`); if (!ta) return;
  undo[key] = undo[key] || []; undo[key].push(ta.value);
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? ta.value.length;
  const before = ta.value.slice(0, s), after = ta.value.slice(e);
  const pad = before && !/\s$/.test(before) && !/^\s/.test(text) ? " " : "";
  ta.value = before + pad + text + after;
  const at = (before + pad + text).length;
  ta.focus(); ta.setSelectionRange(at, at);
  A.txt[key] = ta.value; save(); drawStrip();
}

function noteFor(key){
  const q = [...ALLQ, ...ERRORS].find(x => x.id === key);
  if (q){
    const ok = wc(A.txt[key]) >= q.min, b = document.querySelector('[data-check="' + key + '"]'), n = $("cn_" + key);
    if (b) b.disabled = !ok;
    if (n) n.textContent = ok ? "" : needNote(q);
  }
}
function wire(){
  const S = $("screen");
  const nm = $("nm"); if (nm) nm.addEventListener("input", () => { A.name = nm.value; save(); });
  S.querySelectorAll("textarea[data-key]").forEach(ta => ta.addEventListener("input", () => { A.txt[ta.dataset.key] = ta.value; save(); noteFor(ta.dataset.key); drawStrip(); }));
  S.querySelectorAll("[data-readel]").forEach(b => b.onclick = () => readEls([b.parentElement.querySelector(".rd, p")]));
  S.querySelectorAll("[data-sayans]").forEach(b => b.onclick = () => speak(A.txt[b.dataset.sayans] || "Nothing written yet."));
  S.querySelectorAll("[data-mic]").forEach(b => {
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.onclick = () => { if (!steady()) return; if (recKey === b.dataset.mic) stopMic(); else startMic(b.dataset.mic); };
  });
  S.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => { if (!steady()) return; A.rate = +b.dataset.rate; save(); render(); speak("This is the reading speed."); });
  S.querySelectorAll("[data-sup]").forEach(b => b.onclick = () => {
    if (!steady()) return;
    const k = b.dataset.sup; A.sup[k] = !A.sup[k]; if (A.sup[k]) A.used[k] = true;
    save(); applySupports(); render();
    if (k === "mic" && A.sup.mic) openMic();
  });
  S.querySelectorAll("[data-tint]").forEach(b => b.onclick = () => { if (!steady()) return; A.tint = b.dataset.tint; save(); applyTint(); render(); });
  S.querySelectorAll("[data-stem]").forEach(b => b.addEventListener("pointerdown", e => e.preventDefault()));
  S.querySelectorAll("[data-stem]").forEach(b => b.onclick = () => { if (!steady()) return; const q = [...ALLQ, ...ERRORS].find(x => x.id === b.dataset.stem); caretInsert(q.id, q.stems[+b.dataset.k]); });
  S.querySelectorAll("[data-undo]").forEach(b => {
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.onclick = () => {
      if (!steady()) return;
      const key = b.dataset.undo, ta = document.querySelector('textarea[data-key="' + key + '"]');
      if (!ta || !undo[key] || !undo[key].length) return;
      ta.value = undo[key].pop(); A.txt[key] = ta.value; save(); noteFor(key); drawStrip(); ta.focus();
    };
  });
  /* checking an answer opens the model in place, with no re-render, so the video keeps its place */
  S.querySelectorAll("[data-check]").forEach(b => b.onclick = () => { if (!steady()) return; A.chk[b.dataset.check] = true; save(); const k = $("k_" + b.dataset.check); if (k) k.hidden = false; drawStrip(); });
  S.querySelectorAll("[data-mk]").forEach(b => b.onclick = () => {
    if (!steady()) return; const id = b.dataset.mk; A.mk[id] = +b.dataset.v; save();
    S.querySelectorAll('[data-mk="' + id + '"]').forEach(x => x.setAttribute("aria-pressed", +x.dataset.v === A.mk[id]));
  });
  const pr = $("printBtn"); if (pr) pr.onclick = () => { graceUntil = Date.now() + 120000; buildPrint(); window.print(); graceUntil = Date.now() + 3000; };
  const copy = async t => { try { await navigator.clipboard.writeText(t); $("copied").textContent = "Copied."; } catch (e) { $("copied").textContent = "Copy did not work here. Use Print instead."; } };
  const cp = $("copyBtn"); if (cp) cp.onclick = () => copy(plainText());
  const rw = $("rowBtn"); if (rw) rw.onclick = () => copy(classRow());
}

/* One tab-separated row for a shared sheet. Columns: name, date, minutes on the page, my marks for each
   of the 9 stop-and-jot questions, their total, my marks for each of the 3 bonus errors, their total,
   times out of full screen. It cannot tell you whether any of it is good. */
function classRow(){
  const clean = t => String(t || "").replace(/[\t\r\n]+/g, " ").trim();
  const jot = ALLQ.reduce((n, q) => n + (A.mk[q.id] || 0), 0), bon = ERRORS.reduce((n, e) => n + (A.mk[e.id] || 0), 0);
  return [clean(A.name), new Date().toLocaleDateString("en-AU"), mins()].concat(ALLQ.map(q => A.mk[q.id] === undefined ? "" : A.mk[q.id]))
    .concat([jot]).concat(ERRORS.map(e => A.mk[e.id] === undefined ? "" : A.mk[e.id])).concat([bon])
    .concat([FS ? exits() : "no lock"]).join("\t");
}

$("readPage").onclick = () => { if (!steady()) return; if (reading) stopReading(); else readEls(readPageEls()); };
A.sup = Object.assign({ big:false, read:false, mic:false }, A.sup); A.used = A.used || {}; A.chk = A.chk || {}; A.mk = A.mk || {};
setZoom(A.zoom); applyTint(); applySupports(); setReadUI();
render();
if (A.sup.mic && SR) openMic();
if (A.step !== 0 && FS && !document.fullscreenElement) { $("lockH").textContent = "Back to the lesson"; $("lock").hidden = false; }
</script>
