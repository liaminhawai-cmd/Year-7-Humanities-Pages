  Ancient China lesson 2.1, Sources and significance: the accessible online
  version of the paper sheet, for a student who works better on a device than
  on paper (motor, reading or writing needs). Hidden: not in the site map,
  opened by its address. Same sources, facts, worked example and check as the
  paper sheet (lesson-2-1-sources-and-significance.docx in the private
  repository).

  The worked example is NOT copied here: it is read from content.js, the same
  file the Cai Lun screen wall uses, so the two cannot drift. Zhang Qian's facts
  and caption below are the paper sheet's page 3 word for word; change both
  together.

  Supports, all off until the student turns them on, on Start, as in the
  accessible Rome CAT (curriculum/history/ancient-rome/cat/accessible in the
  private repository): Big buttons, Read to me (each word lit up as it is read,
  the device's own voice), Voice typing (the browser's speech recognition),
  zoom 80% to 200%, background colours, a reading layout with no italics.
  Full-screen lock, as in the CAT but with no password (the teacher asked for
  the lock and not the passwords): Start is set-up, outside full screen, so
  the microphone question comes there. Leaving Start starts full screen.
  Leaving full screen or the page covers the lesson until the student taps
  "Back to full screen"; nothing is lost, and every exit goes in a log that
  prints with the work and is counted in the class-sheet row. Printing is not
  counted. Where a browser has no full screen (some iPads), there is no lock
  and the printout says so.

  Honest interface: nothing here judges the writing. The check counts the
  marks the student makes on their own paragraph and states the paper sheet's
  rule (no link words, Level 6); the level is the student's own choice; the
  teacher marks.

  Saved on this device as it is typed (china21.access.v1). Hand in prints a
  copy, copies the text, or copies one tab-separated row for a class sheet.
  For a USB stick, use accessible-standalone.html (python3
  tools/build_standalone.py history/cai-lun/accessible.html).

<script>
/* inlined from content.js */
/* =======================================================================
   CONTENT BLOCK for the Cai Lun wall: Ancient China lesson 2.1, Sources and
   significance. This is the ONLY place the wall text lives.

   A hidden teacher-screen wall, like history/hannibal: not in the site map,
   noindex, opened by its address. Students work on paper; the teacher shows
   the worked example here. The ladder is the same text as page 2 of the
   paper sheet (lesson-2-1-sources-and-significance.docx in the private
   repository, built by lesson-2-1-build/build_lesson21.js). Change both
   together.

   Cai Lun is the worked example only. The students' own paragraph is on
   Zhang Qian, on paper, and Zhang Qian is deliberately not on this screen.
   Neither figure nor either source is in any assessment.

   Three marks, matching the paper legend: the source (solid underline), his
   significance (double underline), and the link words that join them (a
   box). Level 6 is the near-miss: it has no link.
   ======================================================================= */

const WALL = {
  id: "hist-cai-lun",
  title: "Cai Lun",
  expected: "Level 7",
  inquiry: "What does Source A show, and how does that tell us why Cai Lun mattered?",
  foot: "<b>Source:</b> a woodcut from the Tiangong Kaiwu by Song Yingxing, printed in 1637 (public domain, via Wikimedia Commons). The rows are the Ancient China Source Analysis Rubric's origin row and significance bands, word for word."
};

const FACTS = [
  ["The person", "Cai Lun (about 50 to 121 CE) was an official at the court of the Eastern Han emperors."],
  ["Before paper", "Chinese writing was mostly on strips of bamboo or wood, which were heavy, or on silk, which was expensive."],
  ["105 CE", "He showed the emperor a way of making paper from tree bark, hemp, old rags and fishing nets. The emperor rewarded him, and his paper came into wide use."],
  ["Argued over", "Archaeologists have found paper from the 200s BCE, centuries before him. Historians now say he improved papermaking rather than invented it."],
  ["The records", "Most of what we know about him comes from a history written about 300 years after he died."],
  ["Afterwards", "Paper later spread from China to the rest of the world. In China he was worshipped as the god of papermaking."]
];

const CRITERIA = [
  { key:"origin",       row:"Origin, features &amp; purpose", name:"Source",       glyph:"■",
    ink:"#1f5fa8", lamp:"#7fb2e8", underline:"solid" },
  { key:"significance", row:"Historical significance",       name:"Significance", glyph:"✦",
    ink:"#9b2f22", lamp:"#f0968a", underline:"double" },
  { key:"link",         row:"The link",                      name:"Link words",   glyph:"▢",
    ink:"#1f2a30", lamp:"#e6e2d8", underline:"solid", box:true },
];

const LEVELS = ["Level 6","Level 7","Level 8","Level 9"];

const EXAMPLES = {
"Level 6":
`{origin|Source A is a picture of people making paper.} {origin|It was made a long time after Cai Lun lived, so it is not a primary source about him.} Cai Lun was {significance|important because he made paper}.`,
"Level 7":
`{origin|Source A is a woodcut from a Chinese book about how things are made, printed in 1637.} {origin|It shows a worker dipping a screen into a vat of pulp to make a sheet of paper.} {origin|Its purpose was to explain a skill.} {link|This shows that} {significance|paper was still made by hand in China 1,500 years after Cai Lun}, {link|so} {significance|the craft he improved lasted}. He also mattered because {significance|paper was cheaper than silk and lighter than bamboo, so more people could write things down}.`,
"Level 8":
`{origin|Source A is a woodcut printed in 1637, in a Ming dynasty book that explained how useful things were made.} {origin|It shows a worker dipping a screen into a vat of pulp, the step that turns pulp into a sheet, with finished sheets stacked on the table behind him.} {origin|Because it was made 1,500 years after Cai Lun, it cannot show his own workshop.} {origin|The steps in the book begin with cutting bamboo, but the old records say Cai Lun used tree bark, hemp, rags and fishing nets.} {link|So the source is evidence of} {significance|his legacy, not his method}: {significance|the craft he improved was still an everyday industry in the Ming dynasty}. {link|That legacy is why} {significance|he is significant. Paper replaced heavy bamboo strips and costly silk, so governments could keep more records, and later it made printed books possible}.`,
"Level 9":
`{origin|Source A is a woodcut from the Tiangong Kaiwu, a Ming dynasty book of 1637 written to explain how useful things were made.} {origin|It records the papermaking of its own time: a worker dipping a screen into a vat of pulp, in a process that begins with cutting bamboo.} {origin|That makes it a primary source for Ming papermaking but only a late, indirect source for Cai Lun, who used bark, hemp, rags and nets.} {link|What it can prove is} {significance|continuity: the method he reported in 105 CE grew into a craft still practised across China fifteen centuries later}. {link|What it cannot settle is} {significance|whether he invented paper at all}. {significance|Archaeologists have found paper from the 200s BCE, and the main written account of him dates from about 300 years after his death.} {significance|So his significance is contested but strong: he improved and spread paper rather than inventing it}, {link|and the source fits that reading, because} {significance|it shows a process that kept changing long after him, not one fixed by a single inventor}.`
};

const EXPLANATIONS = {
"Level 6": {
  origin:       "Identifies the type of source and that it is not from his time.",
  significance: "Identifies one basic reason he was important.",
  link:         "None yet. The source and his significance sit side by side and never meet."
},
"Level 7": {
  origin:       "Identifies origin, what the picture shows, and its purpose.",
  significance: "More than one reason, and an effect that lasted.",
  link:         "Joins what the source shows to why he mattered."
},
"Level 8": {
  origin:       "Describes the source and what being made later stops it showing.",
  significance: "Explains significance as legacy and change, with evidence.",
  link:         "Says exactly what the source is evidence of, and what follows."
},
"Level 9": {
  origin:       "Explains the source: primary for one thing, late and indirect for another.",
  significance: "A judgement that treats his significance as contested, and weighs the evidence.",
  link:         "Separates what the source can prove from what it cannot settle."
}
};

/* Verbatim from the Year 7 Ancient China Source Analysis Rubric. The
   significance bands name Qin Shi Huang because the rubric does. The link has
   no rubric row of its own, so the rubric pane shows only the first two. */
const CONTINUUM = {
origin:{
 "Level 6":"I can identify different types of historical sources.",
 "Level 7":"I can identify the origin, content features and purpose of historical sources.",
 "Level 8":"I can describe the origin, content features and purpose of historical sources.",
 "Level 9":"I can explain the origin, content features and purpose of historical sources."},
significance:{
 "Level 6":"Identifies one basic reason why Qin Shi Huang (or another figure/event) was important. Provides simple statements such as “He changed China” or “He was powerful.”",
 "Level 7":"Describes more than one reason for Qin Shi Huang’s significance (e.g., unification, administration reforms). Shows some awareness that significance relates to impact or change. Begins to explain short-term or long-term effects. Uses some evidence from the sources or prior knowledge.",
 "Level 8":"Clearly explains why Qin Shi Huang was significant, using historical criteria such as: Impact on people, Long-term legacy, Changes caused, Perspectives (positive and negative). Shows awareness that significance can be interpreted differently by different groups (e.g., Han writers vs. modern historians). Uses evidence purposefully to support explanations.",

  const v = speechSynthesis.getVoices().filter(x => /^en/i.test(x.lang));
  const rank = x => (x.lang === "en-AU" ? 0 : /en-(GB|NZ)/.test(x.lang) ? 1 : 2) + (x.localService ? 0 : 3);
  voice = v.sort((a, b) => rank(a) - rank(b))[0] || null;
}
if (TTS) { pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); }
function utter(text){ const u = new SpeechSynthesisUtterance(text); u.lang = voice ? voice.lang : "en-AU"; if (voice) u.voice = voice; u.rate = A.rate || .9; return u; }
let reading = null;
function setReadUI(){ const b = $("readPage"); if (!b) return; b.hidden = !TTS; b.setAttribute("aria-pressed", !!reading); b.textContent = reading ? "■ Stop reading" : "🔊 Read this page"; }
function stopReading(){ if (!TTS) return; const r = reading; reading = null; if (r && r.el) r.el.innerHTML = r.orig; speechSynthesis.cancel(); setReadUI(); }
function speak(t){ if (!TTS) return; stopReading(); speechSynthesis.speak(utter(t)); }
function readEls(els){
  if (!TTS) return;
  stopReading();
  const r = reading = { queue: els.filter(e => e && e.textContent.trim()), el: null, orig: "" };
  setReadUI();
  const next = () => {
    if (reading !== r) return;
    if (r.el) { r.el.innerHTML = r.orig; r.el = null; }
    const el = r.queue.shift();
    if (!el) { reading = null; setReadUI(); return; }
    const text = el.textContent.replace(/\s+/g, " ").trim(), spans = [];
    text.replace(/\S+/g, (w, i) => { spans.push([i, i + w.length]); return w; });
    r.el = el; r.orig = el.innerHTML;
    el.innerHTML = spans.map(([a, b]) => `<span class="w">${esc(text.slice(a, b))}</span>`).join(" ");
    const ws = el.querySelectorAll(".w"), u = utter(text);
    u.onboundary = e => {
      if (reading !== r || e.name === "sentence") return;
      const k = spans.findIndex(([a, b]) => e.charIndex >= a && e.charIndex < b);
      ws.forEach((w, j) => w.classList.toggle("now", j === k));
      if (k >= 0) ws[k].scrollIntoView({ block:"nearest" });
    };
    u.onend = u.onerror = () => setTimeout(next, 150);
    speechSynthesis.speak(u);
  };
  next();
}
const readPageEls = () => [...$("screen").querySelectorAll(".q p, .rd")];
const readBtn = label => TTS ? `<button type="button" class="say" data-readel="1" aria-label="${esc(label)}">🔊</button>` : "";

/* ---------- voice typing (as in the accessible CAT) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recKey = null, sttLang = null;
(async () => { try { if (SR && SR.available) for (const l of ["en-AU", "en-GB", "en-US"])
  if (await SR.available({ langs:[l], processLocally:true }) === "available") { sttLang = l; break; } } catch (e) {} })();
const micBtn = key => SR ? `<button type="button" class="big mic" data-mic="${key}" aria-pressed="false">🎤 Speak</button><p class="heard" id="heard_${key}" aria-live="polite"></p>` : "";
let micStream = null, micMsg = "";
const liveTrack = () => micStream && micStream.getAudioTracks().find(t => t.readyState === "live");
function micNote(t){ micMsg = t; const n = $("micNote"); if (n) n.textContent = t; }
async function openMic(){
  if (liveTrack()) { micNote("Microphone on. It only listens when you tap Speak."); return; }
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { micNote("This browser cannot use the microphone."); return; }
  micNote("If the browser asks to use the microphone, choose Allow.");
  try { micStream = await navigator.mediaDevices.getUserMedia({ audio:true }); micNote("Microphone on. It only listens when you tap Speak."); }
  catch (e) { micStream = null; micNote(e.name === "NotFoundError" ? "No microphone found on this device." : "The microphone is blocked. Ask your teacher."); }
}
function closeMic(){ if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null; micMsg = ""; }
function heard(key, t){ const h = document.getElementById("heard_" + key); if (h) h.textContent = t; }
function setMicUI(){ document.querySelectorAll("[data-mic]").forEach(b => { const on = b.dataset.mic === recKey; b.setAttribute("aria-pressed", on); b.textContent = on ? "■ Stop" : "🎤 Speak"; }); }
function stopMic(){ const r = rec; rec = null; recKey = null; if (r) { try { r.stop(); } catch (e) {} } setMicUI(); }
function putSaid(key, said){
  said = (said || "").trim(); if (!said) return;
  const ta = document.querySelector(`textarea[data-key="${key}"]`);
  const cur = ta ? ta.value : (A.txt[key] || "");
  const before = ta ? cur.slice(0, ta.selectionStart ?? cur.length) : cur;
  const text = (!before.trim() || /[.!?]\s*$/.test(before) ? cap1(said) : said) + " ";
  if (ta) return caretInsert(key, text);
  undo[key] = undo[key] || []; undo[key].push(cur);
  A.txt[key] = cur + (cur && !/\s$/.test(cur) ? " " : "") + text; save(); drawStrip();
}
function startMic(key){
  stopMic(); stopReading();
  const r = rec = new SR(); recKey = key;
  r.lang = sttLang || "en-AU"; r.continuous = true; r.interimResults = true;
  if (sttLang) r.processLocally = true;
  r.onresult = e => {
    if (r.closed) return;
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) putSaid(key, res[0].transcript); else interim += " " + res[0].transcript.trim();
    }
    r.pending = interim.trim();
    heard(key, r.pending ? "Hearing: " + r.pending : rec === r ? "Listening." : "");
  };
  r.onerror = e => {
    if (e.error === "aborted") return;
    r.err = true;
    heard(key, e.error === "network" ? "Voice typing needs the internet on this device. Ask your teacher."
             : e.error === "not-allowed" || e.error === "service-not-allowed" ? "The microphone is blocked. Ask your teacher."
             : e.error === "no-speech" ? "Nothing heard. Tap Speak and try again." : "Voice typing stopped. Tap Speak to start again.");
  };
  r.onend = () => {
    r.closed = true;
    if (r.pending) { putSaid(key, r.pending); r.pending = ""; }
    if (rec === r) { rec = null; recKey = null; setMicUI(); }
    if (!r.err) heard(key, "");
  };
  const track = liveTrack();
  let started = false;
  if (track) { try { r.start(track); started = true; } catch (e) {} }
  if (!started) { try { r.start(); started = true; } catch (e) {} }
  if (started) heard(key, "Listening."); else { rec = null; recKey = null; heard(key, "Voice typing did not start."); }
  setMicUI();
}

/* ---------- the full-screen lock (no password) ---------- */
const FS = !!(document.documentElement.requestFullscreen && document.fullscreenEnabled !== false);
let graceUntil = 0;          // printing leaves full screen; that is not counted
function logIt(what){ A.log = A.log || []; A.log.push({ t:Date.now(), what }); save(); }
function armLock(){ if (FS && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); }
function showLock(what){
  if (A.step === 0 || !$("lock").hidden) return;
  stopReading(); stopMic();
  if (Date.now() > graceUntil) logIt(what);
  $("lockH").textContent = what === "Left the page" ? "You left the page" : what === "Left the window" ? "You switched away" : "You left full screen";
  $("lock").hidden = false; $("lockBack").focus();
}
$("lockBack").onclick = () => {
  const done = () => { $("lock").hidden = true; };

};
document.addEventListener("fullscreenchange", () => { if (FS && !document.fullscreenElement) showLock("Left full screen"); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") showLock("Left the page"); });
/* Alt+Tab leaves the page visible and in full screen, so watch focus as well. A click
   into the video or the vocab hub also blurs the window, but document.hasFocus() stays
   true; and once focus is inside a frame the page gets no second blur, so check each second. */
window.addEventListener("blur", () => setTimeout(() => { if (!document.hasFocus() && Date.now() > graceUntil) showLock("Left the window"); }, 200));

const ZOOMS = [0.8, 0.9, 1, 1.15, 1.3, 1.5, 1.75, 2];
function setZoom(z){
  A.zoom = ZOOMS.includes(z) ? z : 1;

}
$("zIn").onclick = () => { if (steady()) setZoom(ZOOMS[Math.min(ZOOMS.length - 1, ZOOMS.indexOf(A.zoom) + 1)]); };
$("zOut").onclick = () => { if (steady()) setZoom(ZOOMS[Math.max(0, ZOOMS.indexOf(A.zoom) - 1)]); };

/* ---------- page 4: check it, by marking my own paragraph ----------
   Each word is a button. Choose a pen, tap the first word of a part, then its
   last word; tap one word twice to mark just that word. The marks are kept
   when the paragraph is edited: words that are still there keep their mark. */
let pen = "origin", anchor = null;
const words = () => para() ? para().split(/\s+/) : [];
function remapMarks(){
  const now = words(), old = A.markWords || [], om = A.marks || [];
  if (now.join(" ") === old.join(" ")) return;
  const n = old.length, m = now.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = old[i] === now[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const marks = new Array(m).fill("");
  for (let i = 0, j = 0; i < n && j < m;) { if (old[i] === now[j]) { marks[j] = om[i] || ""; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  A.marks = marks; A.markWords = now; save();
}
const runs = k => { let c = 0; (A.marks || []).forEach((x, i) => { if (x === k && A.marks[i - 1] !== k) c++; }); return c; };
function ruleNote(){
  const s = runs("origin"), g = runs("significance"), l = runs("link");
  if (!words().length) return `<p class="rule">Write your paragraph first.</p>`;
  if (!s && !g && !l) return `<p class="rule">Nothing marked yet. Choose a pen, then tap the first and last word of a part.</p>`;
  if (!l) return `<p class="rule">No link words marked. Then nothing joins your source to his significance, and your paragraph sits at Level 6 however much it says.</p>`;
  if (!s) return `<p class="rule">No source parts marked. A link needs something from the source to join.</p>`;
  if (!g) return `<p class="rule">No significance marked. A link needs something about why he mattered to join to.</p>`;
  return `<p class="rule okay">Your source, his significance and a link are all marked. Now check: is every claim something you can point at in Source B or the facts?</p>`;
}
function markScreen(){
  remapMarks();
  const ws = words();
  return `<div class="card"><div class="q"><p>Mark your own paragraph. Choose a pen, tap the first word of a part, then its last word.</p></div>
    ${legend()}
    <div class="pens" role="group" aria-label="Pen">${PENS.map(([k, t]) => `<button type="button" class="big" data-pen="${k}" aria-pressed="${pen === k}">${esc(t)}</button>`).join("")}

    <div class="para" id="markPara">${ws.length ? ws.map((w, i) => `<button type="button" data-w="${i}" class="${(A.marks[i] ? "m-" + A.marks[i] : "") + (anchor === i ? " anchor" : "")}" aria-label="${esc(w)}${A.marks[i] ? ", marked " + PEN_NAMES[A.marks[i]] : ""}">${esc(w)}</button>`).join(" ") : `<span class="note">Your paragraph will appear here once you have written it.</span>`}</div>
    <div class="tally"><div><b>${runs("origin")}</b>source parts</div><div><b>${runs("significance")}</b>significance parts</div><div><b>${runs("link")}</b>link words</div></div>

    <p class="note">This counts your marks. It does not judge your writing; your teacher does.</p></div>`;

    <textarea data-key="nextstep" style="min-height:110px" aria-label="To move it up one level I would">${esc(A.txt.nextstep || "")}</textarea>
    <div class="stems" role="group" aria-label="Starters"><p class="lab">Tap a starter to add it where your cursor is:</p>
      ${NEXT_STEMS.map((t, k) => `<button type="button" class="big" data-stem="nextstep" data-k="${k}">${esc(t)}…</button>`).join("")}
      <button type="button" class="big" data-undo="nextstep">Undo</button>${micBtn("nextstep")}</div>
    <p class="note">Rubric rows from the Year 7 Ancient China Source Analysis Rubric, word for word. The significance row names Qin Shi Huang because the rubric does; it is marked the same way for any person.</p></div>`;
}

/* ---------- hand in ---------- */
function handScreen(){
  const items = STEPS.filter(s => ["start", "write", "mark", "level"].includes(s.id)).map(s => `<li>${stepDone(s) ? `<span class="done">Done</span>` : `<span class="missing">Not done yet</span>`} · <button type="button" class="big" style="min-height:56px" data-goto="${STEPS.indexOf(s)}">${esc(s.short)}</button></li>`).join("");
  return `<div class="card"><h2>Hand in</h2>
    <ul class="check" style="list-style:none;padding:0">${items}</ul>
    <div class="row" style="margin-top:16px"><button type="button" class="big go" style="background:var(--sel);color:#fff;border-color:var(--sel)" id="printBtn">Print or save as PDF</button>
    <button type="button" class="big" id="copyBtn">Copy my work</button>
    <button type="button" class="big" id="rowBtn">Copy a row for the class sheet</button><span id="copied" role="status"></span></div>
    <p class="note">Print gives a copy laid out like page 4 of the paper sheet, with your marks, to hand to your teacher.</p></div>`;
}

/* ---------- wiring ---------- */
const undo = {};
function caretInsert(key, text){
  const ta = document.querySelector(`textarea[data-key="${key}"]`); if (!ta) return;
  undo[key] = undo[key] || []; undo[key].push(ta.value);
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? ta.value.length;
  const before = ta.value.slice(0, s), after = ta.value.slice(e);
  const pad = before && !/\s$/.test(before) && !/^\s/.test(text) ? " " : "";
  ta.value = before + pad + text + after;
  const at = (before + pad + text).length;
  ta.focus(); ta.setSelectionRange(at, at);
  A.txt[key] = ta.value; save(); drawStrip();
}
function wire(){
  const S = $("screen");
  const nm = $("nm"); if (nm) nm.addEventListener("input", () => { A.name = nm.value; save(); drawStrip(); });
  S.querySelectorAll("textarea[data-key]").forEach(ta => ta.addEventListener("input", () => { A.txt[ta.dataset.key] = ta.value; save(); drawStrip(); }));
  S.querySelectorAll("[data-readq]").forEach(b => b.onclick = () => readEls([b.closest(".q").querySelector("p")]));
  S.querySelectorAll("[data-readel]").forEach(b => b.onclick = () => readEls([b.parentElement.querySelector(".rd")]));
  S.querySelectorAll("[data-sayans]").forEach(b => b.onclick = () => speak(A.txt[b.dataset.sayans] || "Nothing written yet."));
  S.querySelectorAll("[data-mic]").forEach(b => {
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.onclick = () => { if (!steady()) return; if (recKey === b.dataset.mic) stopMic(); else startMic(b.dataset.mic); };
  });
  S.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => { if (!steady()) return; A.rate = +b.dataset.rate; save(); render(); speak("This is the reading speed."); });
  S.querySelectorAll("[data-sup]").forEach(b => b.onclick = () => {
    if (!steady()) return;
    const k = b.dataset.sup; A.sup[k] = !A.sup[k]; if (A.sup[k]) A.used[k] = true;
    save(); applySupports(); render();
    if (k === "mic" && A.sup.mic) openMic();
  });
  S.querySelectorAll("[data-tint]").forEach(b => b.onclick = () => { if (!steady()) return; A.tint = b.dataset.tint; save(); applyTint(); render(); });
  S.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { if (!steady()) return; A.lv = b.dataset.lv; save(); render(); });
  S.querySelectorAll("[data-stem]").forEach(b => {
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.onclick = () => { if (!steady()) return; const key = b.dataset.stem; caretInsert(key, (key === "para" ? STEMS : NEXT_STEMS)[+b.dataset.k]); };
  });
  S.querySelectorAll("[data-undo]").forEach(b => {
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.onclick = () => {
      if (!steady()) return;
      const key = b.dataset.undo, ta = document.querySelector(`textarea[data-key="${key}"]`);
      if (!ta || !undo[key] || !undo[key].length) return;
      ta.value = undo[key].pop(); A.txt[key] = ta.value; save(); drawStrip(); ta.focus();
    };
  });
  // marking
  S.querySelectorAll("[data-pen]").forEach(b => b.onclick = () => { if (!steady()) return; pen = b.dataset.pen; anchor = null; render(); });
  const cm = $("clearMarks"); if (cm) cm.onclick = () => { if (!steady()) return; A.marks = words().map(() => ""); anchor = null; save(); render(); };
  S.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
    if (!steady()) return;
    const i = +b.dataset.w;
    if (anchor === null) { anchor = i; render(); }
    else { const [a, z] = anchor < i ? [anchor, i] : [i, anchor]; for (let j = a; j <= z; j++) A.marks[j] = pen; anchor = null; save(); render(); }
    const again = document.querySelector(`[data-w="${i}"]`); if (again) again.focus();
  });
  // my level
  S.querySelectorAll("[data-self]").forEach(b => b.onclick = () => { if (!steady()) return; A.self[b.dataset.self] = b.dataset.v; save(); render(); });
  // hand in
  S.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { if (steady()) go(+b.dataset.goto); });
  const pr = $("printBtn"); if (pr) pr.onclick = () => { graceUntil = Date.now() + 120000; buildPrint(); window.print(); graceUntil = Date.now() + 3000; };
  const copy = async t => { try { await navigator.clipboard.writeText(t); $("copied").textContent = "Copied."; } catch (e) { $("copied").textContent = "Copy did not work here. Use Print instead."; } };
  const cp = $("copyBtn"); if (cp) cp.onclick = () => copy(plainText());
  const rw = $("rowBtn"); if (rw) rw.onclick = () => copy(classRow());
}

/* ---------- the printed copy, laid out like page 4 ---------- */
function markedPara(){
  remapMarks();
  const ws = words(); if (!ws.length) return "<i>(nothing written)</i>";
  let out = "", cur = null;
  ws.forEach((w, i) => {
    const m = A.marks[i] || "";
    if (m !== cur) { if (cur) out += "</span>"; if (m) out += `<span class="m-${m}">`; cur = m; } else out += "";
    out += (i && !(m && m === A.marks[i - 1]) ? "" : "") + esc(w) + " ";
  });
  if (cur) out += "</span>";
  return out;
}
const mins = () => Math.round((A.secs || 0) / 60);
function buildPrint(){
  $("print").innerHTML = `
    <h1>Ancient China 2.1 · Sources and significance</h1>
    <p><b>Name:</b> ${esc(A.name || "")} &nbsp; <b>Printed:</b> ${new Date().toLocaleDateString("en-AU")} &nbsp; <i>Done on the accessible online version.</i></p>
    <p><b>Supports used:</b> ${esc(supportsUsed())} &nbsp; <b>Time on the page:</b> about ${mins()} minutes</p>
    <h2>${esc(ZHANG_Q)}</h2>
    <div class="ans">${markedPara()}</div>
    <p><b>The student's own marks:</b> ${runs("origin")} source parts (single underline), ${runs("significance")} significance parts (double underline), ${runs("link")} link words (boxed).</p>
    <h2>My level</h2>
    <table><tr><th></th>${LEVELS.map(l => `<th>${l}</th>`).join("")}</tr>
      ${ROWS.map(([k, name]) => `<tr><th>${esc(name)}</th>${LEVELS.map(l => `<td class="${A.self[k] === l ? "picked" : ""}">${A.self[k] === l ? "[✓] " : ""}${esc(CONTINUUM[k][l])}</td>`).join("")}</tr>`).join("")}</table>
    <p><b>To move it up one level I would:</b> ${esc((A.txt.nextstep || "").trim()) || "<i>(not written)</i>"}</p>
    <h2>Lesson log</h2>
    <p>${FS ? `Left full screen or the page ${exits()} time${exits() === 1 ? "" : "s"}.` : "This browser has no full screen, so the lesson was not locked."}</p>
    ${exits() ? `<p>${logLines().map(esc).join("<br>")}</p>` : ""}
    <p style="font-size:9pt;color:#555">The marks and the level are the student's own. Nothing on the page judged the writing.</p>`;
}
function plainText(){
  return ["Ancient China 2.1: Sources and significance", "Name: " + A.name, "Supports used: " + supportsUsed(), "Time on the page: about " + mins() + " minutes", "",
    ZHANG_Q, para() || "(nothing written)", "",
    `My marks: ${runs("origin")} source parts, ${runs("significance")} significance parts, ${runs("link")} link words`,
    "My level: origin " + (A.self.origin || "not chosen") + ", significance " + (A.self.significance || "not chosen"),
    "To move it up one level I would: " + ((A.txt.nextstep || "").trim() || "(not written)"),
    "Left full screen or the page: " + (FS ? exits() + " times" : "no full screen in this browser"), ...logLines()].join("\n");
}
/* One tab-separated row for a shared sheet. Columns: name, date, minutes on the page,
   words written, source parts, significance parts, link words (all the student's own
   marks), self-assessed origin level, self-assessed significance level, times the
   student left full screen or the page, next step and paragraph in the student's own
   words. It cannot tell you whether the paragraph is any good. */
function classRow(){
  const clean = t => String(t || "").replace(/[\t\r\n]+/g, " ").trim();
  return [clean(A.name), new Date().toLocaleDateString("en-AU"), mins(), words().length, runs("origin"), runs("significance"), runs("link"),
    A.self.origin || "", A.self.significance || "", FS ? exits() : "no lock", clean(A.txt.nextstep), clean(para())].join("\t");
}

$("readPage").onclick = () => { if (!steady()) return; if (reading) stopReading(); else readEls(readPageEls()); };
A.sup = Object.assign({ big:false, read:false, mic:false }, A.sup); A.used = A.used || {}; A.self = A.self || {}; A.marks = A.marks || [];
setZoom(A.zoom); applyTint(); applySupports(); setReadUI();
render();
if (A.sup.mic && SR) openMic();
if (A.step !== 0 && FS && !document.fullscreenElement) { $("lockH").textContent = "Back to the lesson"; $("lock").hidden = false; }
</script>
</body>
