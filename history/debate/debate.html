<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debate: speaking order and timer</title>
<!--
  Year 7 debate structure tool. Type a topic (it starts with the Qin Shi Huang one). The Teams view is a stage: set how many speakers
  each team has, type each name under its stick figure, and click a speech bubble to plan that speaker's argument
  and rebuttal. The Run view runs the debate turn by turn with a timer and sentence
  starters for each part of the turn.

  The rules (kept simple for Year 7, adapted from the ELC debate structure):
  - Each team's first speaker gives a short intro.
  - Every speaker gives one argument.
  - Every speaker after the very first starts by answering (rebutting) the speaker before them.
  - No conclusions. Instead, a final reply: Team For's first speaker answers Team Against's last argument,
    so every argument gets answered and every speaker gets one rebuttal. It can be switched off.
  - Both teams give the same number of arguments. If a team has fewer people, someone speaks twice (marked x2).

  Speakers name each other: the rebuttal starter says "<name> said that…", planned rebuttals that start "They said"
  use the name of the speaker being answered, and changing a name swaps it in every planned box.
  Two debates: the lesson's (Qin Shi Huang) and a demo (Batman) with two arguments a side, and the rebuttals to
  them, already planned as dot points; the third argument and its answer are left for the class. Each keeps its own topic and ideas, so switching loses nothing.
  Edit the text in the DATA block below. Names, the topic and the settings are saved in this browser only
  (localStorage), never sent anywhere. One self-contained file: no internet needed.
-->
<style>
:root{
  --ink:#1d2b2f; --muted:#56636a; --paper:#fbf8f1; --card:#fff; --line:#d9d2c3; --sel:#1f3d47; --gold:#8a6d1e;
  --intro:#7a5a00; --introbg:#fff2c9; --arg:#175f8a; --argbg:#e1eff8; --reb:#a3261b; --rebbg:#fbe4e0;
  --teamA:#175f8a; --teamB:#7a3e8f; --focus:#2c7488;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:40px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 12px;cursor:pointer;font-weight:700}
button:hover{border-color:var(--sel)}
button.primary{background:var(--sel);color:#fff;border-color:var(--sel)}
button[aria-pressed="true"]{background:var(--sel);color:#fff;border-color:var(--sel)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{background:var(--sel);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0;white-space:nowrap}
header label{font-weight:700;font-size:15px;opacity:.9}
#motion{flex:1 1 260px;min-width:0;font-size:20px;font-weight:700;padding:6px 10px;border-radius:8px;border:2px solid #fff;background:#fff;color:var(--ink)}
header .hbtn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
body.view-teams #bigBtn{display:none}
main{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px;padding:12px 16px;min-height:0}
body.big main{grid-template-columns:minmax(0,1fr)}
body.big #setup{display:none}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:0;overflow:auto}
h2{font-size:17px;margin:0 0 8px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.team{border-left:6px solid;padding:4px 0 6px 10px;margin:0 0 12px}
.team.A{border-color:var(--teamA)} .team.B{border-color:var(--teamB)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{min-width:40px;padding:0}
.stepper output{min-width:26px;text-align:center;font-weight:800}
.opts label{display:flex;gap:8px;align-items:center;margin:4px 0}
.opts input[type=number]{width:70px;padding:4px 6px;border:2px solid var(--line);border-radius:8px}
.opts input[type=checkbox]{width:22px;height:22px}
.note{color:var(--muted);font-size:14px;margin:6px 0}
#run{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;min-height:0}
body.big #run{grid-template-columns:minmax(0,1fr) 260px}
#now{display:flex;flex-direction:column;min-height:0}
.who{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.who .turnno{color:var(--muted);font-weight:700}
.who .name{font-size:28px;font-weight:800}
.who .team{border:0;padding:0;margin:0;font-weight:800}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
#clock{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;min-width:140px}
body.big #clock{font-size:72px}
#clock.low{color:var(--reb)}
#clock.done{color:#fff;background:var(--reb);border-radius:10px;padding:0 10px}
.parts{display:grid;gap:10px;overflow:auto;min-height:0}
.part{border-radius:12px;padding:10px 14px;border:2px solid}
.part.intro{background:var(--introbg);border-color:var(--intro)}
.part.reb{background:var(--rebbg);border-color:var(--reb);border-style:dashed}
.part.arg{background:var(--argbg);border-color:var(--arg)}
.part h3{margin:0 0 4px;font-size:18px}
.part.intro h3{color:var(--intro)} .part.reb h3{color:var(--reb)} .part.arg h3{color:var(--arg)}
.part .secs{font-weight:600;color:var(--muted);font-size:14px}
.part ul{margin:4px 0 0;padding-left:1.2em}
body.big .part{font-size:22px}
.order{list-style:none;margin:0;padding:0}
.order li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:10px;cursor:pointer;border:2px solid transparent}
.order li:hover{border-color:var(--line)}
.order li[aria-current="true"]{background:#eef3f4;border-color:var(--sel)}
.order li.done{opacity:.55}
.order .n{font-weight:800;min-width:22px}
.order .tA{color:var(--teamA);font-weight:800}
.order .tB{color:var(--teamB);font-weight:800}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:0 6px;margin:2px 3px 0 0;border:2px solid}
.tag.intro{color:var(--intro);background:var(--introbg);border-color:var(--intro)}
.tag.arg{color:var(--arg);background:var(--argbg);border-color:var(--arg)}
.tag.reb{color:var(--reb);background:var(--rebbg);border-color:var(--reb);border-style:dashed}
.x2{font-size:12px;font-weight:800;background:var(--sel);color:#fff;border-radius:6px;padding:0 5px;margin-left:4px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.rules{font-size:14px;margin:4px 0 0;padding-left:1.1em;color:var(--muted)}
.links a{display:block;margin:3px 0;color:var(--sel);font-weight:700}
.modes{display:inline-flex;gap:6px}
header .hbtn[aria-pressed="true"]{background:#fff;color:var(--sel);border-color:#fff}
.idea{margin:0 0 10px}
.idea label{display:block;font-weight:700;font-size:15px;margin:0 0 3px}
.idea textarea{width:100%;min-height:96px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:17px;resize:vertical}
.dots{margin:6px 0 0;padding:8px 12px;background:#fff;border-radius:8px;border:2px solid var(--arg)}
.dots b{display:block;font-size:14px;color:var(--arg)}
.dots.todo{border-style:dashed;color:var(--muted)}
.dots.reb{border-color:var(--reb)} .dots.reb b{color:var(--reb)}
body.big .dots{font-size:22px}
.demoNote{font-size:13px;font-weight:800;background:#fff2c9;color:#7a5a00;border-radius:6px;padding:0 6px;margin-left:6px}
/* the Teams stage */
body.view-teams main{grid-template-columns:minmax(0,1fr)}
body.view-teams #setup,body.view-teams #run{display:none}
body.view-run #stage{display:none}
#stage{display:flex;flex-direction:column;padding:0;overflow:hidden}
.stageTop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:2px solid var(--line)}
.stageTop .quick{margin:0}
#court{flex:1 1 0;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;padding:0 14px 10px}
.A{--tc:var(--teamA)} .B{--tc:var(--teamB)}
.side{padding:0 14px}
.side.A{border-right:3px dashed var(--line)}
.sideHead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--tc);font-weight:800;padding:8px 0;position:sticky;top:0;background:var(--card);z-index:2}
.sideHead .tname{width:140px;height:40px;font-weight:800;padding:4px 8px;border:2px solid var(--tc);border-radius:8px;color:var(--tc);background:#fff}
.spk{display:flex;gap:6px;align-items:center;margin:0 0 8px}
.side.B .spk{flex-direction:row-reverse}
.spkFig{flex:0 0 196px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fig{color:var(--tc);display:block;flex:none}
.spkFig .fig{width:62px;height:96px}
.side.B .fig,.spkWrap.B .fig{transform:scaleX(-1)}
.nrow{display:flex;gap:2px;align-items:center;width:100%}
.nrow input{flex:1;min-width:0;height:40px;padding:4px 8px;border:2px solid var(--line);border-radius:8px;border-bottom-color:var(--tc)}
.nrow button{min-width:40px;width:40px;padding:0}
.bubble{position:relative;flex:1 1 0;min-width:0;margin:0 14px;min-height:96px;text-align:left;background:#fff;border:2px solid var(--tc);border-radius:18px;padding:8px 14px;font-weight:400;font-size:15px;line-height:1.35;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer}
.bubble:hover{border-color:var(--tc);background:#fafcfd;box-shadow:0 0 0 2px var(--tc)}
.bubble::before,.bubble::after{content:"";position:absolute;top:50%;margin-top:-10px;border:10px solid transparent}
.side.A .bubble::before{left:-13px;border-left:0;border-right-color:var(--tc)}
.side.A .bubble::after{left:-9px;border-left:0;border-right-color:#fff}
.side.B .bubble::before{right:-13px;border-right:0;border-left-color:var(--tc)}
.side.B .bubble::after{right:-9px;border-right:0;border-left-color:#fff}
.bubble:hover::after{border-right-color:#fafcfd;border-left-color:#fafcfd}
.side.A .bubble:hover::after{border-left-color:transparent}
.side.B .bubble:hover::after{border-right-color:transparent}
.bl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl::before{content:"• "}
.brb{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--reb);border-top:1px dashed var(--reb);margin-top:3px;padding-top:2px}
.brb b{font-weight:800}
.bnone{color:var(--muted);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
dialog#spk{border:0;background:transparent;padding:0;width:min(1280px,96vw);max-width:none;max-height:94vh;overflow:visible;color:var(--ink)}
dialog#spk::backdrop{background:rgba(29,43,47,.55)}
.spkWrap{display:flex;gap:16px;align-items:center}
.spkWrap.B{flex-direction:row-reverse}
.spkFig2{flex:0 0 190px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:3px solid var(--tc);border-radius:18px;padding:12px 10px}
.spkFig2 .fig{width:90px;height:140px}
.spkFig2 input{width:100%;height:40px;padding:4px 8px;border:2px solid var(--tc);border-radius:8px;background:#fff;text-align:center;font-weight:700}
.spkBubble{position:relative;flex:1 1 0;min-width:0;background:#fff;border:3px solid var(--tc);border-radius:26px;padding:18px 24px;max-height:90vh;display:flex;flex-direction:column;margin:0 14px;font-size:20px}
.spkBubble label{font-size:18px}
.spkBubble textarea{min-height:150px;font-size:21px;line-height:1.5;overflow:hidden;resize:none}
.spkScroll{overflow:auto;min-height:0;padding:6px}
.spkBubble::before,.spkBubble::after{content:"";position:absolute;top:60px;border:12px solid transparent}
.spkWrap.A .spkBubble::before{left:-18px;border-left:0;border-right-color:var(--tc)}
.spkWrap.A .spkBubble::after{left:-13px;border-left:0;border-right-color:#fff}
.spkWrap.B .spkBubble::before{right:-18px;border-right:0;border-left-color:var(--tc)}
.spkWrap.B .spkBubble::after{right:-13px;border-right:0;border-left-color:#fff}
.spkBubble h2{color:var(--tc);margin:0 0 10px;font-size:24px}
.spkBubble .foot{display:flex;justify-content:flex-end;margin-top:4px}
@media screen and (max-width:860px){
  #stage{overflow:visible} #court{overflow:visible;grid-template-columns:minmax(0,1fr)}
  .side.A{border-right:0;border-bottom:3px dashed var(--line);padding-bottom:6px}
  .sideHead{position:static}
}
@media screen and (max-width:620px){
  #court{padding:0 8px 10px} .side{padding:0 4px}
  .spk,.side.B .spk{flex-wrap:wrap;flex-direction:row}
  .spkFig{flex:1 1 100%;flex-direction:row;gap:8px}
  .side.B .spkFig{flex-direction:row-reverse}
  .fig,.spkFig .fig{width:36px;height:58px}
  .bubble{flex:1 1 100%;margin:8px 0 0}
  .bubble::before,.bubble::after{display:none}
  .spkWrap,.spkWrap.B{flex-direction:column}
  .spkFig2{flex:none;width:100%;flex-direction:row}
  .spkBubble{margin:0;width:100%;max-height:78vh}
  .spkBubble::before,.spkBubble::after{display:none}
}
#printOrder{display:none}
@media screen and (max-width:860px){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  #run{grid-template-columns:1fr}
  .panel{overflow:visible}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
@media print{
  @page{size:A4 portrait;margin:14mm}
  body{display:block;overflow:visible;background:#fff}
  header,main{display:none!important}
  #printOrder{display:block;font-size:11pt}
  #printOrder h1{font-size:16pt;margin:0 0 4pt} #printOrder table{width:100%;border-collapse:collapse}
  #printOrder th,#printOrder td{border:1px solid #555;padding:4pt;text-align:left;vertical-align:top}
}
</style>
</head>
<body>
<header>
  <h1>Debate</h1>
  <span class="modes" role="group" aria-label="Which debate"><button type="button" class="hbtn" data-mode="real">Qin Shi Huang</button><button type="button" class="hbtn" data-mode="demo">Demo: Batman</button></span>
  <label for="motion">Topic</label>
  <input id="motion" type="text" autocomplete="off" aria-label="The debate topic">
  <span class="modes" role="group" aria-label="View"><button type="button" class="hbtn" data-view="teams" aria-pressed="true">Teams</button><button type="button" class="hbtn" data-view="run" aria-pressed="false">Run</button></span>
  <button type="button" class="hbtn" id="resetMotion" title="Put back the starting topic and ideas for this debate">Reset</button>
  <button type="button" class="hbtn" id="bigBtn" aria-pressed="false">Big view</button>
  <button type="button" class="hbtn" id="printBtn">Print the order</button>
</header>
<main>
  <section class="panel" id="stage" aria-label="Teams">
    <div class="stageTop">
      <div class="quick" role="group" aria-label="Quick sizes">
        <button type="button" data-quick="1">1 v 1</button>
        <button type="button" data-quick="2">2 v 2</button>
        <button type="button" data-quick="3">3 v 3</button>
        <button type="button" data-quick="4">4 v 4</button>
      </div>
    </div>
    <div id="court"></div>
  </section>
  <section class="panel" id="setup" aria-label="Set up the debate">
    <h2>Settings</h2>
    <div class="opts">
      <label><input type="checkbox" id="optReply"> Final reply (Team <span class="nmA"></span>'s first speaker answers the last argument)</label>
      <label><input type="number" id="tIntro" min="0" max="600" step="5"> seconds for an intro</label>
      <label><input type="number" id="tReb" min="0" max="600" step="5"> seconds for a rebuttal</label>
      <label><input type="number" id="tArg" min="0" max="600" step="5"> seconds for an argument</label>
      <label><input type="checkbox" id="optSound"> Beep when time is up</label>
    </div>
    <p class="note">The topic, names and settings save in this browser only. Nothing is sent anywhere.</p>
    <h2>The rules</h2>
    <ul class="rules" id="rules"></ul>
    <h2 style="margin-top:10px">Print and edit</h2>
    <div class="links" id="links"></div>
  </section>
  <section id="run" aria-label="Run the debate">
    <div class="panel" id="now"></div>
    <div class="panel"><h2>Speaking order</h2><div class="legend" id="legend"></div><ol class="order" id="order"></ol></div>
  </section>
</main>
<dialog id="spk" aria-label="Plan a speaker"></dialog>
<div id="printOrder"></div>

<script>
/* ============================== DATA: edit here ============================== */
/* Two debates. "real" is the lesson's; "demo" is a made-up topic to show how it runs, with two arguments
   planned for each team (as dot points) and the third left for the class to plan. Each keeps its own
   edits in this browser. */
const MODES = {
  real: { label: "Qin Shi Huang", motion: "We should commemorate Qin Shi Huang.",
    ideas: { A: ["", "", ""], B: ["", "", ""], rebA: ["", "", ""], rebB: ["", "", ""] } },
  demo: { label: "Demo: Batman", motion: "Should the people of Gotham commemorate Batman?",
    ideas: {
      A: ["He has kept Gotham safe for years\nHe catches criminals the police cannot catch\nExample: the police shine the Bat-Signal when they need his help\nThis shows the city depends on him",
          "He gives people hope\nOrdinary people see someone standing up to crime\nExample: he never gives up on Gotham, even when it is at its worst\nThis shows he makes people braver too",
          ""],
      B: ["He breaks the law to fight crime\nNobody voted for him, and he answers to no one\nExample: he hides his face behind a mask and works in secret\nThis shows a statue would honour someone who ignores the rules",
          "His fights put ordinary people in danger\nBattles happen in busy streets\nExample: cars, buildings and shops get wrecked when he chases villains\nThis shows the people of Gotham pay a price for his war on crime",
          ""],
      /* rebA[k]: Team For answers Team Against's argument k. rebB[k]: Team Against answers Team For's argument k.
         The answers to each team's third argument are left for the class, like the third arguments. */
      rebA: ["They said he breaks the law\nBut he only stops criminals and hands them to the police\nSo he works with the law, not against it",
             "They said his fights put people in danger\nBut the villains start those fights, not him\nSo Gotham would be more dangerous without him",
             ""],
      rebB: ["They said he keeps Gotham safe\nBut crime is still everywhere in Gotham, year after year\nSo he has not fixed the problem; the city needs police it can trust",
             "They said he gives people hope\nBut it teaches people to wait for someone else to save them\nSo a statue should honour people who help openly, like firefighters",
             ""] } }
};
const DEFAULTS = {
  teamA: "For", teamB: "Against",
  sizeA: 3, sizeB: 3,
  reply: true,
  secs: { intro: 30, reb: 45, arg: 60 },
  sound: false
};
/* The three parts of a turn. Sentence starters are what the speaker sees on the screen. */
const PARTS = {
  intro: { name: "Intro", glyph: "▲",
    who: "Each team's first speaker",
    stems: ["Today's topic is: {motion}", "Our team {stand} with this topic.", "To commemorate someone means to honour and remember them, for example with a statue, a museum or a special day.", "Our team will show that…"] },
  reb: { name: "Rebuttal", glyph: "◆",
    who: "Answer the speaker before you",
    stems: ["{prev} said that…", "But…", "In fact, the evidence shows…", "So their point does not work, because…"] },
  arg: { name: "Argument", glyph: "■",
    who: "Your one argument",
    stems: ["We think… because…", "For example,…", "This shows that…"] }
};
const LINKS = [
  ["Debate planner (Word, edit it)", "../../print/China-4.3-Debate-planner.docx"],
  ["Debate planner (PDF, print it)", "../../print/China-4.3-Debate-planner.pdf"],
  ["Evidence cards (Word)", "../../print/China-4.3-Debate-evidence-cards.docx"],
  ["Evidence cards (PDF)", "../../print/China-4.3-Debate-evidence-cards.pdf"],
  ["Rubric and feedback (Word)", "../../print/China-4.3-Debate-rubric.docx"],
  ["Rubric and feedback (PDF)", "../../print/China-4.3-Debate-rubric.pdf"]
];
/* ============================================================================ */

const KEY = "y7debate.v1";
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
let S = { mode: "real", modes: {}, teamA: DEFAULTS.teamA, teamB: DEFAULTS.teamB, sizeA: DEFAULTS.sizeA, sizeB: DEFAULTS.sizeB,
          namesA: [], namesB: [], reply: DEFAULTS.reply, secs: Object.assign({}, DEFAULTS.secs), sound: DEFAULTS.sound, turn: 0, big: false, view: "teams" };
try { const x = JSON.parse(localStorage.getItem(KEY)); if (x) S = Object.assign(S, x, { secs: Object.assign({}, DEFAULTS.secs, x.secs || {}) }); } catch (e) {}
const IDEA_KEYS = ["A", "B", "rebA", "rebB"];
const fresh = k => ({ motion: MODES[k].motion, ideas: nameTheySaid(Object.fromEntries(IDEA_KEYS.map(x => [x, MODES[k].ideas[x].slice()]))) });
/* Names in the planned boxes. rebA[k] answers Team B's argument k; rebB[k] answers Team A's argument k. */
function answered(key, k){ return key === "rebA" ? speakerName("B", k % S.sizeB) : speakerName("A", k % S.sizeA); }
function nameTheySaid(ideas){
  for (const key of ["rebA", "rebB"]) ideas[key] = (ideas[key] || []).map((txt, k) => (txt || "").replace(/^(\s*[-•*]?\s*)They said\b/gm, (m, pre) => pre + answered(key, k) + " said"));
  return ideas;
}
const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function renameEverywhere(from, to){
  if (!from || !to || from === to || from.trim().length < 2) return;
  const re = new RegExp("(^|[^\\w])" + reEsc(from) + "(?![\\w])", "g");
  for (const m of Object.values(S.modes)) for (const key of IDEA_KEYS) m.ideas[key] = (m.ideas[key] || []).map(t => (t || "").replace(re, (x, p) => p + to));
  save();
}
for (const k of Object.keys(MODES)) {

let spkDown = null;
$("spk").addEventListener("mousedown", e => { spkDown = e.target; });
$("spk").addEventListener("click", e => { if (e.target === $("spk") && spkDown === $("spk")) $("spk").close(); else if (e.target.id === "spkDone") $("spk").close(); });
$("spk").addEventListener("close", () => { const s0 = spk; spk = null; if (!s0) return; const b = document.querySelector(`[data-bubble="${s0.T}"][data-slot="${s0.i}"]`); if (b) b.focus(); });
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { S.view = b.dataset.view; save(); drawView(); });
document.querySelectorAll("[data-quick]").forEach(b => b.onclick = () => { S.sizeA = S.sizeB = +b.dataset.quick; S.turn = 0; left = null; stop(); save(); drawAll(); });
$("order").addEventListener("click", e => { const li = e.target.closest("[data-turn]"); if (!li) return; stop(); left = null; S.turn = +li.dataset.turn; save(); drawOrder(); drawNow(); });
$("order").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset.turn) { e.preventDefault(); e.target.click(); } });
$("bigBtn").onclick = () => { S.big = !S.big; document.body.classList.toggle("big", S.big); $("bigBtn").setAttribute("aria-pressed", S.big); save(); };
$("printBtn").onclick = () => { buildPrint(); window.print(); };
window.addEventListener("beforeprint", buildPrint);
document.addEventListener("keydown", e => {
  if (S.view !== "run" || $("spk").open) return;
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  if (e.key === " " && !e.target.closest("button,[data-turn]")) { e.preventDefault(); toggle(); }
  if (e.key === "ArrowRight") moveTurn(1);
  if (e.key === "ArrowLeft") moveTurn(-1);
});
LINKS.forEach(([t, u]) => { const a = document.createElement("a"); a.setAttribute("href", u); a.textContent = t; $("links").appendChild(a); });
document.body.classList.toggle("big", !!S.big); $("bigBtn").setAttribute("aria-pressed", !!S.big);
drawAll();
</script>
</body>
</html>
