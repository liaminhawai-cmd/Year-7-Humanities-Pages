<!--
  Ancient China lesson 2.3, Daily life, as a full-screen module for a work-from-home
  day. Hidden: not in the site map, opened by its address. It follows the 2.3 OneNote
  lesson plan: Engage (the video and its questions), Discover and develop (the
  readings and the ruling-class and working-class table), and the two sources with
  their questions (Source 1, Michael Loewe; Source 2, the Shang charioteer).

  What the teacher asked for, and where it lives in the code:
  - full-screen lock with no password, as in the accessible 2.1 page: leaving full
    screen or the page covers the module until the student goes back; every exit is
    logged in the report (LOCK)
  - Words: the vocab hub's lesson 2.3, inside the module (WORDS)
  - the video embedded, with its questions after it; two wrong answers in a row
    sends the student back to question 1, at the teacher's request, against the
    house "never wipe earned progress" rule (VIDEO). First tries are kept for the report
  - a little spaced repetition: two "Remember?" checks later in the module re-ask
    what was missed (REMEMBER)
  - the readings as slides, free to move back and forth, at Year 6, 7 or 8 level:
    Year 7 is the lesson plan's text; the other two keep the same facts (READ)
  - big ideas (Buddhism and others) open a box with more (CONCEPTS)
  - each source answered blind, then checked against Level 5, 6, 7, 8 and an
    optional 9 checklist, one level at a time: a tick needs a highlight showing
    where; "not yet" lets the student add it (recorded as added after seeing the
    list) or skip (SOURCES)
  - any word from the China vocab hub opens its card: parts and meaning if the
    student has built it there, otherwise a prompt to go and build it (HUB_WORDS,
    generated from the hub into vocab-data.js)
  - a report with advice and links back to lessons and resources (REPORT)
  - accessibility mode, chosen by the student on Start, as in the accessible Rome CAT
    and the accessible 2.1 page: Big buttons, Read to me (each word lit up, the
    device's own voice), Voice typing on every writing box, reading speed, background
    colours, and zoom in the bottom bar (ACCESS). The report names the supports used.

  Honest interface: the video questions are marked by the page; the table, the
  source answers and the checklist ticks are the student's own and are never
  judged here. The report says which is which.

  Saved on this device as it is typed (china23.module.v1).
-->

<script>
"use strict";
/* =======================================================================
   CONTENT. Year 7 reading text is the 2.3 OneNote lesson plan, word for word
   (one slip fixed: "a women" is "a woman"). Years 6 and 8 keep the same facts.
   ======================================================================= */
const SITE = "../";                       // the history folder of the class site
const HUB = id => SITE + "china/vocab-hub.html#" + id;
const RES = {
  hub21:["Vocab hub 2.1: primary and secondary sources", HUB("2.1")],
  hub23:["Vocab hub 2.3: daily life words", HUB("2.3")],
  hub24:["Vocab hub 2.4: Confucianism, Taoism, Buddhism", HUB("2.4")],
  hub25:["Vocab hub 2.5: origin, purpose, evidence", HUB("2.5")],
  cai:["Cai Lun bump it up: joining a source to what it shows", SITE + "cai-lun/bump-it-up.html"],
  aus:["Ancient Australia bump it up: the four parts of source analysis", SITE + "batman/bump-it-up.html"]
};
const VIDEO = { id:"QO8o3oYuB8I", title:"Interesting Facts about Daily Life in Ancient China for kids" };
const at = s => `https://youtu.be/${VIDEO.id}?t=${s}`;
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

/* The lesson plan's video questions, as answers the page can mark. Options are written so
   the right one is not the longest; the last question is the student's own and is not marked. */
const VQ = [
  { id:"v1", q:"What was life like for most farmers?", t:7, topic:"farmers",
    a:"Tough and difficult, with most work done by hand",
    opts:["Easy, as animals did the work", "Tough and difficult, with most work done by hand", "Comfortable, because farmers were the richest people in a village", "Short and simple, because farmers only worked during the summer"],
    why:"The video calls farmers' lives tough and difficult. They had ploughs and some animals, but most work was done by hand." },
  { id:"v2", q:"What else did farmers owe the government?", t:49, topic:"farmers",
    a:"About a month of work each year, and part of their crops",
    opts:["A share of their silk every spring, but never any of their work", "About a month of work each year, and part of their crops", "Nothing at all, because farmers were the most respected class", "Ten years in the army before they were allowed to farm"],
    why:"Farmers worked for the government for about a month a year (in the army, or building canals, palaces and walls) and paid tax as a share of their crops." },
  { id:"v3", q:"In the north of China, the main crop was…", t:74, topic:"food",
    a:"millet", opts:["rice", "millet", "wheat", "tea"],
    why:"North and south grew different grains: millet in the north, rice in the south." },
  { id:"v4", q:"In the south of China, the main crop was…", t:74, topic:"food",
    a:"rice", opts:["millet", "tea", "rice", "soybeans"],
    why:"Rice grew in the wet south, and later became the main food for much of the country." },
  { id:"v5", q:"Who ruled the Chinese family?", t:129, topic:"family",
    a:"The father of the house", opts:["The eldest daughter", "The father of the house", "The leader of the village", "The youngest son"],
    why:"The father ruled the house. His wife and children had to obey him in all things." },
  { id:"v6", q:"Who went to school in Ancient China?", t:185, topic:"school",
    a:"Only boys from wealthy families", opts:["Every child aged six and up", "Boys and girls from every social class", "Only boys from wealthy families", "Only girls from farming families"],
    why:"Only wealthy boys went to school, to learn calligraphy, Confucius and poetry, skills for officials." },
  { id:"v7", q:"What does the video say about women's lives?", t:199, topic:"women",
    a:"They were seen as less valuable than men",
    opts:["They ruled the house", "They were seen as less valuable than men", "They chose who they married, as long as he was rich", "They went to school with their brothers until they married"],
    why:"Women were considered much less valuable than men, and had no say in who they married." },
  { id:"v8", q:"Which group does the video call the lowest class of workers?", t:227, topic:"classes",
    a:"Merchants", opts:["Farmers", "Merchants", "Craftsmen", "Scholars"],
    why:"Merchants were the lowest class: they could not wear silk or ride in carriages. Farmers were respected for growing food." }
];
const VQ_OWN = { id:"vown", q:"Write down one interesting fact you learned from the video." };

/* The readings: one slide each, in order, as a deck. Year 7 opens with the 2.3 lesson
   plan's paragraph word for word (one slip fixed: "a women" is "a woman") and goes on;
   Years 6 and 8 cover the same ground in plainer or fuller words. Each slide has a photo
   (Wikimedia Commons, licence in its caption) and two have a diagram. */
const READ = [
 { id:"life", title:"Life for the working class", row:"Everyday life", diagram:"pyramid",
   img:{ f:"slide-life.jpg", alt:"A clay model of a rice paddy field, divided into flooded plots with small figures working in them.",
     cap:"A pottery model of a rice paddy, made to be buried in a tomb. Eastern Han dynasty (25 to 220 CE). Photo: Gary Lee Todd, CC BY-SA 4.0, via Wikimedia Commons." },
   t:{
   6:["Most people in Ancient China were peasant farmers. Life was hard. They worked long hours every day, and most of the work was done by hand.",
      "A typical farming village had about 100 families. Each family worked a small farm. Some families had a plough and an ox to help, but people did most jobs themselves. In the north they grew a grain called millet. In the south they grew rice. Families also kept pigs, chickens and goats.",
      "Farmers had to give the government part of their crops as tax. They also worked for the government for about a month each year, in the army or building canals, palaces and city walls. A flood or a dry year could ruin the crops, and then families went hungry.",
      "In towns and cities, a son learned his father's craft, such as making pots or metal tools, and took over the job when his father died. Rich families lived very differently: in big houses with servants, wearing silk and never doing hard work with their hands."],
   7:["The vast majority of Chinese people were peasant farmers for whom life was a constant struggle to survive. They worked long hours every day and most of their work was done by hand. In towns and cities crafts were usually hereditary, with sons learning from their fathers and taking their places when they died.",
      "A typical farming village held about 100 families, each working a small plot of land. Iron ploughs and oxen helped some families, but planting, weeding and harvesting were done by hand. Millet was the main crop in the dry north and rice in the wet south. Families also kept pigs, chickens and goats, and those near rivers caught fish.",
      "Peasants paid tax as a share of their crops, and owed the government about a month of work each year, serving in the army or building canals, palaces and city walls. Floods and droughts could destroy a harvest, and famine was a constant danger.",
      "The ruling classes, the emperor, nobles, officials and rich landowners, lived in large houses built around courtyards, with servants to do the work. They wore silk, ate meat and fine food, and did no manual labour. Many cities were surrounded by thick walls of packed earth, and their gates were locked at night."],
   8:["The vast majority of Chinese people, perhaps nine in every ten, were peasant farmers, and for them life was a constant struggle to survive. A village might hold around a hundred families, each farming a small plot. Iron ploughs pulled by oxen spread during the Warring States and Han periods, but sowing, weeding, irrigating and harvesting still depended on human muscle. Millet dominated the dry north, wheat spread there over time, and rice was grown in flooded paddy fields in the warm, wet south.",
      "The state took its share in two ways. Peasants paid tax as a portion of their harvest, and men owed labour service of about a month each year, in the army or on public works such as canals, roads, palaces and city walls. When floods, droughts or locusts struck, a family could lose a year's food, fall into debt and be forced to sell its land to a richer landowner.",
      "In towns and cities crafts were usually hereditary: potters, carpenters, bronze and iron workers and weavers learned the trade from their fathers and took their places when they died, so a family's work passed down the generations. Merchants could grow rich from trade, yet Confucian thinking ranked them lowest, below farmers, because they produced nothing themselves.",
      "The ruling classes lived in a different world. The emperor, nobles, high officials and great landowning families lived in large courtyard houses staffed by servants, dressed in silk and did no manual labour. Their homes, their clothes and even the models placed in their tombs show the gap between those who worked the land and those who owned it."] } },
 { id:"family", title:"Family", row:"Family",
   img:{ f:"slide-family.jpg", alt:"A clay model of a two-storey house with a tiled roof, windows and a gateway.",
     cap:"A pottery model of a house, made for a Han dynasty tomb. Gongyi Museum, Henan. Photo: Gary Todd, CC0, via Wikimedia Commons." },
   t:{
   6:["The father was the head of the family. His wife and children had to obey him. Children learned from a young age to respect older people, especially older relatives. This respect for parents is called filial piety.",
      "Grandparents, parents and children often all lived in the same house. In the city, many homes were built around an open courtyard in the middle.",
      "Only boys from rich families went to school, and most of them lived in cities. They learned to write beautiful characters with a brush, called calligraphy. They read the teachings of Confucius and studied poetry, so they could work for the government one day.",
      "Parents chose who their children would marry. A son carried on the family name, so sons were valued more than daughters. When parents died, their children kept caring for them, by praying and leaving gifts of food for their ancestors."],
   7:["Only the sons of wealthy families, living mostly in cities, were formally schooled. The father was the master of the house in Chinese families, and the children were taught from an early age that respect for their elders, particularly elder relatives, was key. It was common for three generations of a family to live together in the same dwelling, sometimes more. The eldest male was dominant; women were considered subservient to men, and daughters considered less valuable to the family than sons.",
      "This respect for parents and elders is called filial piety, and Confucius taught that it was the most important of all duties. Children were expected to obey their parents, care for them in old age and never bring shame on the family name.",
      "Schooling was about preparing boys for government. Students learned calligraphy, memorised the Confucian classics and studied poetry. A well-educated young man could be recommended for a position as an official, which brought honour to the whole family.",
      "Families were linked across time as well. Sons inherited the family's land or trade and carried on the family name. The dead became ancestors: families kept tablets with their names at a household altar, prayed to them and made offerings of food, believing the ancestors could help or harm the living. Marriages were arranged by parents, often with little say from the young people themselves."],
   8:["The Chinese family was organised as a hierarchy. The father was master of the house, and his wife, sons, daughters and daughters-in-law owed him obedience; after him, the eldest son held the most authority. Three generations, sometimes more, commonly shared one dwelling, and in towns these homes were often built around an open courtyard.",
      "Confucius made filial piety, respect and obedience towards parents and elders, the root of all good conduct, and later Confucian scholars wrote a whole book about it, the Classic of Filial Piety. Duty to parents did not end at their death: families kept ancestral tablets at a household altar, prayed to the ancestors and offered them food and drink, believing the dead could bless or punish the living.",
      "Only the sons of wealthy families, most of them in the cities, received formal schooling. They learned calligraphy, memorised the Confucian classics and studied poetry, because officials were expected to be cultured as well as capable. In the Han dynasty promising young men were recommended for government posts; later dynasties chose officials by examination. A son's success lifted the status of the whole family.",
      "Marriages were agreements between families rather than choices by individuals. Sons were valued because they continued the family line and performed the ancestral rites, while daughters were expected to leave and join their husband's family, which is why they were considered less valuable to their own."] } },
 { id:"women", title:"Women", row:"Women",
   img:{ f:"slide-women.jpg", alt:"A painted scene of a court lady sitting while a maid arranges her long hair, with a mirror on a stand beside them.",
     cap:"A court lady and her maid, from the Admonitions Scroll, a painting of advice for women at court, attributed to Gu Kaizhi (about 345 to 406 CE). British Museum. Public domain, via Wikimedia Commons." },
   t:{
   6:["Women from every class were seen as less important than men. They looked after the home and the children. Most women spent many hours spinning thread and weaving cloth. In farming families, they worked in the fields too.",
      "A girl's father chose who she would marry. After the wedding she went to live with her husband's family and had to obey them. She was respected more if she had sons. If she had no sons, her husband might take another wife.",
      "A few women became powerful. Ban Zhao was a famous writer and historian of the Han dynasty. Hundreds of years later, Wu Zetian became the only woman to rule China as emperor."],
   7:["Regardless of social class women were considered inferior to men. Women were expected to look after the household and children. In peasant families, they often worked in the fields as well. Their fathers arranged their marriages. Married women had to obey their husband's family, but gained more respect if they produced sons. If a woman failed to give birth to sons, their husband might take other wives.",
      "Confucian teaching described a woman's life as three kinds of obedience: to her father before marriage, to her husband after it, and to her son if she became a widow. Spinning and weaving cloth was women's work in almost every home, and cloth was so valuable that it was traded like money.",
      "Some women still found ways to influence the world around them. Ban Zhao, who lived during the Han dynasty, helped to finish an official history of China and wrote Lessons for Women, a book of advice that told women to be humble and obedient. Empresses and the mothers of young emperors could hold great power at court, and in 690 CE Wu Zetian became the only woman ever to rule China as emperor in her own name."],
   8:["Regardless of social class, women were considered inferior to men, a belief supported by Confucian ideas about order in the family. Women were expected to run the household and raise the children, and in peasant families they also worked in the fields. Marriages were arranged by fathers, and a married woman joined, and had to obey, her husband's family. Her status rose if she gave birth to sons, who would continue the family line and care for the ancestors; if she had none, her husband might take other wives.",
      "Confucian writers summed up the ideal as the \"three obediences\": a woman obeyed her father before marriage, her husband during it and her son in widowhood. Women's work centred on the household, above all spinning and weaving, and in peasant families it included long days in the fields. Wealthy women had servants to do the heaviest work, but they had little freedom to leave the home.",
      "The historian Ban Zhao shows how complicated this picture is. A highly educated woman of the Han dynasty, she completed an official history of the dynasty begun by her father and brother, and taught at the imperial court. Yet her best-known work, Lessons for Women, urged women to be humble, modest and obedient. Women could also gain power through the court: empresses sometimes governed for young emperors, and Wu Zetian ruled as emperor from 690 to 705 CE.",
      "Some customs often linked with ancient China came much later. Foot binding, mentioned in the video, probably began around the 900s CE, more than a thousand years after the Han dynasty, and spread over the centuries that followed."] } },
 { id:"religion", title:"Religion", row:"Religion", diagram:"pillars",
   img:{ f:"slide-religion.jpg", alt:"A painting of three old men in robes laughing together beside a bridge over a stream, with trees around them.",
     cap:"Three Laughs at Tiger Brook, a Song dynasty painting: a Confucian, a Taoist and a Buddhist share a joke, a picture of the three pillars getting along. Public domain, via Wikimedia Commons." },
   t:{
   6:["Three sets of beliefs shaped life in Ancient China: Confucianism, Taoism and Buddhism. They are called the \"three pillars\", because together they held up Chinese society.",
      "Confucianism came from a teacher called Confucius. He taught that people should be kind, respect their parents and elders, and do their duty. Taoism taught people to live simply and in harmony with nature. Buddhism came from India much later. It taught that people could end their suffering by letting go of wanting things.",
      "Older than all three was respect for ancestors. Families prayed to their dead relatives and gave them gifts of food. Many people followed more than one belief at the same time."],
   7:["Confucianism, Taoism, and Buddhism are considered the \"three pillars\" of ancient Chinese society. As philosophies and religions, they not only influenced spirituality, but also government, science, the arts, and social structure. Though their specific beliefs and teachings have occasionally been at odds with each other, there has been much room for overlap.",
      "Confucianism, based on the teachings of Confucius (551 to 479 BCE), was less about gods than about how to live: respect for parents and elders, loyalty, good manners, and rulers who set a good example. In the Han dynasty, Emperor Wu made it the official teaching of the government, so officials had to study it.",
      "Taoism taught people to follow the Tao, \"the way\" of nature, by living simply and in balance; the symbol of yin and yang shows two opposite forces working together. Buddhism began in India and reached China along the Silk Road in about the 1st century CE, bringing monks, temples and the idea of rebirth.",
      "Underneath all three lay much older beliefs. Kings of the Shang dynasty asked questions of their ancestors and gods by cracking oracle bones, and families of every class kept honouring their ancestors with prayers and offerings. Most people mixed beliefs: Confucian ideas at home and at work, Taoist ideas about health and nature, and Buddhist ideas about the afterlife."],
   8:["Confucianism, Taoism and Buddhism are considered the \"three pillars\" of ancient Chinese society. As philosophies and religions they shaped not only spiritual life but government, science, the arts and the social order. Their teachings sometimes clashed, yet there was much overlap, and many people followed more than one.",
      "Confucius (551 to 479 BCE) lived at a time of war between states, and taught that order would return if everyone fulfilled their role: rulers governing with virtue, sons honouring fathers, the young respecting the old. Under Emperor Wu of the Han dynasty, Confucianism became the official teaching of the state, and its classics became the training for officials.",
      "Taoism, traditionally traced to a thinker called Laozi (historians are not sure he existed), urged people to follow the Tao, the natural \"way\" of the universe, without forcing things. It had two sides: a philosophy of living simply, and a religion with priests, rituals and the search for long life. Yin and yang, an older idea about balance, were taken up by Taoist thinkers, and Taoism shaped medicine too. Buddhism, founded in India by the Buddha, arrived along the Silk Road in about the 1st century CE and spread widely after the fall of the Han, bringing monasteries, sacred texts and teachings about karma, rebirth and nirvana.",
      "These traditions sat on top of far older practice. Shang kings consulted their ancestors and gods by heating oracle bones until they cracked and reading the cracks, and ancestor worship remained part of family life in every class. Because the three pillars answered different questions, about society, nature and the afterlife, many Chinese followed parts of all three at once."] } },
 { id:"fun", title:"Entertainment", row:"Entertainment",
   img:{ f:"slide-fun.jpg", alt:"A grey carved brick showing small figures: acrobats balancing and tumbling, with seated guests and musicians at a banquet.",
     cap:"A carved brick from an Eastern Han tomb (25 to 220 CE), showing acrobats performing at a banquet. Photo: Editor at Large, CC BY-SA 2.5, via Wikimedia Commons." },
   t:{
   6:["Working families had very little time or money for fun. The best times were festivals, such as the New Year, when families feasted and celebrated together.",
      "Rich families had much more. They held feasts with music and dancing. Musicians played drums, bells, flutes and stringed instruments. In the Zhou dynasty, acting, music and dance were mixed together to tell famous stories, the start of Chinese opera.",
      "People played board games from about 500 BCE. One was liubo, a game with sticks and counters. Another was weiqi, a game of black and white stones that people still play today, called Go.",
      "From the Qin dynasty, acrobats were popular. They juggled, balanced and tumbled to entertain rich guests. Some people also enjoyed cock-fighting, horse racing and hunting. A ball game called cuju, a bit like soccer, was played too."],
   7:["For the working class there was very little time or money for any kind of entertainment, apart from occasional festivals. In contrast, for the ruling classes, and some wealthy merchants, several forms of entertainment were available. During the Zhou dynasty acting, music and dance were combined into Chinese opera, in which famous legends were performed. There were a variety of board games from 500BCE. From the time of the Qin dynasty, acrobatics became another popular form of entertainment.",
      "Festivals broke up the farming year for everyone. The New Year was the biggest, a time for feasting, honouring the ancestors and visiting family, and villages held celebrations after the harvest.",
      "At the banquets of the rich, musicians played sets of bronze bells, drums, flutes and stringed instruments such as the zither, while dancers and acrobats performed. Board games included liubo, played with throwing sticks and counters, and weiqi, the game of black and white stones known today as Go. A kicking game called cuju was played for fun and to train soldiers.",
      "Much of what we know comes from tombs. Carved bricks and clay figures buried with wealthy people show jugglers, musicians, dancers and feasts, because families hoped the dead would enjoy them in the afterlife."],
   8:["For the working class there was very little time or money for entertainment apart from occasional festivals. The ruling classes, and some wealthy merchants, could afford far more. During the Zhou dynasty, acting, music and dance were combined in performances of famous legends, early forms of what became Chinese opera. Board games were played from about 500 BCE, and from the Qin dynasty acrobatics became a popular spectacle.",
      "Festivals marked the farming year for every class. The New Year was the greatest, a time of feasting, offerings to the ancestors and family visits, and harvest celebrations brought villages together.",
      "By the Han dynasty, court performances known as the \"hundred entertainments\" combined acrobatics, juggling, sword-play, tightrope walking, music and dance. Wealthy households employed musicians who played bronze bells and chime stones, drums, pipes and the zither, and the scholar's zither, the guqin, became a symbol of refinement. Liubo, a race game played with throwing sticks, was a favourite of the Han elite; weiqi, now known as Go, was already old; and cuju, a ball-kicking game, was used to train soldiers as well as to entertain. Hunting, cock-fighting and dog and horse racing were pastimes of the rich.",
      "Almost all of this evidence comes from the wealthy: carved tomb bricks, painted figurines and written records describe their pleasures, while the entertainments of ordinary people, songs, stories and village festivals, left far fewer traces."] } },
 { id:"death", title:"Death and burials", row:"Death and burials",
   img:{ f:"slide-death.jpg", alt:"Rows of life-size clay horses and soldiers standing in a long earth pit.",
     cap:"Clay horses and soldiers of the Terracotta Army in Pit 1, near the tomb of Qin Shi Huang. Photo: Gary Todd, CC0, via Wikimedia Commons." },
   t:{
   6:["We know very little about how poor people were buried. We know much more about rich people's funerals, because they could pay for big tombs that still survive.",
      "From about 5000 BCE, rich people were buried with food, drink and other things, so they would have them in the afterlife. Later, families buried clay models of houses, farms, animals and servants with the dead.",
      "Shang kings were buried with bronze pots, jade, chariots and horses, and sometimes even people. At funerals, rich families asked Taoist and Buddhist priests and Confucian scholars to help, and mourners wore white to show their sadness.",
      "The famous Terracotta Warriors were buried to guard the tomb of China's first emperor, Qin Shi Huang. Thousands of workers spent years building his tomb."],
   7:["There is little information available about death among the poor. However, the funeral customs of the ruling classes we know a lot about. They could afford elaborate tombs. A rich family might employ Taoist and Buddhist priests and Confucian scholars to play a role at the funeral. From about 5000BCE it was the custom of the ruling classes to bury goods, including food and drink with the dead so they would have them in the after life. The famous Terracotta warriors were buried to guard the tomb of China's first emperor Qin Shihuang.",
      "Shang dynasty kings were buried in huge pits with bronze vessels, jade, chariots, horses and even servants and prisoners, who were sacrificed to serve them after death. Over the centuries human sacrifice became rare, and families instead buried figures and models made of clay or wood.",
      "In the Han dynasty, tombs were filled with pottery models of everyday life: houses, farms, rice fields, wells, animals and servants. These models, made to be useful in the afterlife, are now some of our best evidence of how people lived.",
      "Funerals followed strict rules. Mourners wore plain white clothes, and children were expected to mourn their parents for a long time, ideally three years, as part of filial piety. The tomb of Qin Shi Huang was built by hundreds of thousands of workers, and the Terracotta Army of about 8,000 clay soldiers was only one part of it."],
   8:["Little information survives about death among the poor, but the funeral customs of the ruling classes are well known, because they could afford elaborate tombs that archaeologists have excavated. A rich family might employ Taoist and Buddhist priests and Confucian scholars to take part in a funeral. From about 5000 BCE the ruling classes buried goods, including food and drink, with the dead so that they would have them in the afterlife.",
      "The richest burials of early China belong to the Shang kings at Anyang: deep shaft tombs filled with bronze ritual vessels, jade, weapons and chariots, along with horses and many sacrificed people, intended to serve the king after death. Human sacrifice declined under the Zhou and became rare, replaced by figures of wood and clay.",
      "Han tombs show a different idea of the afterlife: a home for the dead modelled on the world of the living. They held pottery models of courtyard houses, granaries, wells, pigsties and rice paddies, with figures of servants, musicians and entertainers. The richest Han nobles were even buried in suits made of thousands of jade pieces, which were thought to preserve the body.",
      "Funeral rites were detailed and strict. Mourners dressed in coarse white cloth, and Confucian custom expected a son to mourn a parent for about three years. At the extreme of royal burial, Qin Shi Huang's mausoleum was built by hundreds of thousands of labourers; the Terracotta Army of about 8,000 life-size soldiers, horses and chariots stood guard in pits nearby."] } }
