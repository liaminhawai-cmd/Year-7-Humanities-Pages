<!--
  Ancient China lesson 2.3, Daily life, as a full-screen module for a work-from-home
  day. Hidden: not in the site map, opened by its address. It follows the 2.3 OneNote
  lesson plan: Engage (the video and its questions), Discover and develop (the
  readings and the ruling-class and working-class table), and the two sources with
  their questions (Source 1, Michael Loewe; Source 2, the Shang charioteer).

  What the teacher asked for, and where it lives in the code:
  - full-screen lock with no password, as in the accessible 2.1 page: leaving full
    screen or the page covers the module until the student goes back; every exit is
    logged in the report (LOCK)
  - Words: the vocab hub's lesson 2.3, inside the module (WORDS)
  - the video embedded, with its questions after it; two wrong answers in a row
    sends the student back to question 1, at the teacher's request, against the
    house "never wipe earned progress" rule (VIDEO). First tries are kept for the report
  - a little spaced repetition: two "Remember?" checks later in the module re-ask
    what was missed (REMEMBER)
  - the readings as slides, free to move back and forth, at Year 6, 7 or 8 level:
    Year 7 is the lesson plan's text; the other two keep the same facts (READ)
  - big ideas (Buddhism and others) open a box with more (CONCEPTS)
  - each source answered blind, then checked against Level 5, 6, 7, 8 and an
    optional 9 checklist, one level at a time: a tick needs a highlight showing
    where; "not yet" lets the student add it (recorded as added after seeing the
    list) or skip (SOURCES)
  - any word from the China vocab hub opens its card: parts and meaning if the
    student has built it there, otherwise a prompt to go and build it (HUB_WORDS,
    generated from the hub into vocab-data.js)
  - a report with advice and links back to lessons and resources (REPORT)
  - accessibility mode, chosen by the student on Start, as in the accessible Rome CAT
    and the accessible 2.1 page: Big buttons, Read to me (each word lit up, the
    device's own voice), Voice typing on every writing box, reading speed, background
    colours, and zoom in the bottom bar (ACCESS). The report names the supports used.

  Honest interface: the video questions are marked by the page; the table, the
  source answers and the checklist ticks are the student's own and are never
  judged here. The report says which is which.

  Saved on this device as it is typed (china23.module.v1).
-->

<script>
"use strict";
/* =======================================================================
   CONTENT. Year 7 reading text is the 2.3 OneNote lesson plan, word for word
   (one slip fixed: "a women" is "a woman"). Years 6 and 8 keep the same facts.
   ======================================================================= */
const SITE = "../";                       // the history folder of the class site
const HUB = id => SITE + "china/vocab-hub.html#" + id;
const RES = {
  hub21:["Vocab hub 2.1: primary and secondary sources", HUB("2.1")],
  hub23:["Vocab hub 2.3: daily life words", HUB("2.3")],
  hub24:["Vocab hub 2.4: Confucianism, Taoism, Buddhism", HUB("2.4")],
  hub25:["Vocab hub 2.5: origin, purpose, evidence", HUB("2.5")],
  cai:["Cai Lun bump it up: joining a source to what it shows", SITE + "cai-lun/bump-it-up.html"],
  aus:["Ancient Australia bump it up: the four parts of source analysis", SITE + "batman/bump-it-up.html"]
};
const VIDEO = { id:"QO8o3oYuB8I", title:"Interesting Facts about Daily Life in Ancient China for kids" };
const at = s => `https://youtu.be/${VIDEO.id}?t=${s}`;
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

/* The lesson plan's video questions, as answers the page can mark. Options are written so
   the right one is not the longest; the last question is the student's own and is not marked. */
const VQ = [
  { id:"v1", q:"What was life like for most farmers?", t:7, topic:"farmers",
    a:"Tough and difficult, with most work done by hand",
    opts:["Easy, as animals did the work", "Tough and difficult, with most work done by hand", "Comfortable, because farmers were the richest people in a village", "Short and simple, because farmers only worked during the summer"],
    why:"The video calls farmers' lives tough and difficult. They had ploughs and some animals, but most work was done by hand." },
  { id:"v2", q:"What else did farmers owe the government?", t:49, topic:"farmers",
    a:"About a month of work each year, and part of their crops",
    opts:["A share of their silk every spring, but never any of their work", "About a month of work each year, and part of their crops", "Nothing at all, because farmers were the most respected class", "Ten years in the army before they were allowed to farm"],
    why:"Farmers worked for the government for about a month a year (in the army, or building canals, palaces and walls) and paid tax as a share of their crops." },
  { id:"v3", q:"In the north of China, the main crop was…", t:74, topic:"food",
    a:"millet", opts:["rice", "millet", "wheat", "tea"],
    why:"North and south grew different grains: millet in the north, rice in the south." },
  { id:"v4", q:"In the south of China, the main crop was…", t:74, topic:"food",
    a:"rice", opts:["millet", "tea", "rice", "soybeans"],
    why:"Rice grew in the wet south, and later became the main food for much of the country." },
  { id:"v5", q:"Who ruled the Chinese family?", t:129, topic:"family",
    a:"The father of the house", opts:["The eldest daughter", "The father of the house", "The leader of the village", "The youngest son"],
    why:"The father ruled the house. His wife and children had to obey him in all things." },
  { id:"v6", q:"Who went to school in Ancient China?", t:185, topic:"school",
    a:"Only boys from wealthy families", opts:["Every child aged six and up", "Boys and girls from every social class", "Only boys from wealthy families", "Only girls from farming families"],
    why:"Only wealthy boys went to school, to learn calligraphy, Confucius and poetry, skills for officials." },
  { id:"v7", q:"What does the video say about women's lives?", t:199, topic:"women",
    a:"They were seen as less valuable than men",
    opts:["They ruled the house", "They were seen as less valuable than men", "They chose who they married, as long as he was rich", "They went to school with their brothers until they married"],
    why:"Women were considered much less valuable than men, and had no say in who they married." },
  { id:"v8", q:"Which group does the video call the lowest class of workers?", t:227, topic:"classes",
    a:"Merchants", opts:["Farmers", "Merchants", "Craftsmen", "Scholars"],
    why:"Merchants were the lowest class: they could not wear silk or ride in carriages. Farmers were respected for growing food." }
];
const VQ_OWN = { id:"vown", q:"Write down one interesting fact you learned from the video." };

/* The readings, one slide per row of the table. */
const READ = [
 { id:"life", title:"Life for the working class", row:"Everyday life", t:{
   6:"Most people in Ancient China were peasant farmers. Life was hard. They worked long hours every day, and most of the work was done by hand. In towns and cities, a son learned his father's craft and took over the job when his father died.",
   7:"The vast majority of Chinese people were peasant farmers for whom life was a constant struggle to survive. They worked long hours every day and most of their work was done by hand. In towns and cities crafts were usually hereditary, with sons learning from their fathers and taking their places when they died.",
   8:"The vast majority of Chinese people were peasant farmers, and for them life was a constant struggle to survive. They worked long hours, mostly by hand, and owed the government a share of their crops as tax and about a month of labour each year, in the army or on building projects. In towns and cities crafts were usually hereditary: sons learned the trade from their fathers and took their places when they died, so a family's work passed down the generations." } },
 { id:"family", title:"Family", row:"Family", t:{
   6:"Only boys from rich families went to school, and most of them lived in cities. The father was in charge of the family. Children learned from a young age to respect older people, especially older relatives. Grandparents, parents and children often all lived in the same house. Women had to obey men, and girls were seen as less valuable than boys.",
   7:"Only the sons of wealthy families, living mostly in cities, were formally schooled. The father was the master of the house in Chinese families, and the children were taught from an early age that respect for their elders, particularly elder relatives, was key. It was common for three generations of a family to live together in the same dwelling, sometimes more. The eldest male was dominant; women were considered subservient to men, and daughters considered less valuable to the family than sons.",
   8:"Only the sons of wealthy families, most of them in the cities, received formal schooling, where they studied calligraphy, poetry and the teachings of Confucius. The father was master of the house, and children were taught from an early age that respect for their elders, especially elder relatives, was essential. That respect continued after death, through prayers and offerings to ancestors. Three generations, sometimes more, commonly shared one dwelling. The eldest male was dominant; women were expected to be subservient to men, and daughters were valued less than sons." } },
 { id:"women", title:"Women", row:"Women", t:{
   6:"Women from every class were seen as less important than men. They looked after the home and the children. In farming families they worked in the fields too. A girl's father chose who she would marry. A married woman had to obey her husband's family. She was respected more if she had sons. If she had no sons, her husband might take another wife.",
   7:"Regardless of social class women were considered inferior to men. Women were expected to look after the household and children. In peasant families, they often worked in the fields as well. Their fathers arranged their marriages. Married women had to obey their husband's family, but gained more respect if they produced sons. If a woman failed to give birth to sons, their husband might take other wives.",
   8:"Regardless of social class, women were considered inferior to men, a belief supported by Confucian ideas about order in the family. Women were expected to run the household and raise the children, and in peasant families they also worked in the fields. Marriages were arranged by fathers, and a married woman joined, and had to obey, her husband's family. Her status rose if she gave birth to sons, who would continue the family line and care for the ancestors; if she had none, her husband might take other wives." } },
 { id:"religion", title:"Religion", row:"Religion", t:{
   6:"Three sets of beliefs shaped life in Ancient China: Confucianism, Taoism and Buddhism. They are called the \"three pillars\". They changed how people thought about the spirit world, and also how the country was run, as well as science, art and the way society was organised. They sometimes disagreed, but they also shared many ideas.",
   7:"Confucianism, Taoism, and Buddhism are considered the \"three pillars\" of ancient Chinese society. As philosophies and religions, they not only influenced spirituality, but also government, science, the arts, and social structure. Though their specific beliefs and teachings have occasionally been at odds with each other, there has been much room for overlap.",
   8:"Confucianism, Taoism and Buddhism are considered the \"three pillars\" of ancient Chinese society. Confucianism and Taoism grew in China during the Zhou dynasty; Buddhism arrived later from India, along the Silk Road. As philosophies and religions they shaped not only spiritual life but government, science, the arts and the social order. Their teachings sometimes clashed, yet there was much overlap, and many people followed more than one." } },
 { id:"fun", title:"Entertainment", row:"Entertainment", t:{
   6:"Working families had very little time or money for fun, except at festivals now and then. Rich families had much more. In the Zhou dynasty, acting, music and dance were mixed together to tell famous stories, the start of Chinese opera. People played board games from about 500 BCE. From the Qin dynasty, acrobatics were popular too.",
   7:"For the working class there was very little time or money for any kind of entertainment, apart from occasional festivals. In contrast, for the ruling classes, and some wealthy merchants, several forms of entertainment were available. During the Zhou dynasty acting, music and dance were combined into Chinese opera, in which famous legends were performed. There were a variety of board games from 500BCE. From the time of the Qin dynasty, acrobatics became another popular form of entertainment.",
   8:"For the working class there was very little time or money for entertainment apart from occasional festivals. The ruling classes, and some wealthy merchants, could afford far more. During the Zhou dynasty, acting, music and dance were combined in performances of famous legends, early forms of what became Chinese opera. Board games were played from about 500 BCE, and from the Qin dynasty acrobatics became a popular spectacle. Much of what we know comes from what the wealthy left behind, such as carvings in their tombs." } },
 { id:"death", title:"Death and burials", row:"Death and burials", t:{
